<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NACHA [DEV] 開発公開版</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#120E15">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%B7%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=M+PLUS+Rounded+1c:wght@700;900&family=Noto+Serif+JP:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/site.css">
<style>
:root {
  --dev-bg: #110C13;
  --dev-card: #1D1522;
  --dev-ink: #FAF5F0;
  --dev-sub: #A89CAE;
  --dev-line: rgba(255,255,255,0.1);
  --dev-gold: #E5B338;
}

body {
  background: radial-gradient(circle at 50% 10%, #23152B 0%, #0D0811 100%);
  color: var(--dev-ink);
  font-family: "M PLUS Rounded 1c", -apple-system, sans-serif;
  margin: 0;
  padding: 0 0 60px;
  min-height: 100dvh;
}

/* 開発用ミニマムヘッダー */
.dev-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  background: rgba(17, 12, 19, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--dev-line);
}
.dev-badge {
  background: rgba(229, 179, 56, 0.2);
  color: var(--dev-gold);
  border: 1px solid rgba(229, 179, 56, 0.4);
  font-size: 11px;
  font-weight: 900;
  padding: 3px 10px;
  border-radius: 999px;
  letter-spacing: 0.5px;
}
.btn-to-prod {
  color: var(--dev-sub);
  text-decoration: none;
  font-size: 12px;
  font-weight: 700;
  background: rgba(255,255,255,0.06);
  padding: 4px 12px;
  border-radius: 999px;
  border: 1px solid var(--dev-line);
  transition: all 0.2s;
}
.btn-to-prod:hover {
  color: #fff;
  border-color: rgba(255,255,255,0.3);
}

/* ゲート画面 */
#adminGate {
  max-width: 380px;
  margin: 80px auto;
  padding: 36px 24px;
  background: var(--dev-card);
  border: 1px solid var(--dev-line);
  border-radius: 24px;
  text-align: center;
}

/* アプリ本体（イメージ主役・文字最小限） */
#devApp {
  display: none;
  max-width: 480px;
  margin: 0 auto;
  padding: 16px 18px 40px;
  text-align: center;
  box-sizing: border-box;
}

/* ナチャの美しい主役ポートレート */
.hero-visual {
  margin: 10px 0 24px;
  position: relative;
}
.nacha-portrait-wrap {
  width: 170px;
  height: 170px;
  margin: 0 auto 12px;
  cursor: pointer;
  position: relative;
  transition: transform 0.25s cubic-bezier(0.2, 1.4, 0.4, 1);
}
.nacha-portrait-wrap:hover {
  transform: scale(1.06);
}
.nacha-portrait-wrap:active {
  transform: scale(0.95);
}
.nacha-portrait-img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 12px 24px rgba(0,0,0,0.6));
}

/* キャラの邪魔を一切しない、足元の一言 */
.zen-word-pill {
  display: inline-block;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.14);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  padding: 6px 18px;
  border-radius: 999px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

/* =====================================
   イメージ主役の2大ビジュアルカード
   ===================================== */
.visual-cards-grid {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-bottom: 28px;
}

.visual-card {
  position: relative;
  height: 140px;
  border-radius: 22px;
  overflow: hidden;
  text-decoration: none;
  display: flex;
  align-items: flex-end;
  padding: 18px 20px;
  box-sizing: border-box;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  border: 1px solid var(--dev-line);
  transition: all 0.25s cubic-bezier(0.2, 1.4, 0.4, 1);
}
.visual-card:hover {
  transform: translateY(-3px) scale(1.02);
  border-color: rgba(255,255,255,0.3);
  box-shadow: 0 16px 40px rgba(0,0,0,0.6);
}
.visual-card:active {
  transform: scale(0.98);
}

/* カード背景画像とグラデーション */
.card-bg-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s ease;
}
.visual-card:hover .card-bg-img {
  transform: scale(1.05);
}
.card-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(10,5,15,0.92) 0%, rgba(10,5,15,0.35) 60%, transparent 100%);
}

.card-body {
  position: relative;
  z-index: 2;
  text-align: left;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  width: 100%;
}
.card-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--dev-gold);
  letter-spacing: 1px;
  margin-bottom: 2px;
}
.card-title {
  font-family: "Noto Serif JP", serif;
  font-size: 20px;
  font-weight: 900;
  color: #fff;
  margin: 0;
  letter-spacing: 0.5px;
}
.card-icon-circle {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.3);
  display: grid;
  place-items: center;
  font-size: 20px;
  flex-shrink: 0;
}

/* ビジュアルサムネイル小回遊（写真風） */
.visual-sub-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.sub-thumb-card {
  position: relative;
  height: 90px;
  border-radius: 16px;
  overflow: hidden;
  text-decoration: none;
  display: flex;
  align-items: flex-end;
  padding: 10px 12px;
  border: 1px solid var(--dev-line);
  box-sizing: border-box;
  transition: all 0.2s;
}
.sub-thumb-card:hover {
  transform: translateY(-2px);
  border-color: rgba(255,255,255,0.3);
}
.sub-thumb-title {
  position: relative;
  z-index: 2;
  font-size: 13px;
  font-weight: 800;
  color: #fff;
}
</style>
</head>
<body>

<!-- 開発用トップバー -->
<div class="dev-topbar">
  <div style="display:flex;align-items:center;gap:8px;">
    <span class="dev-badge">🛠️ DEV STAGING</span>
    <span id="adminStatusTxt" style="font-size:11px;color:var(--dev-sub);">管理者限定</span>
  </div>
  <a href="../" class="btn-to-prod">通常公開版 ↗</a>
</div>

<!-- 認証ゲート（未認証時に表示） -->
<div id="adminGate">
  <div style="font-size:44px;margin-bottom:12px;" id="gateIcon">🔒</div>
  <h2 style="font-size:18px;margin:0 0 8px;color:#fff;" id="gateTitle">確認中…</h2>
  <p style="font-size:13px;color:var(--dev-sub);margin:0 0 20px;" id="gateDesc">管理者権限を確認しています。</p>
  <div id="gateAction"></div>
</div>

<!-- ==============================================
     開発公開版（文字最小限・イメージ主役）
     ============================================== -->
<div id="devApp">

  <!-- 主役：ナチャの美しいポートレート -->
  <section class="hero-visual">
    <div class="nacha-portrait-wrap" id="nachaAvatarBtn" title="タップしてね">
      <img class="nacha-portrait-img" id="nachaImg" src="../assets/nacha-wink.webp" alt="Nacha">
    </div>
    <div class="zen-word-pill" id="nachaWord">
      生きてるだけで、今日のはなまる満点！
    </div>
  </section>

  <!-- イメージ主役の2大ビジュアルカード（文字はタイトルのみ） -->
  <section class="visual-cards-grid">

    <!-- ① 推し活お守り・絵馬 -->
    <a href="../amulet/" class="visual-card">
      <img class="card-bg-img" src="../assets/poster.jpg" alt="蓮華護身符" style="object-position: 50% 20%;">
      <div class="card-overlay"></div>
      <div class="card-body">
        <div>
          <div class="card-label">OSHI PRAYER</div>
          <h2 class="card-title">推し活・心願お守り</h2>
        </div>
        <div class="card-icon-circle">🧧</div>
      </div>
    </a>

    <!-- ② こころの休憩所 -->
    <a href="../rest/" class="visual-card">
      <img class="card-bg-img" src="../assets/waiting.jpg" alt="こころの休憩所" style="object-position: 50% 40%;">
      <div class="card-overlay"></div>
      <div class="card-body">
        <div>
          <div class="card-label">MINDFUL REST</div>
          <h2 class="card-title">こころの休憩所</h2>
        </div>
        <div class="card-icon-circle">🪷</div>
      </div>
    </a>

  </section>

  <!-- 小さなビジュアルカード（木魚・物語） -->
  <section class="visual-sub-row">
    <a href="../arcade/mokugyo/" class="sub-thumb-card">
      <img class="card-bg-img" src="../assets/nacha-spear.webp" alt="木魚" style="object-position: 50% 30%;">
      <div class="card-overlay"></div>
      <span class="sub-thumb-title">🪵 電子木魚</span>
    </a>
    <a href="../characters/" class="sub-thumb-card">
      <img class="card-bg-img" src="../assets/cast.jpg" alt="物語" style="object-position: 50% 30%;">
      <div class="card-overlay"></div>
      <span class="sub-thumb-title">🏮 お寺の物語</span>
    </a>
  </section>

</div>

<script>
// ============================================
// 管理者権限認証ロジック
// ============================================
(function() {
  'use strict';

  var API = 'https://remitech-chores.jaykim-can.workers.dev/nacha';
  var KEY = 'nacha-auth';
  var HUBKEY = 'remitech-auth';

  var gate = document.getElementById('adminGate');
  var gateIcon = document.getElementById('gateIcon');
  var gateTitle = document.getElementById('gateTitle');
  var gateDesc = document.getElementById('gateDesc');
  var gateAction = document.getElementById('gateAction');
  var devApp = document.getElementById('devApp');
  var adminStatusTxt = document.getElementById('adminStatusTxt');

  function readAuth(k) {
    try {
      var v = JSON.parse(localStorage.getItem(k) || 'null');
      return (v && v.token && v.exp > Date.now()) ? v : null;
    } catch(e) { return null; }
  }

  var authState = readAuth(KEY) || readAuth(HUBKEY);

  function showGateError(icon, title, desc, actionHtml) {
    gate.style.display = 'block';
    devApp.style.display = 'none';
    gateIcon.textContent = icon;
    gateTitle.textContent = title;
    gateDesc.innerHTML = desc;
    gateAction.innerHTML = actionHtml || '';
  }

  if (!authState || !authState.token) {
    showGateError('🔒', 'ログインが必要です', '開発公開版（nacha/dev）を見るには管理者ログインが必要です。', '<a href="../team/" class="btn" style="padding:10px 24px;border-radius:999px;">マイページでログイン</a>');
    return;
  }

  fetch(API + '/auth/renew', {
    method: 'POST',
    cache: 'no-store',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + authState.token
    },
    body: JSON.stringify({})
  })
  .then(function(res) { return res.json().catch(function() { return {}; }); })
  .then(function(data) {
    if (!data.ok || !data.user) {
      showGateError('🔑', 'ログイン期限切れ', '再度ログインしてからお試しください。', '<a href="../team/" class="btn" style="padding:10px 24px;border-radius:999px;">ログインし直す</a>');
      return;
    }

    var user = data.user;
    if (!user.admin && !user.owner) {
      showGateError('⛔', '管理者権限がありません', '現在のアカウント（<b>' + (user.id || '一般ユーザー') + '</b>）には管理者権限がありません。', '<a href="../" class="btn" style="padding:10px 24px;border-radius:999px;">通常公開版へ戻る</a>');
      return;
    }

    // 認証成功！
    gate.style.display = 'none';
    devApp.style.display = 'block';
    if (adminStatusTxt) adminStatusTxt.textContent = (user.id || '管理者') + ' で接続中';
  })
  .catch(function() {
    showGateError('📡', '通信エラー', '認証サーバーに接続できませんでした。', '<button onclick="location.reload()" class="btn">再読み込み</button>');
  });

  // ナチャのタップで画像と言葉がふわっと切り替わる（吹き出し被りゼロ）
  var avatarBtn = document.getElementById('nachaAvatarBtn');
  var word = document.getElementById('nachaWord');
  var img = document.getElementById('nachaImg');
  var images = ['../assets/nacha-wink.webp', '../assets/nacha-pray.webp', '../assets/nacha-spear.webp'];
  var quotes = [
    "生きてるだけで、今日のはなまる満点！",
    "疲れたら何もしなくていいんだよ。",
    "大丈夫、僕がずっと君の味方さ！",
    "神席当たりますように！一緒に祈ろう！"
  ];
  var qIdx = 0;
  if (avatarBtn) {
    avatarBtn.addEventListener('click', function() {
      qIdx = (qIdx + 1) % quotes.length;
      word.textContent = quotes[qIdx];
      img.src = images[qIdx % images.length];
    });
  }

})();
</script>
</body>
</html>
