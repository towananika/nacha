<main id="main">
<h1 class="pt" data-i="jn_title">会員登録</h1>
<p class="ps" data-i="jn_sub">登録すると一般ユーザーになります。とわないか共通のアカウントです</p>
<section class="card authc">
  <div class="seg"><a href="../team/" data-i="tm_login">ログイン</a><span class="on" data-i="jn_title">会員登録</span></div>
  <form id="joinForm" autocomplete="on" novalidate>
    <label><span data-i="tm_id">ID</span><input id="jId" name="username" autocomplete="username" required minlength="3" maxlength="20"></label>
    <label><span data-i="jn_email">メールアドレス（任意）</span><input id="jEmail" name="email" type="email" autocomplete="email" maxlength="100"></label>
    <label><span data-i="tm_pw">パスワード</span><input id="jPw" name="new-password" type="password" autocomplete="new-password" required minlength="8" maxlength="64"></label>
    <label><span data-i="jn_pw2">パスワード（確認）</span><input id="jPw2" type="password" autocomplete="new-password" required minlength="8" maxlength="64"></label>
    <p class="hint" data-i="jn_hint">IDは英数字3〜20文字、パスワードは8文字以上</p>
    <button class="btn" type="submit" id="jSubmit"><span data-i="jn_title">会員登録</span></button>
    <p class="amsg" id="jMsg" role="alert"></p>
    <a class="linkbtn" href="../team/"><span data-i="jn_have">すでに登録済みの方はログイン</span></a>
  </form>
</section>
