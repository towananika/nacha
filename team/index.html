<main id="main">
<h1 class="pt" data-i="tm_title">関係者ページ</h1>
<p class="ps" data-i="tm_sub">開発用の非公開資料は、関係者だけが見られます</p>

<section id="authBox" class="card authc" hidden>
  <div class="seg"><span class="on" data-i="tm_login">ログイン</span><a href="../join/" data-i="jn_title">会員登録</a></div>
  <div class="gbox" id="gBox" hidden><div class="gbtn" id="gBtn"></div><button class="abtn" type="button" disabled aria-disabled="true"><span data-i="g_apple">Appleでログイン（準備中）</span></button><p class="or"><span data-i="g_or">または</span></p></div>
  <form id="authForm" autocomplete="on">
    <label><span data-i="tm_idmail">IDまたはメール</span><input id="aId" name="username" autocomplete="username" required minlength="3" maxlength="100"></label>
    <label><span data-i="tm_pw">パスワード</span><input id="aPw" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="64"></label>
    <button class="btn" type="submit" id="aSubmit"><span id="aSubmitL" data-i="tm_login">ログイン</span></button>
    <p class="amsg" id="aMsg" role="alert"></p>
    <a class="linkbtn" href="../join/"><span data-i="tm_toreg">アカウントがない方はこちら</span></a>
  </form>
</section>

<section id="meBox" class="card mec" hidden>
  <div class="me"><b id="meId"></b><span class="badge" id="meRole"></span></div>
  <div class="glink"><small id="gLinked" hidden></small><div id="gLink"></div></div>
  <button class="btn alt sm" type="button" id="logoutBtn"><span data-i="tm_out">ログアウト</span></button>
</section>
<p class="card note2" id="generalNote" hidden><span data-i="tm_general">一般ユーザーとしてログイン中です。関係者の資料は、管理者が権限を付けると見られます。</span></p>

<section id="admBox" hidden>
  <h2 class="sec" data-i="adm_h">会員の管理</h2>
  <p class="note2" data-i="adm_note">管理者はオーナー以外の会員を管理者にできます。管理者を外せるのはオーナーだけです。</p>
  <ul class="ulist" id="ulist"></ul>
</section>

<section id="docBox" hidden>
  <div class="dochead"><h2 class="sec" data-i="tm_docs">開発資料</h2><span class="secret" data-i="tm_secret">社外秘・転載禁止</span></div>
  <h3 class="doctitle" id="docTitle"></h3>
  <input class="search" id="docSearch" type="search" data-i18n-ph="tm_search" placeholder="資料内を検索">
  <ol class="slides" id="slides"></ol>
</section>
