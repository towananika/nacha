<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>奉納準備中 — NACHA</title>
<meta name="description" content="悠遊観音堂と小さな守護神ナチャの新しい体験を企画準備中です。">
<meta name="theme-color" content="#fbfaf7">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/quiet.css">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<style>
.coming{min-height:62vh;display:flex;flex-direction:column;justify-content:center;padding-top:88px;padding-bottom:88px}
.coming h1{font-size:clamp(26px,3.6vw,38px);line-height:1.6;margin:0 0 24px;max-width:20em}
.coming .lede{max-width:34em}
.coming .links{display:flex;flex-wrap:wrap;gap:32px;margin-top:44px}
.coming .links a{font-size:12px;letter-spacing:.1em;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule);padding-bottom:5px}
.coming .links a:first-child{border-color:var(--ink)}
</style>
</head>
<body class="q">

<header class="site-head">
  <div class="wrap">
    <a class="brand" href="../">NACHA<span>小さな守護神</span></a>
    <div class="util"><a href="../">ホーム</a></div>
  </div>
</header>

<main class="wrap coming">
  <p class="eyebrow" id="gBadge">奉納準備中</p>
  <h1 id="gH1">新たな境内体験を、ただいま企画中です。</h1>
  <p class="lede" id="gDesc">小さな守護神ナチャと、カンボジア実在寺院「悠遊観音堂」の祈りを、より身近に深く感じていただける新しい体験を構想しています。完成までどうぞ楽しみにお待ちください。</p>
  <nav class="links" aria-label="次に進む">
    <a href="../" id="gHome">境内（ホーム）へ戻る</a>
    <a href="../characters/" id="gChars">神様名鑑を見る</a>
    <a href="../amulet/" id="gAmu">心願お守りを作る</a>
  </nav>
</main>

<footer class="site-foot">
  <div class="wrap">
    <div class="foot-grid">
      <p>カンボジア・プノンペン 実在寺院「悠遊観音堂」より。</p>
      <div class="foot-links"><a href="https://nacha.club/" target="_blank" rel="noopener">nacha.club</a><a href="https://x.com/nacha_project" target="_blank" rel="noopener">X</a></div>
    </div>
    <p class="unoff">このページは非公式のファンページです。</p>
  </div>
</footer>

<script>
/* 日本語以外は英語で表示する */
(function(){
  var L='ja';try{L=localStorage.getItem('nacha-lang')||''}catch(e){}
  if(!L){var nl=(navigator.language||'en').toLowerCase();L=nl.slice(0,2)}
  if(L==='ja')return;
  document.documentElement.lang='en';
  document.title='Coming Soon — NACHA';
  var T={
    gBadge:'Coming soon',
    gH1:'A new temple experience is in the making.',
    gDesc:'We are preparing a new experience that brings you closer to Nacha, the little guardian, and to Yuyu Kannondo, a real temple in Cambodia. Please look forward to it.',
    gHome:'Back to the temple (home)',
    gChars:'Meet the gods',
    gAmu:'Craft a wish amulet'
  };
  for(var k in T){var e=document.getElementById(k);if(e)e.textContent=T[k]}
})();
</script>
</body>
</html>
