<!doctype html>
<html lang="ja" id="docRoot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>新企画 奉納準備中 | 小さな守護神 ナチャ</title>
<meta name="description" content="悠遊観音堂と小さな守護神ナチャの新しい体験を企画準備中です。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700;800&family=Zen+Old+Mincho:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/site.css">
<style>
:root {
  --washi-base: #f5f0e6;
  --washi-subtle: #eae3d2;
  --ink: #2b241e;
  --ink-light: #6e6259;
  --vermilion: #b83823;
  --gold: #bfa15f;
  --line-gold: rgba(191, 161, 95, 0.45);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 0;
  background-color: var(--washi-base);
  color: var(--ink);
  font-family: "Shippori Mincho", "Zen Old Mincho", "Noto Serif JP", serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px 80px;
}
.sheet-canvas {
  width: 100%;
  max-width: 520px;
  background: #fbf9f4;
  border: 1px solid var(--gold);
  border-radius: 18px;
  padding: 40px 24px;
  position: relative;
  text-align: center;
  box-shadow: 0 10px 30px rgba(43, 36, 30, 0.05);
}
.sheet-canvas::after {
  content: "";
  position: absolute;
  inset: 7px;
  border: 1px solid var(--line-gold);
  border-radius: 12px;
  pointer-events: none;
}
.emblem-icon {
  width: 44px;
  height: 44px;
  margin: 0 auto 16px;
  color: var(--gold);
}
.tag-badge {
  display: inline-block;
  font-size: 11px;
  letter-spacing: .2em;
  color: var(--vermilion);
  border: 1px solid var(--vermilion);
  padding: 3px 12px;
  border-radius: 999px;
  margin-bottom: 14px;
}
h1 {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: .12em;
  margin: 0 0 16px;
  color: var(--ink);
  line-height: 1.5;
}
.desc {
  font-size: 13.5px;
  line-height: 2;
  color: var(--ink-light);
  letter-spacing: .06em;
  margin: 0 auto 28px;
  max-width: 380px;
}
.action-grid {
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 300px;
  margin: 0 auto;
}
.btn-gold {
  background: linear-gradient(135deg, var(--gold) 0%, #a88a48 100%);
  color: #fff;
  text-decoration: none;
  font-size: 14px;
  font-weight: 700;
  padding: 13px 20px;
  border-radius: 999px;
  letter-spacing: .08em;
  box-shadow: 0 4px 14px rgba(191, 161, 95, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform .15s;
}
.btn-gold:active { transform: scale(0.97); }
.btn-outline {
  border: 1px solid var(--gold);
  color: var(--ink);
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
  padding: 11px 18px;
  border-radius: 999px;
  letter-spacing: .06em;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.tabs {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  background: rgba(251, 249, 244, 0.95);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-top: 1px solid var(--line-gold);
  display: flex;
  justify-content: space-around;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  z-index: 100;
}
.tabs a {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-decoration: none;
  color: var(--ink-light);
  font-size: 11px;
  gap: 2px;
}
.tabs a span { font-size: 18px; }
.tabs a b { font-weight: 600; }
</style>
<link rel="stylesheet" href="../assets/mobile.css">
</head>
<body>

<div class="sheet-canvas">
  <svg class="emblem-icon" viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 2C12 2 8 7 8 12C8 15 10 17 12 17C14 17 16 15 16 12C16 7 12 2 12 2Z" opacity="0.9"/>
    <path d="M12 17C9 17 5 13 4 11C4 11 4 14 6 16C8 18 10 18.5 12 18.5C14 18.5 16 18 18 16C20 14 20 11 20 11C19 13 15 17 12 17Z" opacity="0.6"/>
    <circle cx="12" cy="20.5" r="1.5"/>
  </svg>

  <div class="tag-badge" id="gBadge">奉納準備中</div>

  <h1 id="gH1">新たな境内体験を<br>ただいま企画中です</h1>

  <p class="desc" id="gDesc">
    小さな守護神ナチャと、カンボジア実在寺院「悠遊観音堂」の祈りをより身近に、深く感じていただける新しい体験を構想しております。<br><br>
    完成までどうぞ楽しみにお待ちください。
  </p>

  <div class="action-grid">
    <a href="../" class="btn-gold">🏮 <span id="gHome">境内（ホーム）へ戻る</span></a>
    <a href="../characters/" class="btn-outline">🗺️ <span id="gChars">神様名鑑を見る</span></a>
    <a href="../amulet/" class="btn-outline">🧧 <span id="gAmu">心願お守りを作る</span></a>
  </div>
</div>

<nav class="tabs" aria-label="Main">
  <a href="../"><span aria-hidden="true">🏮</span><b>ホーム</b></a>
  <a href="../characters/"><span aria-hidden="true">🗺️</span><b>神様名鑑</b></a>
  <a href="../amulet/"><span aria-hidden="true">🧧</span><b>お守り</b></a>
</nav>


<script>
// 日本語以外は英語で表示（日英を主要言語とする）
(function(){
  var L='ja';try{L=localStorage.getItem('nacha-lang')||''}catch(e){}
  if(!L){var nl=(navigator.language||'en').toLowerCase();L=nl.slice(0,2)}
  if(L==='ja')return;
  document.documentElement.lang='en';
  document.title='Coming Soon | NACHA the Little Guardian';
  var T={gBadge:'COMING SOON',gH1:'A new temple experience<br>is in the making',
    gDesc:'We are planning a new experience to bring you closer to NACHA the little guardian and the real temple Yuyu Kannondo in Cambodia.<br><br>Please look forward to it.',
    gHome:'Back to the temple (Home)',gChars:'Meet the gods',gAmu:'Craft a wish amulet',
    tHome:'Home',tChars:'Pantheon',tAmu:'Amulet'};
  for(var k in T){var e=document.getElementById(k);if(e)e.innerHTML=T[k]}
  var tabs=document.querySelectorAll('.tabs b'),tt=[T.tHome,T.tChars,T.tAmu];
  for(var i=0;i<tabs.length&&i<tt.length;i++)tabs[i].textContent=tt[i];
})();
</script>
</body>
</html>
