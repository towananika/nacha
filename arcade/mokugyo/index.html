<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NACHA 電子木魚 · 徳積みポクポク ASMR</title>
<meta name="description" content="タップして功徳を積もう。澄んだ木魚の音と触感で胃痛もストレスもリフレッシュ。108回で大功徳成就！">
<meta name="theme-color" content="#1d1020">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=M+PLUS+Rounded+1c:wght@700;900&family=Noto+Serif+JP:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common.css">
<style>
:root{
  --gold:#D4AC0D;
  --gold-glow:#F4D03F;
}
body{overflow:hidden;background:#140a17;color:#fff;touch-action:manipulation;user-select:none;-webkit-user-select:none;font-family:"M PLUS Rounded 1c",sans-serif}
#stage{width:min(100vw,480px);height:100dvh;margin:0 auto;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top)+12px) 16px calc(env(safe-area-inset-bottom)+16px);text-align:center;box-sizing:border-box}

/* ヘッダー */
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%}
.btn-back{color:#fff;text-decoration:none;font:700 13px "Lilita One",sans-serif;background:#ffffff14;border:1px solid #ffffff24;border-radius:999px;padding:6px 14px}
.merit-counter{background:rgba(212,172,13,0.15);border:1.5px solid var(--gold);padding:5px 16px;border-radius:999px;font:900 15px "Lilita One",sans-serif;color:var(--gold-glow)}
.merit-counter b{font-size:18px;margin-left:4px}

/* ナチャの一言吹き出し */
.dialog-box{position:relative;background:#fff;color:#241518;font:900 14px "M PLUS Rounded 1c",sans-serif;padding:8px 18px;border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,0.4);border:2px solid var(--gold);margin:10px auto 0;display:inline-block;max-width:280px}
.dialog-box:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border-width:8px 8px 0;border-style:solid;border-color:#fff transparent}

/* 木魚ステージ */
.mokugyo-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;cursor:pointer}
.mokugyo-wrap{position:relative;width:240px;height:240px;display:grid;place-items:center}
.mokugyo-svg{width:100%;height:100%;filter:drop-shadow(0 14px 28px rgba(0,0,0,0.6));transform-origin:50% 60%;transition:transform .08s cubic-bezier(0.2, 1.4, 0.4, 1)}
.mokugyo-svg.hit{transform:scale(0.92) rotate(-2deg)}

/* 波紋エフェクト */
.ripple{position:absolute;border-radius:50%;border:2px solid var(--gold-glow);pointer-events:none;animation:rippleOut .6s ease-out forwards}
@keyframes rippleOut{
  0%{width:40px;height:40px;opacity:1;transform:scale(0.5)}
  100%{width:280px;height:280px;opacity:0;transform:scale(1.2)}
}

/* 功徳+1 フワフワ文字 */
.floating-text{position:absolute;pointer-events:none;font:900 20px "Noto Serif JP",serif;color:var(--gold-glow);text-shadow:0 0 10px rgba(244,208,63,0.8),0 2px 4px #000;animation:floatUp 1.1s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;white-space:nowrap;z-index:10}
@keyframes floatUp{
  0%{transform:translate(-50%,0) scale(0.6);opacity:0}
  20%{transform:translate(-50%,-20px) scale(1.15);opacity:1}
  80%{opacity:1}
  100%{transform:translate(-50%,-80px) scale(0.9);opacity:0}
}

/* 下部ガイド */
.bottom-guide{font-size:12.5px;color:#fcecd2aa;letter-spacing:.06em}
.btn-reset{background:none;border:0;color:#fcecd266;font-size:11px;text-decoration:underline;cursor:pointer;margin-top:4px}

/* 108回 大功徳成就モーダル */
.modal-overlay{position:fixed;inset:0;background:rgba(10,5,15,0.88);backdrop-filter:blur(8px);z-index:90;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.achievement-card{width:100%;max-width:380px;background:linear-gradient(160deg,#2b1208,#130507);border:2.5px solid var(--gold);border-radius:26px;padding:26px 20px;text-align:center;box-shadow:0 0 50px rgba(212,172,13,0.5);animation:kamiPop .4s cubic-bezier(0.18, 0.89, 0.32, 1.28)}
@keyframes kamiPop{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}
.achieve-emo{font-size:64px;margin-bottom:8px;animation:haloGlow 2s infinite alternate}
@keyframes haloGlow{from{filter:drop-shadow(0 0 10px #f4d03f)}to{filter:drop-shadow(0 0 30px #f4d03f)}}
.achieve-title{font:900 24px "Noto Serif JP",serif;color:var(--gold-glow);margin:0 0 6px}
.achieve-desc{font:700 15px/1.6 "M PLUS Rounded 1c",sans-serif;color:#fcecd2;margin:12px 0 20px;padding:12px;background:rgba(255,255,255,0.06);border-radius:14px;border:1px dashed #D4AC0D66}
.btn-share-merit{width:100%;padding:14px;border-radius:14px;background:linear-gradient(135deg,#1da1f2,#0c7abf);color:#fff;border:0;font:900 15px "M PLUS Rounded 1c",sans-serif;cursor:pointer}
.btn-close-modal{background:none;border:0;color:#fcecd2aa;font-size:12.5px;margin-top:10px;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div id="stage">

  <!-- ヘッダー -->
  <div class="top-bar">
    <a class="btn-back" href="../">← アーケード</a>
    <div class="merit-counter">功徳: <b id="meritVal">0</b></div>
  </div>

  <!-- ナチャのセリフ -->
  <div>
    <div class="dialog-box" id="nachaDialog">画面をタップしてポクポク鳴らそう！</div>
  </div>

  <!-- 木魚タップエリア -->
  <div class="mokugyo-stage" id="tapArea">
    <div class="mokugyo-wrap">
      <!-- 伝統的で美しい木魚SVG -->
      <svg class="mokugyo-svg" id="mokugyoSvg" viewBox="0 0 200 200">
        <defs>
          <radialGradient id="woodGrad" cx="40%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#ab6b3a"/>
            <stop offset="60%" stop-color="#693717"/>
            <stop offset="100%" stop-color="#3b1b08"/>
          </radialGradient>
          <linearGradient id="fishEye" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#F4D03F"/>
            <stop offset="100%" stop-color="#D4AC0D"/>
          </linearGradient>
        </defs>
        <!-- 木魚の丸みボディ（双魚の鱗文様風） -->
        <path d="M100 25 C145 25 175 60 175 105 C175 150 140 178 100 178 C60 178 25 150 25 105 C25 60 55 25 100 25 Z" fill="url(#woodGrad)" stroke="#261004" stroke-width="4"/>
        <!-- 木魚の開口スリット（空洞部） -->
        <path d="M50 115 C75 145 125 145 150 115 C135 125 65 125 50 115 Z" fill="#170902"/>
        <!-- 彫刻ディテール -->
        <circle cx="65" cy="80" r="10" fill="url(#fishEye)"/>
        <circle cx="65" cy="80" r="4" fill="#170902"/>
        <circle cx="135" cy="80" r="10" fill="url(#fishEye)"/>
        <circle cx="135" cy="80" r="4" fill="#170902"/>
        <path d="M85 45 C95 40 105 40 115 45" stroke="#F4D03F88" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M80 60 C95 55 105 55 120 60" stroke="#F4D03F88" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <!-- 下部操作案内 -->
  <div>
    <div class="bottom-guide">タップで木魚を鳴らして徳を積もう<br><small>108回で「煩悩滅却・大功徳成就」✨</small></div>
    <button class="btn-reset" id="btnReset">カウントをリセット</button>
  </div>

</div>

<!-- 108回成就モーダル -->
<div class="modal-overlay" id="achieveModal">
  <div class="achievement-card">
    <div class="achieve-emo">🌟</div>
    <h2 class="achieve-title">大 功 徳 成 就</h2>
    <div class="achieve-desc">
      百八の煩悩をポクポクと滅却しました！<br><br>
      <span style="color:var(--gold-glow);font-weight:900">「ナチャが見てたよ！信じる想いは必ず通じるさ！絶対大丈夫！」</span>
    </div>
    <button class="btn-share-merit" id="btnShareMerit">𝕏 で功徳成就を報告する</button>
    <button class="btn-close-modal" id="btnCloseModal">木魚に戻る</button>
  </div>
</div>

<script src="../../assets/coins.js"></script>
<script>
(function(){
  'use strict';

  var $ = function(i){ return document.getElementById(i); };
  var count = 0;
  var audioCtx = null;

  // ローカルストレージ復元
  try {
    count = parseInt(localStorage.getItem('nacha_mokugyo_count') || '0', 10);
  } catch(e){}
  $('meritVal').textContent = count;

  // 極上の木魚打音を Web Audio API でリアルタイム合成（外部音源ラグなし）
  function playMokugyoSound() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      var t = audioCtx.currentTime;

      // 1. 低周波の空洞共鳴（丸みのある低音胴鳴り）
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, t);
      osc.frequency.exponentialRampToValueAtTime(140, t + 0.12);

      gain.gain.setValueAtTime(0.8, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.14);

      // 2. 高周波の硬質な木の打撃音（コンッというアタック）
      var clickOsc = audioCtx.createOscillator();
      var clickGain = audioCtx.createGain();
      clickOsc.type = 'triangle';
      clickOsc.frequency.setValueAtTime(980, t);
      clickOsc.frequency.exponentialRampToValueAtTime(400, t + 0.04);

      clickGain.gain.setValueAtTime(0.6, t);
      clickGain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);

      clickOsc.connect(clickGain);
      clickGain.connect(audioCtx.destination);
      clickOsc.start(t);
      clickOsc.stop(t + 0.05);

    } catch(e){}
  }

  // フワフワ浮かび上がる功徳メッセージ集
  var PHRASES = [
    '功徳 +1', '徳 +1', '自名義力 +1', '当選運 +1',
    '神席運 +1', '胃痛消滅 +1', '推しの多幸 +1', '心願成就 +1'
  ];

  var DIALOGS = [
    'ポクポク…いい音だねぇ',
    '心がすーっと軽くなるね',
    'その調子！徳がどんどん積まれてるよ！',
    '推しもきっと喜んでるさ！',
    '百八回まであと少し！ファイト！'
  ];

  var tapArea = $('tapArea');
  var mokugyoSvg = $('mokugyoSvg');
  var meritVal = $('meritVal');
  var nachaDialog = $('nachaDialog');

  function triggerHit(clientX, clientY) {
    count++;
    meritVal.textContent = count;
    try { localStorage.setItem('nacha_mokugyo_count', count); } catch(e){}

    // 音声＆振動
    playMokugyoSound();
    try { navigator.vibrate && navigator.vibrate(18); } catch(e){}

    // 木魚バウンド
    mokugyoSvg.classList.remove('hit');
    void mokugyoSvg.offsetWidth;
    mokugyoSvg.classList.add('hit');

    // タップ位置に波紋
    var rect = tapArea.getBoundingClientRect();
    var x = clientX ? (clientX - rect.left) : (rect.width / 2);
    var y = clientY ? (clientY - rect.top) : (rect.height / 2);

    var ripple = document.createElement('div');
    ripple.className = 'ripple';
    ripple.style.left = (x - 20) + 'px';
    ripple.style.top = (y - 20) + 'px';
    tapArea.appendChild(ripple);
    setTimeout(function(){ ripple.remove(); }, 600);

    // 功徳+1 フワフワ文字
    var phrase = PHRASES[Math.floor(Math.random() * PHRASES.length)];
    var fText = document.createElement('div');
    fText.className = 'floating-text';
    fText.textContent = phrase;
    fText.style.left = x + 'px';
    fText.style.top = (y - 10) + 'px';
    tapArea.appendChild(fText);
    setTimeout(function(){ fText.remove(); }, 1100);

    // ナチャのセリフ更新（一定確率）
    if (count % 15 === 0) {
      nachaDialog.textContent = DIALOGS[Math.floor(Math.random() * DIALOGS.length)];
    }

    // コイン付与（20回タップ達成時）
    if (count === 20 && window.NachaCoins) {
      window.NachaCoins.earn('mokugyo_20', 5);
    }

    // 108回（煩悩滅却）達成！
    if (count === 108) {
      try { navigator.vibrate && navigator.vibrate([40, 80, 100, 120]); } catch(e){}
      $('achieveModal').classList.add('open');
      if (window.NachaCoins) {
        window.NachaCoins.earn('mokugyo_108', 10);
      }
    }
  }

  tapArea.addEventListener('pointerdown', function(e){
    triggerHit(e.clientX, e.clientY);
  });

  // スペースキーでも叩ける（PC対応）
  document.addEventListener('keydown', function(e){
    if (e.code === 'Space' && !$('achieveModal').classList.contains('open')) {
      e.preventDefault();
      triggerHit(null, null);
    }
  });

  // リセット
  $('btnReset').addEventListener('click', function(){
    if (confirm('功徳カウントをリセットしますか？')) {
      count = 0;
      meritVal.textContent = 0;
      try { localStorage.setItem('nacha_mokugyo_count', 0); } catch(e){}
    }
  });

  $('btnCloseModal').addEventListener('click', function(){
    $('achieveModal').classList.remove('open');
  });

  // Xシェア
  $('btnShareMerit').addEventListener('click', function(){
    var tweet = 'ナチャ寺院の電子木魚で百八の煩悩を滅却しました！🪵📿✨\n' +
      '【積んだ功徳】' + count + '\n' +
      'ポクポク鳴らして胃痛もスッキリ浄化！大功徳成就！\n\n' +
      '#NACHA #電子木魚 #推し活祈願 #功徳\n' +
      'https://towananika.github.io/nacha/arcade/mokugyo/';
    window.open('https://x.com/intent/tweet?text=' + encodeURIComponent(tweet), '_blank', 'noopener');
  });

})();
</script>
</body></html>
