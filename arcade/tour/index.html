<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Temple Tour · NACHA</title>
<meta name="description" content="Travel with NACHA. Tidy each temple and clear the haze."><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common.css">
<style>
/* Temple illustrations are game artwork; no real temple is depicted. */
body{overflow:hidden;background:#1d1020}
#stage{width:min(100vw,480px);height:100%;max-height:100dvh;position:relative;overflow:hidden;margin:0 auto}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 14px);gap:10px}
.scr.on{display:flex}
.ctr{align-items:center;justify-content:center;text-align:center;gap:12px}
.bg{position:absolute;inset:0;z-index:-1;background:linear-gradient(#1d1020b0,#1d1020e8),url(assets/stage1.webp) center/cover}
.view{position:relative;flex:1;border:2px solid #e6c17a66;border-radius:14px;overflow:hidden;display:grid;place-items:center;color:#9d90ad;font:13px "Lilita One",sans-serif;letter-spacing:.08em;text-align:center}
.view img.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fog{position:absolute;inset:0;background:radial-gradient(ellipse at 28% 35%,#d6cbcbad,transparent 52%),radial-gradient(ellipse at 72% 70%,#c6b6cbca,transparent 60%);pointer-events:none;transition:opacity .4s}
.pips{display:flex;gap:8px;justify-content:center}
.pip{width:14px;height:14px;border-radius:50%;background:#ffffff26}.pip.on{background:var(--gold)}.pip.cur{outline:2px solid #fff}
.bubble{background:#fff;color:#241518;border-radius:18px;padding:10px 14px;font-size:17px;line-height:1.3;text-align:center;box-shadow:0 4px 0 #0004;min-height:46px}
.road{position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(transparent,#2b142255)}
@keyframes road{to{background-position:-80px 0}}
.nach{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);width:clamp(130px,40%,200px);height:58%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 7px 9px #28150a88);animation:bob .6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateX(-50%) translateY(-6px)}}
.sight{position:absolute;font-size:34px;cursor:pointer;animation:float 2s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-8px)}}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;position:relative;z-index:1;width:100%}
.slot{aspect-ratio:1;border:2px dashed #ffffff55;border-radius:50%;display:grid;place-items:center;font-size:30px;cursor:pointer;background:#00000030}
.slot span{opacity:.35}.slot.done span{opacity:1}.slot.done{border-style:solid;border-color:var(--gold)}
.slot.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:64px}
.it{font-size:36px;width:60px;height:60px;border-radius:14px;border:2px solid #ffffff33;background:#150a1acc;cursor:pointer}
.it.sel{border-color:var(--gold);transform:scale(1.1)}
.it.gone{display:none}
.stars{font-size:40px;letter-spacing:6px}
.lore{font-size:15px;color:#f6dfbf;max-width:320px;line-height:1.35}
.h1{font:34px/1.05 "Lilita One",sans-serif}
.top{display:flex;justify-content:space-between;font:16px "Lilita One"}
.stamp{width:110px;height:110px;border-radius:50%;border:4px dashed var(--gold);display:grid;place-items:center;font:20px "Lilita One";color:var(--gold)}
</style></head><body><div id="app"><div id="stage">
<div class="bg"></div>

<section class="scr ctr on" id="s0">
  <div class="brand">NACHA</div>
  <div class="h1">Temple Tour</div>
  <div class="lore">Haze seeps into the old temples. Travel with NACHA and tidy them up.</div>
  <p class="lore" style="font-size:12px;opacity:.8">The scenery is an imagined illustration.</p>
  <button class="btn main" id="go">Start the tour</button>
  <a class="btn" href="../" style="padding:9px 16px;font-size:15px">More games</a>
</section>

<section class="scr" id="sj">
  <div class="pips" id="pj"></div>
  <div class="view" id="vj"><img class="bgimg" id="bj" alt="" onerror="this.style.display='none'"><span id="lj"></span><div class="road"></div><img class="nach" src="assets/nacha.webp" alt="NACHA"></div>
  <div class="bubble" id="sayj">Let's go!</div>
  <button class="btn main" id="arrive" style="visibility:hidden">Arrive</button>
</section>

<section class="scr" id="st">
  <div class="top"><span id="tn"></span><span id="tt"></span></div>
  <div class="view" id="vt"><img class="bgimg" id="bt" alt="" onerror="this.style.display='none'"><span id="lt" style="position:absolute;top:8px;z-index:1;background:#221426bd;color:#fff;padding:5px 10px;border-radius:8px"></span><div class="fog" id="fog" aria-hidden="true"></div><div class="slots" id="slots"></div></div>
  <div class="tray" id="tray"></div>
</section>

<section class="scr ctr" id="sr">
  <div class="brand">NACHA</div>
  <div class="stamp" id="stamp">✦</div>
  <div class="stars" id="stars"></div>
  <div class="h1" id="rt" style="font-size:26px"></div>
  <div class="lore" id="rl"></div>
  <button class="btn main" id="next">Next</button>
</section>

<section class="scr ctr" id="se">
  <div class="brand">NACHA</div>
  <div class="h1">Tour complete!</div>
  <div class="stars" id="es"></div>
  <div class="lore" id="el"></div>
  <div id="ef"></div>
  <div class="row"><button class="btn" id="again">Again</button><button class="btn main" id="sh">Share</button></div>
  <a class="btn" href="../" style="padding:9px 16px;font-size:15px">More games</a>
</section>
</div></div>
<script src="../common.js"></script>
<script>
(function(){"use strict";
var $=function(i){return document.getElementById(i)};
// Stages. items: [emoji, ...] each also a slot. god: friend who cameos on arrival.
var ST=[
 {n:"Sunrise Tower Square",c:"#e8895a",items:["🍂","🍂","🏮","🏮","🪔","🧹"],sights:[["🌅","What a sunrise!"],["🐦","A bird says hi."]],god:null,pre:"The haze hides in the leaves."},
 {n:"Riverside Shrine",c:"#4a8fb5",items:["🍵","🍵","🍊","🍊","🪷","🪷","🧺","🏮"],sights:[["🐟","A fish jumps!"],["🛶","A little boat."]],god:["White Kun Sim","Smile, and the haze runs away."],pre:"Set out the offerings."},
 {n:"Market Shrine",c:"#c79a3a",items:["🕯️","🕯️","🪔","🪔","🍚","🍚","🌸","🌸"],sights:[["🥭","Mango time!"],["🛺","Tuk-tuk, beep!"]],god:["Fdo King","Burn the worry. Keep the light."],pre:"Tiny prayers matter."},
 {n:"Forest Gate",c:"#3f7a56",items:["🪨","🪨","🌿","🌿","🪷","🏮","🏮","🍂"],sights:[["🦋","A butterfly!"],["🐒","A monkey peeks."]],god:["Preah Sousang","No hurry. Good things come."],pre:"Old things deserve care."},
 {n:"Yuyu Kannondo",c:"#c0392b",items:["🔥","🔥","🏮","🏮","🪔","🪔","📿","📿"],sights:[["🪷","The lotus pond."],["🔔","A soft bell."]],god:["All four friends","Welcome home, NACHA!"],pre:"The last stop. Make it shine."}
];
var cur=0,stars=[],sel=null,left=0,wrong=0,t0=0,tick=0,jt=0;
function show(id){["s0","sj","st","sr","se"].forEach(function(s){$(s).classList.toggle("on",s===id)})}
function pips(){$("pj").innerHTML=ST.map(function(_,i){return'<span class="pip'+(i<stars.length?" on":"")+(i===cur?" cur":"")+'"></span>'}).join("")}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function img(el,i){el.style.display="";el.src="assets/stage"+(i+1)+".webp"}
function journey(){var s=ST[cur];show("sj");pips();
  $("lj").textContent="";img($("bj"),cur);$("vj").style.background="linear-gradient(#"+0+"0,#0000)";$("vj").style.background="linear-gradient("+s.c+"55,#1d1020)";
  $("sayj").textContent=s.god?s.god[0]+": "+s.god[1]:(cur===0?"Let's go!":"Next stop!");
  $("arrive").style.visibility="hidden";
  [].slice.call($("vj").querySelectorAll(".sight")).forEach(function(e){e.remove()});
  s.sights.forEach(function(sg,i){var e=document.createElement("div");e.className="sight";e.textContent=sg[0];e.style.left=(18+i*44)+"%";e.style.top=(14+i*16)+"%";e.onclick=function(){$("sayj").textContent=sg[1]};$("vj").appendChild(e)});
  clearTimeout(jt);jt=setTimeout(function(){$("arrive").style.visibility="visible";$("arrive").textContent="Arrive at "+s.n},6000)}
function tidy(){var s=ST[cur];show("st");sel=null;wrong=0;left=s.items.length;t0=performance.now();
  $("tn").textContent="Stop "+(cur+1)+" / 5";img($("bt"),cur);$("lt").textContent=s.n+" · "+s.pre;$("vt").style.background="linear-gradient("+s.c+"44,#1d1020)";
  $("fog").style.opacity=.7;
  $("slots").innerHTML=s.items.map(function(e,i){return'<button type="button" class="slot" data-i="'+i+'" data-e="'+e+'" aria-label="Place ' + e + '"><span>'+e+'</span></button>'}).join("");
  var order=s.items.map(function(e,i){return{e:e,k:Math.random()}}).sort(function(a,b){return a.k-b.k});
  $("tray").innerHTML=order.map(function(o,i){return'<button class="it" data-e="'+o.e+'">'+o.e+"</button>"}).join("");
  clearInterval(tick);tick=setInterval(function(){$("tt").textContent=Math.round((performance.now()-t0)/1000)+"s"},500)}
$("tray").addEventListener("click",function(e){var b=e.target.closest(".it");if(!b)return;[].forEach.call($("tray").children,function(x){x.classList.remove("sel")});b.classList.add("sel");sel=b});
$("slots").addEventListener("click",function(e){var s=e.target.closest(".slot");if(!s||!sel||s.classList.contains("done"))return;
  if(s.dataset.e===sel.dataset.e){s.classList.add("done");sel.classList.add("gone");sel=null;left--;$("fog").style.opacity=.7*left/ST[cur].items.length;if(!left)done()}
  else{wrong++;s.classList.add("shake");setTimeout(function(){s.classList.remove("shake")},260)}});
function done(){clearInterval(tick);var sec=(performance.now()-t0)/1000,n=ST[cur].items.length,
  st=(wrong<=1&&sec<n*5)?3:(wrong<=3||sec<n*8)?2:1;stars.push(st);var tr=NA.train(10);
  setTimeout(function(){show("sr");$("stamp").textContent=["☀","🪷","🏮","🌿","✦"][cur];$("stamp").style.borderColor=["#b87333","#c0c0c0","#f4c430"][st-1];
   $("stars").textContent="★".repeat(st)+"☆".repeat(3-st);$("rt").textContent=ST[cur].n+" is clear!";$("rl").textContent=tr.line;$("next").textContent=cur<4?"Next stop":"Finish"},500)}
$("next").onclick=function(){if(cur<4){cur++;journey()}else end()};
$("arrive").onclick=tidy;
function end(){var tot=stars.reduce(function(a,b){return a+b},0);show("se");$("es").textContent=tot+" / 15 ★";
  $("el").textContent=tot>=13?"All four friends cheer: spotless!":tot>=9?"The temples feel calm again.":"A good start. Try again for more stars!";$("ef").innerHTML=NA.followRow()}
function start(){cur=0;stars=[];journey()}
$("go").onclick=start;$("again").onclick=start;
$("sh").onclick=function(){var tot=stars.reduce(function(a,b){return a+b},0),t="I tidied 5 temples with NACHA: "+tot+"/15 stars! "+NA.HANDLE+" #NACHA",u=location.href.split("?")[0];if(navigator.share)navigator.share({text:t,url:u}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(t+" "+u).then(function(){NA.toast("Copied")})};
})();
</script></body></html>
