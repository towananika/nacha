<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Little Wisdom · NACHA</title><meta name="description" content="NACHA asks. You choose the kind way."><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common.css">
<style>
body{overflow:auto;background:#1d1020}#app{display:block}
main{max-width:480px;margin:0 auto;padding:12px 16px 40px;min-height:100dvh;display:flex;flex-direction:column;gap:12px}
.slot{position:relative;border:2px dashed #5a4d68;border-radius:14px;background:#2b2433;display:grid;place-items:center;color:#9d90ad;font:13px "Lilita One",sans-serif;letter-spacing:.08em;text-align:center;overflow:hidden;height:min(34dvh,260px)}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.bubble{background:#fff;color:#241518;border-radius:18px;padding:12px 16px;font-size:20px;line-height:1.3;text-align:center;box-shadow:0 4px 0 #0004}
.ch{display:grid;gap:8px}.ch .btn{font-size:17px;justify-content:flex-start;text-align:left}
.ch .btn.pick{background:var(--red)}
.reply{font:22px/1.2 "Lilita One",sans-serif;text-align:center;color:var(--gold);min-height:28px}
.cnt{font:13px "Lilita One",sans-serif;letter-spacing:.2em;color:#e9c9a4;text-align:center}
.hid{display:none}
</style></head><body><div id="app"><main>
<div class="brand">NACHA</div>
<div class="cnt" id="cnt"></div>
<div class="slot"><img src="assets/nacha.png" alt="" onerror="this.remove()"><span>NACHA<br>thinking face (GPT)</span></div>
<div class="bubble" id="q"></div>
<div class="ch" id="ch"></div>
<div class="reply" id="rp"></div>
<button class="btn main hid" id="nx">Next</button>
<div id="end" class="hid"><div class="reply">That's all for today. 🪷</div><div id="follow"></div></div>
<a class="btn" href="../courtyard/" style="padding:9px 16px;font-size:15px">Back to the courtyard</a>
</main></div>
<script src="../common.js"></script>
<script>
(function(){"use strict";var $=function(i){return document.getElementById(i)};
var D=[{"q": "Your friend is sad. What do you do?", "c": ["Sit next to them", "Make them laugh", "Bring warm tea"], "r": ["Being there is already a gift.", "A laugh is a little sun.", "Warm tea, warm heart."]}, {"q": "It's raining and you forgot your umbrella.", "c": ["Wait and watch the rain", "Run and splash!", "Share a stranger's umbrella"], "r": ["Rain stops. So does every worry.", "Splash! Puddles love you.", "Kind strangers are everywhere."]}, {"q": "The path is blocked by a big rock.", "c": ["Push it together", "Find another way", "Take a break first"], "r": ["Many hands, light work.", "A new road is a new story.", "Rest, then try again."]}, {"q": "You made a mistake at work.", "c": ["Say sorry, fix it", "Ask for help", "Laugh and learn"], "r": ["Honest and brave. Good.", "Asking is strength.", "Mistakes are just practice."]}, {"q": "A cat is stuck in a tree.", "c": ["Call a friend", "Wait with snacks", "Climb up slowly"], "r": ["Together is safer.", "Cats come down when ready.", "Slow and steady wins."]}, {"q": "You can't sleep tonight.", "c": ["Count your thanks", "Look at the stars", "Drink warm milk"], "r": ["Thankful hearts sleep well.", "The sky keeps you company.", "Cozy. Zzz."]}, {"q": "Someone was unkind to you.", "c": ["Take a deep breath", "Talk it out", "Let it float away"], "r": ["Breathe. You're okay.", "Honest words heal.", "Light things fly away."]}, {"q": "It's your turn to share a snack.", "c": ["Give the biggest piece", "Split evenly", "Save some for later"], "r": ["Generous, nice!", "Fair and kind.", "Planning ahead. Smart."]}, {"q": "A new friend looks shy.", "c": ["Say hello first", "Offer a seat", "Smile quietly"], "r": ["Hello is magic.", "A seat says welcome.", "Smiles travel far."]}, {"q": "Too many things to do today.", "c": ["Pick just one", "Ask for a hand", "Walk first, then start"], "r": ["One thing at a time.", "Many hands, light work.", "Fresh air, fresh mind."]}, {"q": "You found a lost wallet.", "c": ["Return it", "Hand it to a guard", "Look for the owner"], "r": ["Honesty shines.", "Safe hands. Good.", "Detective NACHA says: nice!"]}, {"q": "Your lantern is going out.", "c": ["Shield it with your hands", "Light it from a friend", "Ask the wind to be gentle"], "r": ["Care keeps the flame.", "Lights are better shared.", "Wind listens to kind words."]}];
var day=Math.floor(Date.now()/864e5),s=day*3%D.length,n=0,N=3;
function show(){var d=D[(s+n)%D.length];$("cnt").textContent="Question "+(n+1)+" / "+N;$("q").textContent=d.q;$("rp").textContent="";$("nx").classList.add("hid");
 $("ch").innerHTML=d.c.map(function(c,i){return '<button class="btn" data-i="'+i+'">'+c+"</button>"}).join("")}
$("ch").addEventListener("click",function(e){var b=e.target.closest(".btn");if(!b||$("nx").classList.contains("hid")===false)return;
 var d=D[(s+n)%D.length];b.classList.add("pick");$("rp").textContent=d.r[+b.dataset.i];$("nx").classList.remove("hid");$("nx").textContent=n+1>=N?"Done":"Next"});
$("nx").onclick=function(){n++;if(n>=N){$("ch").innerHTML="";$("q").textContent="Thank you for thinking kindly.";$("cnt").textContent="";$("nx").classList.add("hid");$("end").classList.remove("hid");$("follow").innerHTML=NA.followRow();return}show()};
show()})();
</script></body></html>
