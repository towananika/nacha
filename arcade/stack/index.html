<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Build the Tower · NACHA</title>
<meta name="description" content="Tap to drop each tier. Line it up perfectly to keep it wide."><meta name="theme-color" content="#1d1020">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common.css">
<style>#stage{width:min(100vw,480px);height:100%;max-height:100dvh;overflow:hidden}#c{width:100%;height:100%}.hint{font-size:15px;color:#f6dfbf;max-width:300px}.em{font-size:64px}</style>
</head><body><div id="app"><div id="stage">
<canvas id="c"></canvas>
<div class="hud"><span class="big" id="sc"></span><span class="sm r" id="sub"></span></div>
<div class="ov on" id="o0"><div class="brand">NACHA</div><div class="title">Build the Tower</div><div class="em">🛕</div><div class="hint">Tap to drop each tier. Line it up perfectly to keep it wide.</div><button class="btn main" id="go">Play</button><a class="btn" href="../" style="padding:9px 16px;font-size:15px">More games</a></div>
<div class="ov" id="o1"><div class="brand">NACHA</div><div class="label">TIERS</div><div class="score" id="rs">0</div><div class="best" id="rb"></div><div class="title" id="rt" style="font-size:26px"></div><div id="rF"></div>
<div class="row"><button class="btn main" id="sh">Share</button><button class="btn" id="again">Again</button></div><a class="btn" href="../" style="padding:9px 16px;font-size:15px">More games</a></div>
</div></div>
<script src="../common.js"></script>
<script>
(function(){"use strict";
var $=function(i){return document.getElementById(i)},cv=$("c"),x=cv.getContext("2d"),W,H,t0=performance.now(),last=0,leaves,run=false,KEY="na-lab-stack";
function fit(){W=$("stage").clientWidth;H=$("stage").clientHeight;var d=Math.min(2,devicePixelRatio||1);cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0);leaves=NA.leaves(8,W,H)}
addEventListener("resize",fit);
function emo(c,px,py,s){x.font=s+"px serif";x.textAlign="center";x.textBaseline="middle";x.fillText(c,px,py)}
function best(){try{return+localStorage.getItem(KEY)||0}catch(e){return 0}}
var G;

G={b:[],cur:null,dir:1,sp:0,cb:0,cam:0,camT:0,sc:0,H0:30,
init:function(){var w=Math.min(W*.5,200);this.b=[{x:(W-w)/2,w:w}];this.w0=w;this.nextBlock();this.cb=0;this.cam=0;this.sc=0;$("sub").textContent="";$("sc").textContent=0},
nextBlock:function(){var t=this.b[this.b.length-1];this.cur={x:this.dir>0?0:W-t.w,w:t.w};this.sp=170+this.b.length*7},
down:function(){var g=this,t=g.b[g.b.length-1],c=g.cur,l=Math.max(t.x,c.x),r=Math.min(t.x+t.w,c.x+c.w),ov=r-l;
 if(ov<=2){finish(g.sc,g.sc>=20?"A tower for the ages!":"It tumbled…");return}
 if(Math.abs(c.x-t.x)<7){g.cb++;var nw=Math.min(g.w0,t.w+(g.cb>=2?8:0));g.b.push({x:t.x-(nw-t.w)/2,w:nw});g.sc+=1+Math.min(3,g.cb)}
 else{g.cb=0;g.b.push({x:l,w:ov});g.sc+=1}
 $("sc").textContent=g.sc;$("sub").textContent=g.cb>1?"perfect x"+g.cb:"";g.dir=-g.dir;g.nextBlock()},
step:function(dt){var g=this,c=g.cur;c.x+=g.dir*g.sp*dt;if(c.x<=0){c.x=0;g.dir=1}if(c.x+c.w>=W){c.x=W-c.w;g.dir=-1}
 g.camT=Math.max(0,(g.b.length-7)*g.H0);g.cam+=(g.camT-g.cam)*Math.min(1,dt*4)},
draw:function(){var g=this,base=H*.82+g.cam;
 g.b.forEach(function(k,i){x.fillStyle="hsl("+(8+i*5)%60+",70%,"+(42+i%3*4)+"%)";x.fillRect(k.x,base-(i+1)*g.H0,k.w,g.H0-3);x.fillStyle="#f4c43088";x.fillRect(k.x,base-(i+1)*g.H0,k.w,3)});
 var c=g.cur,y=base-(g.b.length+1)*g.H0;x.fillStyle="#ffffffcc";x.fillRect(c.x,y,c.w,g.H0-3);
 x.fillStyle="#ffffff30";x.font="15px 'Lilita One'";x.textAlign="center";x.fillText("tap to drop",W/2,H-20)}};

function start(){$("o0").classList.remove("on");$("o1").classList.remove("on");G.init();run=true}
function finish(score,msg){run=false;var b=best(),nb=score>b;if(nb)try{localStorage.setItem(KEY,score)}catch(e){}
 $("rs").textContent=score;$("rb").textContent=nb?"New best!":"Best "+b;$("rt").textContent=msg;$("rF").innerHTML=NA.followRow();$("o1").classList.add("on");G.last=score}
function frame(now){var dt=Math.min(.05,(now-last)/1000);last=now;
 NA.drawBG(x,W,H,(now-t0)*.012,(now-t0)/1000,"sun");NA.drawLeaves(x,leaves,W,H,dt);
 if(run)G.step(dt);G.draw();requestAnimationFrame(frame)}
$("go").onclick=start;$("again").onclick=start;
$("sh").onclick=function(){var t="I built a tower of "+G.last+"! "+NA.HANDLE+" #NACHA",u=location.href.split("?")[0];if(navigator.share)navigator.share({text:t,url:u}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(t+" "+u).then(function(){NA.toast("Copied")})};
function pt(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener("pointerdown",function(e){e.preventDefault();if(run&&G.down)G.down(pt(e))});
cv.addEventListener("pointerup",function(e){if(run&&G.up)G.up(pt(e))});
cv.addEventListener("pointercancel",function(){if(run&&G.up)G.up({x:0,y:0})});
G.init&&0;NA.fontReady().then(function(){fit();G.init();requestAnimationFrame(frame)});
})();
</script></body></html>
