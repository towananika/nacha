<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quiet Courtyard · NACHA</title>
<meta name="description" content="Take a breath with NACHA in the temple courtyard."><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common.css">
<style>
/* WIREFRAME: gray boxes mark where GPT images go. Drop files into ./assets/ (names in data-slot) and they replace the boxes. */
:root{--wf:#2b2433;--wfl:#5a4d68}
body{overflow:auto;background:#1d1020}
#app{display:block}
main{max-width:480px;margin:0 auto;padding:12px 16px 40px;min-height:100dvh;display:flex;flex-direction:column;gap:12px}
.slot{position:relative;border:2px dashed var(--wfl);border-radius:14px;background:var(--wf);display:grid;place-items:center;color:#9d90ad;font:13px "Lilita One",sans-serif;letter-spacing:.08em;text-align:center;overflow:hidden}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot span{padding:4px 10px}
#scene{height:min(54dvh,420px);display:block}
#scene .nacha{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:44%;height:70%;border-radius:10px;background:#3a2f47;border:2px dashed var(--wfl);display:grid;place-items:center;overflow:hidden;transition:transform .25s}
#scene .nacha img{width:100%;height:100%;object-fit:contain}
#scene .nacha.sit{transform:translateX(-50%) translateY(6px) scale(.97)}
#scene .bgl{position:absolute;top:8px;left:0;right:0;text-align:center;pointer-events:none}
.bubble{background:#fff;color:#241518;border-radius:18px;padding:10px 14px;font-size:17px;line-height:1.3;min-height:48px;text-align:center;box-shadow:0 4px 0 #0004}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acts .btn{flex-direction:column;padding:12px 6px;font-size:16px}
.acts small{font:12px -apple-system,sans-serif;opacity:.8}
.today{font:13px "Lilita One",sans-serif;letter-spacing:.14em;color:#e9c9a4;text-align:center;margin:2px 0 -6px}
.gods{display:none;gap:8px;grid-template-columns:repeat(3,1fr)}
.gods.on{display:grid}
.gods .slot{aspect-ratio:3/4}
.gods b{display:block;font:14px "Lilita One",sans-serif;text-align:center;margin-top:4px;color:var(--cream)}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.doors .btn{font-size:15px}
.sec{font:13px "Lilita One",sans-serif;letter-spacing:.2em;color:#e9c9a4;margin:6px 0 -4px}
.quiet{font-size:13px;opacity:.7;text-align:center;appearance:none;background:none;border:0;color:inherit;cursor:pointer}
</style></head><body><div id="app"><main>
<div class="brand">NACHA</div>
<div class="today" id="today"></div>
<div class="slot" id="scene"><div class="bgl"><span>BACKGROUND · temple courtyard (GPT)</span></div>
  <img data-slot="bg" src="assets/bg.png" alt="" onerror="this.remove()">
  <div class="nacha" id="nacha"><span class="lil" style="color:#9d90ad;font-size:13px;text-align:center">NACHA<br>sitting / standing<br>(GPT)</span><img data-slot="nacha" src="assets/nacha.png" alt="" onerror="this.remove()"></div>
</div>
<div class="bubble" id="say">…</div>
<div class="acts">
  <button class="btn main" id="hi">Hello<small>say hi</small></button>
  <button class="btn" id="sit">Sit<small>next to him</small></button>
  <button class="btn" id="word">Listen<small>a word</small></button>
</div>
<button class="quiet" id="hush">just be quiet</button>

<div class="sec" id="gt" style="display:none">HIS FRIENDS</div>
<div class="gods" id="gods">
  <div><div class="slot"><img data-slot="kunsim" src="assets/kunsim.png" alt="" onerror="this.remove()"><span>WHITE<br>KUN SIM<br>(GPT)</span></div><b>White Kun Sim</b></div>
  <div><div class="slot"><img data-slot="fdo" src="assets/fdo.png" alt="" onerror="this.remove()"><span>FDO<br>KING<br>(GPT)</span></div><b>Fdo King</b></div>
  <div><div class="slot"><img data-slot="sousang" src="assets/sousang.png" alt="" onerror="this.remove()"><span>PREAH<br>SOUSANG<br>(GPT)</span></div><b>Preah Sousang</b></div>
</div>
<div id="follow"></div>

<div class="sec">TRAINING HALL</div>
<div class="bubble" id="rank" style="font-size:16px"></div>
<div class="doors">
  <a class="btn" href="../burn/">🔥 Fire watch</a>
  <a class="btn" href="../wisdom/">💭 Little wisdom</a>
  <a class="btn" href="../sweep/">🍂 Sweep</a>
  <a class="btn" href="../stack/">🛕 Build the tower</a>
  <a class="btn" href="../quiz/">Which friend are you?</a>
  <a class="btn" href="../">All games</a>
</div>
</main></div>
<script src="../common.js"></script>
<script>
(function(){"use strict";
var $=function(i){return document.getElementById(i)};
// Short English lines in NACHA's voice: warm, brave, direct. No promises, no money.
var WORDS=["Small steps still count.","You showed up. That's brave enough.","Breathe in. Breathe out. I'm right here.","Be kind to yourself today.","Not everything has to be fixed today.","Rest is part of the road.","Even I take a break sometimes.","One good thing is enough for today.","You are not behind.","It's okay to go slowly.","Say thanks to someone. Feel the warm.","Let the worries float away.","Brave doesn't mean no fear.","A little smile goes a long way.","Look up. The sky is big.","You've come a long way already.","Help one person today. Just one.","Tomorrow is a new morning.","Quiet is okay too.","Let's walk together, step by step.","Good things take time. So do you.","Drink some water. Stretch a bit.","You don't have to be perfect.","Kind words cost nothing.","Today's wind is gentle.","Keep your light. Share a little.","Mistakes are just practice.","Slow is still moving.","I believe in you. Really!","Come back anytime."];
var HI=["Oh, you're here! Welcome.","Hi hi! Sit anywhere.","Hello! Nice day, right?","Hey. I saved you a spot."];
var SIT=["Let's rest a little, together.","…","Mm. Nice and quiet."];
function get(k,d){try{var v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}}
function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var day=Math.floor(Date.now()/864e5), wi=day%WORDS.length, heard=+get("na-court-heard",0);
$("today").textContent="TODAY'S WORD";
$("say").textContent=WORDS[wi];
var n=$("nacha");
function say(t){$("say").textContent=t}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function friends(){ if(heard>=3){ $("gods").classList.add("on"); $("gt").style.display="block" } }
$("hi").onclick=function(){n.classList.remove("sit");say(pick(HI))};
$("sit").onclick=function(){n.classList.add("sit");say(pick(SIT))};
$("word").onclick=function(){wi=(wi+1)%WORDS.length;say(WORDS[wi]);heard++;set("na-court-heard",heard);friends()};
$("hush").onclick=function(){say("…")};
$("follow").innerHTML=NA.followRow();
friends();
var t=NA.trainTotal(),r=NA.rankOf(t),nx=NA.RANKS[r+1];
$("rank").textContent="Rank: "+NA.RANKS[r][0]+" · "+t+" training"+(nx?" · next rank at "+nx[1]:" · top rank")+". Every training session counts.";
})();
</script></body></html>
