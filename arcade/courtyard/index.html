<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>A Quiet Moment with NACHA</title><meta name="description" content="Take a quiet moment with NACHA in the courtyard."><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,sans-serif}body{color:#fff8e9;background:#332025 url('../assets/temple-courtyard.webp') center center/cover fixed}body:before{content:'';position:fixed;inset:0;background:linear-gradient(#23101c88,#25122044 50%,#21101ab8);pointer-events:none}main{position:relative;max-width:560px;min-height:100dvh;margin:auto;padding:22px 16px 32px;display:flex;flex-direction:column;align-items:center;text-align:center}a{color:#fff4d3;align-self:flex-start;min-height:44px}h1{font-family:Georgia,serif;font-size:clamp(28px,6vw,42px);margin:10px 0 0;text-shadow:0 2px 10px #2d1524}p{margin:7px 0;line-height:1.6}.lead{color:#f8e8c8}.character{width:min(62vw,300px);height:min(43vh,380px);object-fit:contain;object-position:center bottom;filter:drop-shadow(0 8px 15px #23150b88);margin:auto 0 4px}.message{width:100%;max-width:430px;min-height:76px;border:1px solid #ffffff55;background:#24141edb;border-radius:18px;padding:13px 18px;display:grid;place-items:center;line-height:1.6}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:430px;margin:14px 0 8px}button{min-height:52px;border:1px solid #f8d7a5aa;border-radius:14px;background:#3d2530e8;color:#fff4da;padding:9px;font:600 15px system-ui,sans-serif;cursor:pointer}button:hover{background:#684348}button:focus-visible,a:focus-visible{outline:3px solid #fff0a2;outline-offset:3px}.quiet{background:transparent;border:0;min-height:44px;color:#fff4da}.note{font-size:12px;color:#f5e4d3;max-width:420px}.sitting .character{transform:translateY(6px) scale(.97);transition:transform .4s}@media(max-height:680px){.character{height:31vh}main{padding-top:12px}h1{font-size:28px}.message{min-height:64px}}
</style></head><body><main id="scene"><a href="../">‹ More NACHA games</a><h1>A quiet moment</h1><p class="lead">Take a breath with NACHA.</p><img class="character" src="../assets/nacha-standing.webp" alt="NACHA in a red and gold outfit"><div id="message" class="message" aria-live="polite">Welcome. Stay as long as you like.</div><div class="controls"><button id="hello">Say hello</button><button id="sit">Sit together</button><button id="words">A few words</button></div><button class="quiet" id="quiet">Just enjoy the view</button><p class="note">A small, single-player preview. No account or timer needed.</p></main><script>
(function(){'use strict';var m=document.getElementById('message'),scene=document.getElementById('scene'),i=0,lines=['You can take your time.','A small step is still a step.','It is okay to pause for a while.','Let today be just as it is.'];document.getElementById('hello').onclick=function(){scene.classList.remove('sitting');m.textContent='Hello! I am glad you came.'};document.getElementById('sit').onclick=function(){scene.classList.add('sitting');m.textContent='Let’s rest here together for a moment.'};document.getElementById('words').onclick=function(){m.textContent=lines[i%lines.length];i++};document.getElementById('quiet').onclick=function(){m.textContent='';scene.classList.remove('sitting')};})();
</script></body></html>
