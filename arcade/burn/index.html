<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Burn the Haze · NACHA</title>
<meta name="description" content="Evil energy seeps into the old temple. Burn it away with Fdo King's goma fire.">
<meta property="og:title" content="Burn the Haze"><meta property="og:description" content="Burn the evil haze with Fdo King's fire!">
<meta name="theme-color" content="#120a1a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common.css">
<style>
  #stage{width:min(100vw,480px);height:100%;max-height:100dvh;overflow:hidden;background:#120a1a}
  #bg{position:absolute;inset:0;width:100%;height:100%}
  .scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 18px);text-align:center;text-shadow:0 2px 0 #0005}
  .scr.on{display:flex}
  .q{font:40px/1.05 "Lilita One",sans-serif;margin:0 0 6px;max-width:340px}
  .hero{height:200px}
  .hero svg{height:100%;width:auto}
  #play{justify-content:flex-start;padding-top:calc(env(safe-area-inset-top) + 14px)}
  .top{width:100%;display:flex;justify-content:space-between;font:18px "Lilita One",sans-serif}
  .mood{width:100%;height:12px;border-radius:7px;background:#00000040;overflow:hidden;margin-top:6px}
  .mood i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f4c430,#ff7a4a);transition:width .25s}
  .tbar{width:100%;height:6px;border-radius:3px;background:#00000030;overflow:hidden}
  .tbar i{display:block;height:100%;width:100%;background:#fff;transform-origin:left}
  .scene{position:relative;flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
  .scene #me{height:72%;width:auto;margin-bottom:6px;filter:drop-shadow(0 10px 0 #0003);transition:transform .2s}
  .scene #me.pop{transform:scale(1.05)}
  .bubble{position:absolute;top:2%;left:50%;transform:translateX(-50%);background:#fff;color:#241518;border-radius:24px;padding:6px 20px;font-size:54px;line-height:1.1;box-shadow:0 6px 0 #0003;text-shadow:none}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
  .fx{position:absolute;left:50%;top:38%;font:36px "Lilita One",sans-serif;color:var(--gold);animation:fx .8s ease-out forwards;pointer-events:none}
  @keyframes fx{to{transform:translateY(-60px);opacity:0}}
  .gifts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:360px;padding-bottom:4px}
  .gift{appearance:none;border:2px solid #ffffff33;background:#150a1acc;border-radius:20px;font-size:44px;padding:12px 0;cursor:pointer;transition:transform .08s}
  .gift:active{transform:scale(.92)}
  .gift.ok{background:#2f7d4f}.gift.no{background:#8f2a22}
  .score{font:92px/1 "Lilita One",sans-serif;color:var(--gold);text-shadow:0 5px 0 #d35400}
  .gname{font:30px/1.05 "Lilita One",sans-serif}
  .match{font-size:14px;color:#f6dfbf}
</style>
<style>
  #field{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  .hud{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:16px;right:16px;display:flex;justify-content:space-between;font:22px "Lilita One",sans-serif;pointer-events:none;text-shadow:0 2px 0 #0007}
  .pur{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 46px);height:10px;border-radius:6px;background:#0006;overflow:hidden;pointer-events:none}
  .pur i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff7a4a,#f4c430);transition:width .2s}
  .lore{font-size:15px;color:#f6dfbf;max-width:300px;line-height:1.35}
</style>
</head>
<body>
<div id="app"><div id="stage">
  <canvas id="bg"></canvas><canvas id="field"></canvas>
  <div class="hud" id="hud" style="display:none"><span id="sc">0</span><span id="tm">30</span></div>
  <div class="pur" id="pw" style="display:none"><i id="pf"></i></div>

  <section class="scr on" id="s0">
    <div class="brand">NACHA</div>
    <h1 class="q">The haze is back…</h1>
    <div class="hero" id="introMe"></div>
    <div class="lore">Tap the haze before it reaches the temple. Chain taps for combos. Gold haze = big blast.</div><div class="lore" id="rv"></div>
    <button class="btn main" id="go">Tap to burn</button>
  </section>

  <section class="scr" id="sr">
    <div class="brand">NACHA</div>
    <div class="hero" id="resMe"></div>
    <div class="score" id="rs">0</div>
    <div class="match" style="margin-top:-6px;letter-spacing:.2em">HAZE BURNED</div>
    <div class="gname" id="rt"></div>
    <div class="lore" id="rl"></div>
    <div id="rGods"></div>
    <div class="row"><button class="btn main" id="share">Share</button><button class="btn" id="chal">Pass the flame</button></div><div class="row"><button class="btn" id="again">Again</button></div>
    <div id="rFollow"></div>
    <a class="btn" href="../" style="padding:9px 16px;font-size:15px">More games</a>
  </section>
</div></div>
<script src="../common.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var bg = $("bg"), bx = bg.getContext("2d"), fd = $("field"), fx = fd.getContext("2d");
  var W, H, leaves, last = 0, t00 = performance.now();
  var run = false, blobs = [], sparks = [], score = 0, purity = 1, timeLeft = 30, spawn = 0, combo = 0, bestC = 0, rnd = Math.random, seed = 0, team = 0, GOAL = 200;
  var Q = new URLSearchParams(location.search);
  if (Q.get("s")) { seed = +Q.get("s") || 0; team = +Q.get("t") || 0; }
  function mk(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function best() { try { return +localStorage.getItem("na-burn") || 0; } catch (e) { return 0; } }
  function setBest(v) { try { localStorage.setItem("na-burn", v); } catch (e) {} }
  function fit() { W = $("stage").clientWidth; H = $("stage").clientHeight; var d = Math.min(2, devicePixelRatio || 1);
    [bg, fd].forEach(function (c) { c.width = W * d; c.height = H * d; }); bx.setTransform(d, 0, 0, d, 0, 0); fx.setTransform(d, 0, 0, d, 0, 0); leaves = NA.leaves(10, W, H); }
  addEventListener("resize", fit);
  function show(id) { ["s0", "sr"].forEach(function (s) { $(s).classList.toggle("on", s === id); }); var p = id === "play"; $("hud").style.display = $("pw").style.display = p ? "flex" : "none"; $("pw").style.display = p ? "block" : "none"; }
  function addBlob() {
    var r = 24 + rnd() * 18, big = rnd() < 0.18, gold = !big && rnd() < 0.08;
    blobs.push({ x: r + rnd() * (W - 2 * r), y: -r, r: big ? r * 1.5 : r, hp: big ? 2 : 1, gold: gold, v: 38 + rnd() * 30 + (30 - timeLeft) * 2.2, ph: rnd() * 6 });
  }
  function drawBlob(b, t) {
    var g = fx.createRadialGradient(b.x, b.y, 2, b.x, b.y, b.r * 1.5);
    g.addColorStop(0, "#2a1635ee"); g.addColorStop(.7, "#3b1a4acc"); g.addColorStop(1, "#3b1a4a00");
    fx.fillStyle = g; fx.beginPath();
    for (var i = 0; i <= 12; i++) { var a = i / 12 * 6.283, rr = b.r * (1.15 + 0.14 * Math.sin(a * 3 + t * 3 + b.ph)); fx.lineTo(b.x + Math.cos(a) * rr, b.y + Math.sin(a) * rr); }
    fx.fill();
    fx.fillStyle = b.gold ? "#ffe27a" : "#ff3b2f"; if (b.gold) { fx.strokeStyle = "#f4c430"; fx.lineWidth = 3; fx.stroke(); } var e = b.r * 0.32;
    [-1, 1].forEach(function (s) { fx.beginPath(); fx.ellipse(b.x + s * e, b.y - e * 0.2, b.r * 0.12, b.r * 0.2, 0, 0, 6.283); fx.fill(); });
  }
  function flame(x, y, n) { for (var i = 0; i < n; i++) sparks.push({ x: x, y: y, vx: (Math.random() - .5) * 220, vy: -60 - Math.random() * 200, l: 0.5 + Math.random() * 0.4, c: Math.random() < .5 ? "#ffb02e" : "#ff5a1f" }); }
  function step(dt, now) {
    fx.clearRect(0, 0, W, H);
    // temple glow at bottom
    var gl = fx.createLinearGradient(0, H - 90, 0, H); gl.addColorStop(0, "#f4c43000"); gl.addColorStop(1, "rgba(244,196,48," + (0.15 + 0.35 * purity) + ")");
    fx.fillStyle = gl; fx.fillRect(0, H - 90, W, 90);
    if (run) {
      timeLeft -= dt; spawn -= dt;
      if (spawn <= 0) { addBlob(); spawn = Math.max(0.35, 0.95 - (30 - timeLeft) * 0.02); }
      for (var i = blobs.length - 1; i >= 0; i--) { var b = blobs[i]; b.y += b.v * dt; b.x += Math.sin(now / 600 + b.ph) * 14 * dt;
        if (b.y > H - 40) { blobs.splice(i, 1); purity = Math.max(0, purity - 0.1); combo = 0; } }
      $("sc").textContent = score + (combo > 2 ? "  x" + (1 + Math.floor(combo / 5)) : ""); $("tm").textContent = Math.max(0, Math.ceil(timeLeft)); $("pf").style.width = (purity * 100) + "%";
      if (timeLeft <= 0 || purity <= 0) end();
    }
    blobs.forEach(function (b) { drawBlob(b, now / 1000); });
    for (var j = sparks.length - 1; j >= 0; j--) { var s = sparks[j]; s.l -= dt; if (s.l <= 0) { sparks.splice(j, 1); continue; }
      s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 260 * dt; fx.globalAlpha = Math.min(1, s.l * 2); fx.fillStyle = s.c; fx.beginPath(); fx.arc(s.x, s.y, 4, 0, 6.283); fx.fill(); }
    fx.globalAlpha = 1;
  }
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    NA.drawBG(bx, W, H, (now - t00) * 0.012, (now - t00) / 1000, "night"); NA.drawLeaves(bx, leaves, W, H, dt);
    step(dt, now); requestAnimationFrame(frame);
  }
  fd.addEventListener("pointerdown", function (e) {
    if (!run) return; e.preventDefault();
    var r = fd.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    for (var i = blobs.length - 1; i >= 0; i--) { var b = blobs[i];
      if (Math.hypot(b.x - x, b.y - y) < b.r * 1.5 + 14) { b.hp--; flame(b.x, b.y, 10); if (b.hp <= 0) { blobs.splice(i, 1); combo++; bestC = Math.max(bestC, combo);
        if (b.gold) { purity = Math.min(1, purity + 0.25); blobs.forEach(function (o) { flame(o.x, o.y, 8); score += 1; }); blobs.length = 0; }
        score += 1 + Math.floor(combo / 5); } return; } }
    combo = 0; flame(x, y, 3);
  });
  function start() { blobs = []; sparks = []; score = 0; combo = 0; bestC = 0; purity = 1; timeLeft = 30; spawn = 0.3; run = true; if (!seed) seed = (Math.random() * 1e9) | 0; rnd = mk(seed); show("play"); }
  function end() {
    run = false; blobs = []; show("sr");
    var pure = purity > 0, big = score >= 28;
    $("resMe").innerHTML = NA.god("fdo").replace("<svg ", '<svg style="height:100%;width:auto" ');
    $("rs").textContent = score;
    $("rt").textContent = !pure ? "The haze got in…" : big ? "The temple is pure! 🔥" : "Some haze remains";
    
    NA.unlock("fdo"); var b0 = best(), nb = score > b0; if (nb) setBest(score);
    $("rl").textContent = (nb ? "New best! " : "Best " + b0 + " · ") + "Max combo " + bestC + (team ? " · Team " + Math.min(GOAL, team + score) + " / " + GOAL + (team + score >= GOAL ? " 🔥 Purified together!" : "") : ""); $("rGods").innerHTML = NA.godsStrip(""); $("rFollow").innerHTML = NA.followRow();
  }
  $("chal").addEventListener("click", function () {
    var u = location.origin + location.pathname + "?s=" + seed + "&t=" + (team + score);
    var t = "Pass the flame! Our team has burned " + (team + score) + " / " + GOAL + ". Add yours: " + u + " " + NA.HANDLE + " #NACHA";
    if (navigator.share) navigator.share({ text: t }).catch(function () {}); else if (navigator.clipboard) navigator.clipboard.writeText(t).then(function () { NA.toast("Link copied"); });
  });
  $("go").addEventListener("click", function () { if (!team) seed = 0; start(); }); $("again").addEventListener("click", function () { if (!team) seed = 0; start(); });
  $("share").addEventListener("click", function () {
    NA.fontReady().then(function () { return NA.card({ svg: NA.god("fdo"), big: String(score), label: "I BURNED THE HAZE", line: "Fdo King's fire never rests. Can you beat me?", theme: "night" }); })
      .then(function (c) { return NA.share(c, "I burned " + score + " haze with Fdo King! " + NA.HANDLE + " #NACHA", "nacha-burn.png"); });
  });
  $("introMe").innerHTML = NA.god("fdo").replace("<svg ", '<svg style="height:100%;width:auto" ');
  if (team) $("rv").textContent = "Team fire: " + team + " / " + GOAL + ". Add yours!";
  NA.fontReady().then(function () { fit(); requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
