<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sweep the Courtyard · NACHA</title>
<meta name="description" content="Swipe the falling leaves away. Golden leaves are worth more."><meta name="theme-color" content="#1d1020">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common.css">
<style>#stage{width:min(100vw,480px);height:100%;max-height:100dvh;overflow:hidden}#c{width:100%;height:100%}.hint{font-size:15px;color:#f6dfbf;max-width:300px}.em{font-size:64px}</style>
</head><body><div id="app"><div id="stage">
<canvas id="c"></canvas>
<div class="hud"><span class="big" id="sc"></span><span class="sm r" id="sub"></span></div>
<div class="ov on" id="o0"><div class="brand">NACHA</div><div class="title">Sweep the Courtyard</div><div class="em">🍂</div><div class="hint">Swipe the falling leaves away. Golden leaves are worth more.</div><button class="btn main" id="go">Play</button><a class="btn" href="../" style="padding:9px 16px;font-size:15px">More games</a></div>
<div class="ov" id="o1"><div class="brand">NACHA</div><div class="label">LEAVES SWEPT</div><div class="score" id="rs">0</div><div class="best" id="rb"></div><div class="title" id="rt" style="font-size:26px"></div><div id="rF"></div>
<div class="row"><button class="btn main" id="sh">Share</button><button class="btn" id="again">Again</button></div><a class="btn" href="../" style="padding:9px 16px;font-size:15px">More games</a></div>
</div></div>
<script src="../common.js"></script>
<script>
(function(){"use strict";
var $=function(i){return document.getElementById(i)},cv=$("c"),x=cv.getContext("2d"),W,H,t0=performance.now(),last=0,leaves,run=false,KEY="na-lab-sweep";
function fit(){W=$("stage").clientWidth;H=$("stage").clientHeight;var d=Math.min(2,devicePixelRatio||1);cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0);leaves=NA.leaves(8,W,H)}
addEventListener("resize",fit);
function emo(c,px,py,s){x.font=s+"px serif";x.textAlign="center";x.textBaseline="middle";x.fillText(c,px,py)}
function best(){try{return+localStorage.getItem(KEY)||0}catch(e){return 0}}
var G;

G={lv:[],mess:0,sc:0,tm:0,sp:0,drag:false,px:0,py:0,cb:0,
init:function(){this.lv=[];this.mess=0;this.sc=0;this.tm=40;this.sp=0;this.drag=false;this.cb=0;$("sub").textContent="40";
 if(!G._m){G._m=1;cv.addEventListener("pointermove",function(e){var p=pt(e);G.px=p.x;G.py=p.y;if(G.drag)G.sweep()})}},
down:function(p){this.drag=true;this.px=p.x;this.py=p.y;this.sweep()},up:function(){this.drag=false},
sweep:function(){var g=this,n=0;for(var i=g.lv.length-1;i>=0;i--){var l=g.lv[i];if(Math.hypot(l.x-g.px,l.y-g.py)<l.r+34){g.lv.splice(i,1);n++;g.sc+=l.gold?5:1}}
 if(n>=3){g.sc+=Math.floor(n/3)}if(n)$("sc").textContent=g.sc},
step:function(dt){var g=this;g.tm-=dt;g.sp-=dt;$("sub").textContent=Math.max(0,Math.ceil(g.tm));
 if(g.sp<=0){g.sp=Math.max(.16,.6-(40-g.tm)*.012);var gold=Math.random()<.1;g.lv.push({x:20+Math.random()*(W-40),y:-20,r:gold?16:12,v:70+Math.random()*60+(40-g.tm)*3,ph:Math.random()*6,gold:gold})}
 for(var i=g.lv.length-1;i>=0;i--){var l=g.lv[i];l.y+=l.v*dt;l.x+=Math.sin(l.y/40+l.ph)*30*dt;if(l.y>H-30){g.lv.splice(i,1);g.mess+=l.gold?.02:.045}}
 if(g.mess>=1){finish(g.sc,"The courtyard is covered…");return}
 if(g.tm<=0)finish(g.sc,g.sc>=70?"Spotless! 🍂":"A tidy courtyard")},
draw:function(){var g=this;x.fillStyle="rgba(192,57,43,"+Math.min(.55,g.mess*.6)+")";x.fillRect(0,H-30-g.mess*80,W,30+g.mess*80);
 g.lv.forEach(function(l){x.fillStyle=l.gold?"#f4c430":"#c0392b";x.beginPath();x.ellipse(l.x,l.y,l.r,l.r*.6,l.y/30,0,6.283);x.fill()});
 if(g.drag){x.strokeStyle="#ffffffaa";x.lineWidth=3;x.beginPath();x.arc(g.px,g.py,34,0,6.283);x.stroke()}
 x.fillStyle="#ffffff30";x.font="15px 'Lilita One'";x.textAlign="center";x.fillText("swipe the leaves",W/2,H-10)}};

function start(){$("o0").classList.remove("on");$("o1").classList.remove("on");G.init();run=true}
function finish(score,msg){run=false;var b=best(),nb=score>b;if(nb)try{localStorage.setItem(KEY,score)}catch(e){}
 $("rs").textContent=score;$("rb").textContent=nb?"New best!":"Best "+b;$("rt").textContent=msg;var tr=NA.train(10);$("rb").textContent+=" · "+tr.line;$("rF").innerHTML=NA.followRow();$("o1").classList.add("on");G.last=score}
function frame(now){var dt=Math.min(.05,(now-last)/1000);last=now;
 NA.drawBG(x,W,H,(now-t0)*.012,(now-t0)/1000,"cream");NA.drawLeaves(x,leaves,W,H,dt);
 if(run)G.step(dt);G.draw();requestAnimationFrame(frame)}
$("go").onclick=start;$("again").onclick=start;
$("sh").onclick=function(){var t="I swept "+G.last+"! "+NA.HANDLE+" #NACHA",u=location.href.split("?")[0];if(navigator.share)navigator.share({text:t,url:u}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(t+" "+u).then(function(){NA.toast("Copied")})};
function pt(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener("pointerdown",function(e){e.preventDefault();if(run&&G.down)G.down(pt(e))});
cv.addEventListener("pointerup",function(e){if(run&&G.up)G.up(pt(e))});
cv.addEventListener("pointercancel",function(){if(run&&G.up)G.up({x:0,y:0})});
G.init&&0;NA.fontReady().then(function(){fit();G.init();requestAnimationFrame(frame)});
})();
</script></body></html>
