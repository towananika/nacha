<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Climb 108 steps with NACHA, one step at a time."><title>108 Steps · NACHA</title>
<link rel="stylesheet" href="../common.css">
<style>
body{overflow:hidden;background:#281e2c}#stage{width:min(100vw,480px);height:100dvh;position:relative;overflow:hidden;margin:auto}.scr{position:absolute;inset:0;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 14px);gap:10px}.scr.on{display:flex}.ctr{align-items:center;justify-content:center;text-align:center}.h1{font:700 34px/1.1 system-ui,sans-serif}.lore{font-size:15px;color:#f6dfbf;max-width:320px;line-height:1.5}.top{display:flex;justify-content:space-between;font-weight:700}.bar{height:8px;border-radius:6px;background:#0006;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#e9c267;transition:width .2s}.view{position:relative;flex:1;min-height:160px;border:1px solid #ffffff40;border-radius:16px;overflow:hidden;background:#b9d1bd}.view canvas{width:100%;height:100%;display:block}.bubble{background:#fff9e8;color:#32242a;border-radius:16px;padding:10px 14px;font-size:16px;text-align:center;min-height:44px}.walk{font:700 21px system-ui,sans-serif;padding:15px;min-height:58px;touch-action:none}.walk:focus-visible,.btn:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:3px}.row{max-width:360px}.foot{color:#f6dfbf;font-size:12px;text-align:center;margin:0}#view-label{font-size:13px;color:#f6dfbf;text-align:center}.art{height:min(38vh,240px);width:auto;max-width:75%;object-fit:contain}
@media(max-height:610px){.scr{gap:6px}.walk{min-height:48px;padding:8px}.art{height:24vh}}
.sight{position:absolute;font-size:34px;cursor:pointer;animation:fl 1.6s ease-in-out infinite alternate;filter:drop-shadow(0 2px 3px #0006)}@keyframes fl{to{transform:translateY(-8px)}}.glowflash{box-shadow:inset 0 0 40px 6px #ffd84acc;transition:box-shadow .5s}
</style></head><body><div id="app"><main id="stage">
<section class="scr ctr on" id="intro"><div class="brand">NACHA</div><h1 class="h1">108 Steps</h1><p class="lore">Climb a quiet mountain, one step at a time.</p><img class="art" src="assets/nacha-simple.png" alt="NACHA ready to climb"><button class="btn main" id="start">Start climbing</button><a class="btn" href="../">More games</a></section>
<section class="scr" id="play"><div class="top"><span id="count">0 / 108</span><span id="remaining">108 steps to the summit</span></div><div class="bar"><i id="bar"></i></div><div class="view" id="view" aria-label="NACHA climbs a mountain staircase"><canvas id="scene" role="img" aria-label="NACHA climbing stairs through the mountains"></canvas></div><div class="bubble" id="message" aria-live="polite">Let's take the first step.</div><div id="view-label">Forest</div><button class="btn main walk" id="walk">Climb one step ▲</button><p class="foot">Tap, or hold to keep climbing.</p></section>
<section class="scr ctr" id="finish"><div class="brand">NACHA</div><h1 class="h1">108 steps!</h1><p class="lore">You made it to the summit. Rest here, or keep climbing at your own pace.</p><div class="lore" id="rating"></div><div class="bubble" id="tword"></div><div id="follow"></div><button class="btn main" id="continue">Keep climbing</button><div class="row"><button class="btn" id="again">Start again</button><button class="btn" id="share">Share</button></div><a class="btn" href="../">More games</a></section>
</main></div><script src="../common.js"></script><script>
(function(){'use strict';
var $=function(id){return document.getElementById(id)},canvas=$('scene'),ctx=canvas.getContext('2d'),sprite=new Image();sprite.src='assets/nacha-simple.png';
var WORDS=['Small steps still count.','Rest is part of the climb.','Be kind. Quietly.','Today is enough.','Brave is just one more step.','Help first. Talk later.','Burn the worry, keep the warmth.','Look up. The view is yours.','Gratitude makes the path lighter.','Mischief is fine. Meanness is not.','One good deed. Tell no one.','Fall down? Smile. Climb again.','Slow is still moving.','A good heart is a strong heart.'],streak=0;
var SIGHTS=[['🐒','A monkey waves hello.'],['🦋','A butterfly lands nearby.'],['🐦','A bird sings above.'],['🪨','A mossy stone Buddha. You bow.'],['⛲','Cool water. Refreshing!'],['🔔','A distant bell rings.'],['🦌','A deer watches, then leaves.'],['🏮','A lantern left on a rock.'],['🕊️','A white bird glides by.']],found=0,lastSight=0,best=0;try{best=+localStorage.getItem('na-steps-best')||0}catch(e){}
function gold(n){return n>0&&n%11===0}
var step=0, visualStep=0, milestone=false, downTimer=null, downDelay=null, held=false, w=0,h=0,last=0, bob=0,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function show(id){['intro','play','finish'].forEach(function(v){$(v).classList.toggle('on',v===id)});}
function size(){var box=$('view'),d=Math.min(devicePixelRatio||1,2);w=box.clientWidth;h=box.clientHeight;canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);}
function color(a,b,t){var x=parseInt(a.slice(1),16),y=parseInt(b.slice(1),16);var c=[16,8,0].map(function(n){return Math.round(((x>>n)&255)*(1-t)+((y>>n)&255)*t)});return 'rgb('+c.join(',')+')'}
function mountain(base,amp,shade,phase){ctx.beginPath();ctx.moveTo(0,h);for(var x=0;x<=w+4;x+=4){var y=base-(Math.sin(x/w*5+phase)*.5+.5)*amp-Math.sin(x/w*12+phase)*amp*.12;ctx.lineTo(x,y)}ctx.lineTo(w,h);ctx.closePath();ctx.fillStyle=shade;ctx.fill()}
function render(now){requestAnimationFrame(render);if(!$('play').classList.contains('on'))return;if(!w||!h)size();var dt=last?Math.min((now-last)/1000,.05):.016;last=now;visualStep+=(step-visualStep)*(reduce?1:Math.min(1,dt*8));bob*=Math.pow(.001,dt);var t=Math.min(step/108,1),sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,color('#a8d4c4','#a9cbe0',t));sky.addColorStop(1,color('#e5d9b2','#f9dfaa',t));ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);
ctx.fillStyle='rgba(255,246,209,.65)';ctx.beginPath();ctx.arc(w*.77,h*.17,w*.09,0,Math.PI*2);ctx.fill();mountain(h*.58,h*(.15+.13*t),color('#9cb7a0','#91a9ae',t),.4);mountain(h*.69,h*(.15+.07*t),color('#6d957c','#7f9d8b',t),2.3);mountain(h*.79,h*.16,color('#48765e','#5b826e',t),4);
var horizon=h*.38,bottom=h*1.12,spacing=12,offset=((visualStep%1)+1)%1;
ctx.fillStyle='#a59175';ctx.beginPath();ctx.moveTo(w*.425,horizon);ctx.lineTo(w*.575,horizon);ctx.lineTo(w*1.065,bottom);ctx.lineTo(-w*.065,bottom);ctx.closePath();ctx.fill();
for(var i=spacing;i>=0;i--){var p=(i+offset)/spacing;if(p>1)continue;var y=horizon+(bottom-horizon)*p*p,half=w*(.075+.49*p*p),thick=1.5+h*.012*p;
ctx.strokeStyle='rgba(91,70,52,.7)';ctx.lineWidth=Math.max(1,thick*.28);ctx.beginPath();ctx.moveTo(w/2-half,y);ctx.lineTo(w/2+half,y);ctx.stroke();
var gn=Math.floor(visualStep)+i;ctx.strokeStyle=gold(gn)?'rgba(255,216,74,.95)':'rgba(255,239,205,.48)';ctx.lineWidth=Math.max(1,thick*(gold(gn)?.55:.18));ctx.beginPath();ctx.moveTo(w/2-half,y-thick*.6);ctx.lineTo(w/2+half,y-thick*.6);ctx.stroke();}
var sh=Math.min(h*.30,w*.38),sw=sh*(sprite.naturalWidth&&sprite.naturalHeight?sprite.naturalWidth/sprite.naturalHeight:1);if(sprite.complete&&sprite.naturalWidth){ctx.save();ctx.translate(w/2,h*.78-(reduce?0:bob*8));ctx.scale(step%2?-1:1,1);ctx.drawImage(sprite,-sw/2,-sh,sw,sh);ctx.restore();}}
function paint(){$('count').textContent=step<=108?step+' / 108':step+' steps';$('remaining').textContent=step<108?(108-step)+' steps to the summit':'Beyond the summit';$('bar').style.width=Math.min(step/108*100,100)+'%';$('view-label').textContent=step<=27?'Forest':step<=54?'Hillside':step<=81?'Ridge':step<=108?'Summit':'Beyond the summit';}
function advance(){if(!$('play').classList.contains('on'))return;step++;bob=1;paint();if(gold(step)){$('message').textContent='Golden stair! A good sign.';var v=$('view');v.classList.add('glowflash');setTimeout(function(){v.classList.remove('glowflash')},400)}if(step-lastSight>=12&&step<108){lastSight=step;sight()}if(step===108&&!milestone){milestone=true;stopHold();stars();show('finish');if(window.NA&&typeof NA.train==='function')NA.train(10);}}
function sight(){var old=$('view').querySelector('.sight');if(old){streak=0;old.remove()}var p=SIGHTS[Math.floor(Math.random()*SIGHTS.length)],e=document.createElement('div');e.className='sight';e.textContent=p[0];e.style.left=(8+Math.random()*72)+'%';e.style.top=(8+Math.random()*30)+'%';e.onclick=function(){found++;streak++;$('message').textContent=streak>=2?p[1]+' NACHA: "'+WORDS[Math.floor(Math.random()*WORDS.length)]+'"':p[1];e.remove();e.tapped=1};$('view').appendChild(e)}
function stars(){$('tword').textContent='NACHA\'s Word: '+WORDS[Math.floor(Date.now()/864e5)%WORDS.length];var n=found>=6?3:found>=3?2:1;if(n>best){best=n;try{localStorage.setItem('na-steps-best',best)}catch(e){}}$('rating').textContent='★'.repeat(n)+'☆'.repeat(3-n)+'  ('+found+' sights found · best '+'★'.repeat(best)+')'}
function stopHold(){clearTimeout(downDelay);clearInterval(downTimer);downDelay=null;downTimer=null;held=false;}
$('walk').addEventListener('pointerdown',function(e){if(e.button!==0)return;e.preventDefault();held=true;this.setPointerCapture(e.pointerId);advance();if(held)downDelay=setTimeout(function(){downTimer=setInterval(advance,170)},350)});
['pointerup','pointercancel','lostpointercapture'].forEach(function(v){$('walk').addEventListener(v,stopHold)});$('walk').addEventListener('click',function(e){if(e.detail===0)advance()});window.addEventListener('blur',stopHold);
function start(){stopHold();found=0;streak=0;lastSight=0;var o=$('view').querySelector('.sight');if(o)o.remove();step=0;visualStep=0;milestone=false;last=0;show('play');size();paint();$('message').textContent="Let's take the first step."}
$('start').onclick=start;$('again').onclick=start;$('continue').onclick=function(){show('play');size();paint();$('message').textContent="The path continues. Take your time."};
$('share').onclick=function(){var text='I climbed 108 steps with NACHA! #NACHA',url=location.href.split('?')[0];if(navigator.share)navigator.share({text:text,url:url}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(text+' '+url).then(function(){if(window.NA)NA.toast('Copied')}).catch(function(){})};
if(window.NA)$('follow').innerHTML=NA.followRow();window.addEventListener('resize',size);requestAnimationFrame(render);
})();</script></body></html>
