<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<style>
@media (pointer:coarse){#lrb{display:none!important}}

body{overflow:hidden;background:#1d1020;touch-action:manipulation;-webkit-user-select:none;user-select:none}

.hiker.up{bottom:11%}
.stairs{position:absolute;left:0;right:0;bottom:0;height:26%;background:repeating-linear-gradient(0deg,#3c2f4a 0 14px,#4a3a5c 14px 28px)}
.sight{position:absolute;font-size:36px;cursor:pointer;animation:fl 1.6s ease-in-out infinite alternate}@keyframes fl{to{transform:translateY(-8px)}}
.bubble{background:#fff;color:#241518;border-radius:18px;padding:9px 14px;font-size:16px;line-height:1.3;text-align:center;box-shadow:0 4px 0 #0004;min-height:42px}
#climb{font-size:24px;padding:18px}
.opts{display:grid;gap:8px;width:100%}.opts .btn{justify-content:flex-start;text-align:left;font-size:16px;padding:12px 16px}
.opts small{font:12px sans-serif;opacity:.8;display:block;margin-top:2px}
.views{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.vc{font-size:11px;font-family:"Lilita One";padding:3px 8px;border-radius:10px;background:#ffffff18;color:#9d90ad}.vc.on{background:var(--gold);color:#241518}
.chal{width:100%;height:46px;border-radius:12px;background:#0006;position:relative;overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:#7ad07a88}.mk{position:absolute;top:4px;bottom:4px;width:8px;border-radius:4px;background:#fff}
.stars{font-size:34px;letter-spacing:6px}
</style></head><body><div id="app"><div id="stage">

<section class="scr ctr on" id="s0">

  <div class="view" id="vw"><div class="pano" id="pano"><img id="pimg" alt="" onerror="this.style.display='none'"><span id="plab"></span></div><canvas id="cv"></canvas><div id="hint" style="position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:space-between;padding:0 16px;font:18px 'Lilita One',sans-serif;color:#fff;text-shadow:0 2px 4px #000a;pointer-events:none;transition:opacity .6s"><span>◀ tap left</span><span>tap right ▶</span></div></div>

</section>

<section class="scr ctr" id="se">
  <div class="brand">NACHA</div>
  <div class="h1">The summit!</div>
  <div class="view" style="width:100%;flex:0 0 34%"><div class="pano" style="background:linear-gradient(#f4c43055,#c0392b44)"><img src="assets/view4.webp" alt="" style="object-position:50% 20%" onerror="this.style.display='none'"></div></div>

  <div id="ef"></div>
  <button class="btn main" id="tol" style="font-size:20px">🌟 Jump to heaven</button>
  <div class="row"><button class="btn" id="again">Again</button><button class="btn" id="sh">Share</button></div>
  <a class="btn" href="../" style="padding:9px 16px;font-size:15px">More games</a>
</section>

<section class="scr" id="sl">
  <div class="top"><span>Jump to heaven</span><span id="lh">&nbsp;</span></div>
  <div class="view" id="lv"><div class="pano" id="lp"><span>SKY (GPT: sunrise → clouds → stars)</span></div>
    <div class="hiker" id="car" style="width:90px;height:100px;bottom:6%;border:0;background:none"><img src="assets/nacha-climb.webp" alt="NACHA" style="width:100%;height:100%;object-fit:contain" onerror="this.parentNode.textContent='NACHA'"></div></div>
  <div class="bar"><i id="lb" style="width:0"></i></div>

  <div class="row" id="lr" style="display:none"><button class="btn" id="la">Jump again</button><button class="btn main" id="ls">Share</button></div>
  <div id="lf"></div>
</section>

</div></div>
<script src="../common.js"></script>
<script>
(function(){"use strict";
var $=function(i){return document.getElementById(i)};
var TIERS=[
 {to:27,n:"Forest",bg:"linear-gradient(#3f7a56,#1d3a2c)",sc:1.7},
 {to:54,n:"Hillside",bg:"linear-gradient(#6aa0b8,#3a5a40)",sc:1.4},
 {to:81,n:"Ridge",bg:"linear-gradient(#e8895a,#6a4a78)",sc:1.15},
 {to:108,n:"Summit sky",bg:"linear-gradient(#f4c430,#c0392b)",sc:1.0}];
var SIGHTS=[["🐒","A monkey waves hello."],["🦋","A butterfly lands near you."],["🐦","A bird sings above."],["🪨","A mossy stone Buddha. You bow."],["⛲","Cool water. Refreshing!"],["🛖","A tiny rest hut."],["🌫️","Mist drifts past."],["🔔","A distant bell rings."]];
var TS=[[["🐒","A monkey waves hello."],["🦋","A butterfly lands near you."],["🍄","A little mushroom ring."]],
 [["🦌","A deer watches, then leaves."],["🌧️","A quick shower. It passes."],["🪷","A pond of lotus below."]],
 [["🦅","An eagle circles high."],["🌬️","A cool wind lifts your sleeves."],["🏮","A lantern left on a rock."]],
 [["⭐","A star in the daytime?"],["☁️","Clouds at your feet."],["🕊️","A white bird glides by."]]];
var step,stam,vistas,badges,resting,lastSight,nextFork,rt;
function show(id){["s0","sp","se","sl"].forEach(function(s){$(s).classList.toggle("on",s===id)})}
function tier(){for(var i=0;i<TIERS.length;i++)if(step<=TIERS[i].to)return TIERS[i];return TIERS[3]}
function paint(){var hn=$("hint");if(hn)hn.style.opacity=step<6?1:0;var t=tier();$("st").textContent=step+" / 108";$("wo").textContent=(108-step)+" worries left";$("sb").style.width=(step/108*100)+"%";
  $("pano").style.backgroundImage=t.bg;$("pano").style.backgroundSize="100% 260%";$("pano").style.backgroundPosition="50% "+(100-step/108*100)+"%";var im=$("pimg"),n=TIERS.indexOf(t)+1;if(im.dataset.n!=n){im.dataset.n=n;im.style.display="";im.src="assets/view"+n+".png"}$("pano").style.transform="none";$("plab").textContent="";var ti=TIERS.indexOf(t),p0=Math.min(1,Math.max(0,(step-ti*27)/27));im.style.height="128%";im.style.transition="transform .5s";im.style.transform="translateY("+(-21.9*(1-p0)).toFixed(1)+"%)";
  var g="";for(var k=0;k<9;k++)g+='<span class="vc'+(k<gauge?" on":"")+'">&nbsp;</span>';$("vs").innerHTML=g+'<span class="vc'+(gauge>=9?" on":"")+'">FLIP</span>'}
function say(t){$("say").textContent=t}
function newSight(){[].slice.call($("vw").querySelectorAll(".sight")).forEach(function(e){e.remove()});
  var pool=SIGHTS.concat(TS[TIERS.indexOf(tier())]),s=pool[Math.floor(Math.random()*pool.length)],e=document.createElement("div");e.className="sight";e.textContent=s[0];e.style.left=(10+Math.random()*70)+"%";e.style.top=(10+Math.random()*40)+"%";
  e.onclick=function(){say(s[1]);gauge=Math.min(9,gauge+1);e.remove();paint()};$("vw").appendChild(e)}
var gimg=new Image(),gok=false,glow=0,gauge=0;gimg.onload=function(){gok=true};gimg.src="assets/step-glow.webp";
var FALL=3,FLIPBACK=3;
var obs=[-1],pl=1,walkT=0,moveV=0,lean=0,sway=0,dirs=[],cvx=$("cv").getContext("2d"),CW=0,CH=0,cam={x:0,y:0},hop=0,flipT=null,ready=false,flipA=0,shake=0,xs=[],nimg=new Image(),nok=false;
nimg.onload=function(){nok=true};nimg.src="assets/nacha-climb.webp";
var PAL=["#5a8a64","#7a9aa8","#c08a6a","#d8b45a"];
function build(){obs=[-1];for(var i=1;i<400;i++){var o=-1;if(i>2&&Math.random()<.55){o=Math.random()<.5?0:1;if(obs[i-1]===o&&obs[i-2]===o)o=1-o}obs.push(o)}pl=1;cam={x:0,y:0}}
function size(){var v=$("vw"),r=window.devicePixelRatio||1;CW=v.clientWidth;CH=v.clientHeight;if(!CW)return;$("cv").width=CW*r;$("cv").height=CH*r;cvx.setTransform(r,0,0,r,0,0)}
var F_,CX_,CY_,treeImg=new Image(),rockImg=new Image(),tok=false,rok=false;
treeImg.onload=function(){tok=true};treeImg.src="assets/tree.png";rockImg.onload=function(){rok=true};rockImg.src="assets/rock.png";
function proj(X,Y,Z){var k=F_/Z;return[CX_+X*k,CY_-Y*k]}
function quad(p,c){cvx.fillStyle=c;cvx.beginPath();cvx.moveTo(p[0][0],p[0][1]);for(var i=1;i<p.length;i++)cvx.lineTo(p[i][0],p[i][1]);cvx.closePath();cvx.fill()}
var LANE=.62,ZB=3.8,HC=1.75,SLOPE=.09,RH=1.55;
function obstacle(n,Zc,Yw,t){var o=obs[n];if(o<0)return;var X=(o?LANE:-LANE)-cam.x,P=proj(X,Yw,Zc),k=F_/Zc,fade=Math.max(.3,1-Math.max(0,Zc-10)/8),tree=(n%3)!==0,sw=Math.sin(performance.now()/700+n)*k*.03;
  cvx.globalAlpha=fade;cvx.fillStyle="#00000030";cvx.beginPath();cvx.ellipse(P[0],P[1],k*.42,k*.12,0,0,6.3);cvx.fill();
  if(tree&&tok){var hw=k*1.5*treeImg.naturalWidth/treeImg.naturalHeight;cvx.drawImage(treeImg,P[0]-hw/2+sw,P[1]-k*1.5,hw,k*1.5)}
  else if(!tree&&rok){var rw=k*.9*rockImg.naturalWidth/rockImg.naturalHeight;cvx.drawImage(rockImg,P[0]-rw/2,P[1]-k*.9,rw,k*.9)}
  else if(tree){cvx.fillStyle="#6b4a2f";cvx.fillRect(P[0]-k*.07,P[1]-k*.7,k*.14,k*.7);cvx.fillStyle=["#3f7a3f","#4a8a45","#35703a","#528f4a"][t];cvx.beginPath();cvx.arc(P[0]+sw,P[1]-k*1.05,k*.42,0,6.3);cvx.arc(P[0]+k*.2+sw,P[1]-k*.85,k*.3,0,6.3);cvx.arc(P[0]-k*.2+sw,P[1]-k*.85,k*.3,0,6.3);cvx.fill()}
  else{cvx.fillStyle="#8a8478";cvx.beginPath();cvx.ellipse(P[0],P[1]-k*.2,k*.38,k*.26,0,0,6.3);cvx.fill();cvx.fillStyle="#ffffff30";cvx.beginPath();cvx.ellipse(P[0]-k*.1,P[1]-k*.3,k*.16,k*.08,0,0,6.3);cvx.fill()}
  cvx.globalAlpha=1}
function draw(now){requestAnimationFrame(draw);if(!$("sp").classList.contains("on"))return;if(!CW||$("cv").width!==Math.round(CW*(window.devicePixelRatio||1)))size();if(!CW)return;
  var dt=Math.min(.05,(now-(draw.l||now))/1000);draw.l=now;
  var ty=step,vy=ty-cam.y;cam.y+=vy*Math.min(1,dt*9);moveV=Math.abs(vy);walkT+=dt*(4+moveV*10);
  var tx=(pl?LANE:-LANE);cam.x+=(tx*.55-cam.x)*Math.min(1,dt*6);lean+=((tx-cam.x)*.6-lean)*Math.min(1,dt*10);glow*=.9;hop*=Math.pow(.02,dt);flipA*=Math.pow(.05,dt);shake*=Math.pow(.01,dt);
  cvx.clearRect(0,0,CW,CH);F_=CW*0.8;CX_=CW/2;CY_=CH*0.4;var t=TIERS.indexOf(tier());
  var road=[["#b79c78","#a98f6c"],["#b8a17c","#ab946f"],["#c0a07a","#b2946e"],["#cdb28a","#bfa57c"]][t],verge=["#4f7a45","#5d8650","#7a8a55","#8a8a5a"][t];
  var hor=CY_+ -0; // horizon line
  for(var n=Math.min(399,Math.ceil(cam.y)+18);n>=Math.max(0,Math.floor(cam.y)-1);n--){var r=n-cam.y,Zc=r+ZB;if(Zc<=.5)continue;var z0=Math.max(.45,Zc-.5),z1=Zc+.5,Yw=r*SLOPE-HC,Y1=(r+.5)*SLOPE-HC,Y0=(r-.5)*SLOPE-HC;
    var fade=Math.max(.35,1-Math.max(0,Zc-10)/9);cvx.globalAlpha=fade;
    cvx.globalAlpha=fade*.5;quad([proj(-4,Y0,z0),proj(4,Y0,z0),proj(4,Y1,z1),proj(-4,Y1,z1)].map(function(p,i){return [p[0]+(-cam.x)*0,p[1]]}),verge);cvx.globalAlpha=fade;
    var wob=-cam.x;quad([proj(-1.5+wob,Y0,z0),proj(1.5+wob,Y0,z0),proj(1.5+wob,Y1,z1),proj(-1.5+wob,Y1,z1)],n%2?road[0]:road[1]);
    // stone step lip every row for a temple-path feel
    cvx.strokeStyle="#fff3c8aa";cvx.lineWidth=Math.max(1,F_/Zc*.025);var l1=proj(-1.5+wob,Y0,z0),l2=proj(1.5+wob,Y0,z0);cvx.beginPath();cvx.moveTo(l1[0],l1[1]);cvx.lineTo(l2[0],l2[1]);cvx.stroke();
    // lane centre dashes
    if(n%2===0){cvx.fillStyle="#ffffff22";var d1=proj(-.03+wob,Yw,Zc-.2),d2=proj(.03+wob,Yw,Zc+.2);cvx.fillRect(d1[0],d1[1],d2[0]-d1[0],d2[1]-d1[1])}
    // roadside lanterns
    if(n%6===0){[-1,1].forEach(function(sd){var L=proj(sd*1.95+wob,Yw,Zc),rr=F_/Zc*.12;cvx.fillStyle="#6b4a2f";cvx.fillRect(L[0]-rr*.2,L[1]-rr*4,rr*.4,rr*4);cvx.fillStyle="#f4c430";cvx.beginPath();cvx.arc(L[0],L[1]-rr*4.4,rr*1.1,0,6.3);cvx.fill()})}
    cvx.globalAlpha=1;
    if(n>step&&n<=step+14)obstacle(n,Zc,Yw,t)}
  // NACHA walking away from the camera
  var r0=step-cam.y,Z0=r0+ZB,Y0p=r0*SLOPE-HC,X0=lean+(((pl?LANE:-LANE)-cam.x)-lean)*0,P=proj((pl?LANE:-LANE)-cam.x-lean*0,Y0p,Z0),hh=RH*F_/Z0,ww=nok?hh*nimg.naturalWidth/nimg.naturalHeight:hh*.8;
  var bob=Math.abs(Math.sin(walkT))*hh*.035+hop*hh*.2,tilt=Math.sin(walkT)*.035+lean*.08,sq=1+Math.sin(walkT*2)*.012*(moveV>.05?1:0);
  cvx.fillStyle="#00000035";cvx.beginPath();cvx.ellipse(P[0],P[1],ww*.28,hh*.05,0,0,6.3);cvx.fill();
  cvx.save();cvx.translate(P[0]+(shake?Math.sin(now/20)*shake*6:0),P[1]-bob);cvx.rotate(tilt+flipA*6.28);cvx.scale(1/sq,sq);
  if(nok)cvx.drawImage(nimg,-ww/2,-hh,ww,hh);else{cvx.fillStyle="#3a2f47cc";cvx.strokeStyle="#9d90ad";cvx.setLineDash([5,4]);cvx.lineWidth=2;cvx.fillRect(-ww/2,-hh,ww,hh);cvx.strokeRect(-ww/2,-hh,ww,hh);cvx.setLineDash([]);cvx.fillStyle="#d9cfe6";cvx.font="11px Lilita One,sans-serif";cvx.textAlign="center";cvx.fillText("NACHA",0,-hh/2)}
  cvx.restore();
  if(shake>.15){cvx.fillStyle="rgba(192,57,43,"+Math.min(.35,shake*.3)+")";cvx.fillRect(0,0,CW,CH)}
  if(gok&&glow>.05){cvx.globalAlpha=Math.min(.8,glow);var gw=hh*1.3,gh=gw*gimg.naturalHeight/gimg.naturalWidth;cvx.drawImage(gimg,P[0]-gw/2,P[1]-gh*.8-bob,gw,gh);cvx.globalAlpha=1}}
function go(side){if(!$("sp").classList.contains("on"))return;
  var o=obs[step+1];
  if(o===side){ // obstacle in that lane
    if(gauge>=9){gauge=0;ready=false;pl=side;step++;hop=1;glow=1;flipA=1;say("NACHA Flip! Hop over the obstacle.");paint();if(step>=108)summit();return}
    gauge=0;shake=1;try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}step=Math.max(0,step-FALL);say("Bumped into it! Back "+FALL+" steps. Fill the gauge to hop over.");paint();return}
  pl=side;step++;hop=.4;glow=1;gauge=Math.min(9,gauge+1);
  if(step-lastSight>=12){lastSight=step;newSight()}
  if(gauge===9&&!ready){ready=true;say("Flip is ready! You can hop over the next obstacle.")}
  else if(step%10===0)say("One more worry gone. ("+(108-step)+" left)");
  paint();if(step>=108)summit()}
$("bl").onclick=function(){go(0)};$("br").onclick=function(){go(1)};
document.addEventListener("pointerdown",function(e){if(e.pointerType==="mouse"||e.target.closest("button,.sight,a"))return;
  if($("sp").classList.contains("on"))go(e.clientX<innerWidth/2?0:1);});
document.addEventListener("keydown",function(e){var k=e.key.toLowerCase(),L=k==="a"||k==="arrowleft",R=k==="e"||k==="arrowright";if(!L&&!R||e.repeat)return;e.preventDefault();
  if($("sp").classList.contains("on"))go(R?1:0);});
requestAnimationFrame(draw);addEventListener("resize",size);
function summit(){show("se");var tr=NA.train(10);$("el").textContent="108 worries gone. "+tr.line;
  $("ef").innerHTML=NA.followRow()}
var pw=0,chg=null,flew=false,LV=[[30,"Treetops","linear-gradient(#6aa0b8,#3a5a40)"],[60,"Clouds","linear-gradient(#bcd8f0,#6aa0b8)"],[90,"The Moon","linear-gradient(#1b1f4a,#6a5a9a)"],[101,"The Stars — Heaven!","linear-gradient(#05051a,#2b1a5a)"]],lres="";
function lvl(p){for(var i=0;i<LV.length;i++)if(p<LV[i][0])return LV[i]}
function lreset(){pw=0;flew=false;$("lb").style.width="0";$("lp").style.background="linear-gradient(#f4c43055,#2b2433)";$("car").style.transition="none";$("car").style.bottom="6%";$("lr").style.display="none";$("lgo").style.display="";$("lsay").textContent="Hold to charge. Let go to jump!";$("lh").innerHTML="&nbsp;"}
function launch(){if(flew||pw<=0)return;flew=true;clearInterval(chg);var L=lvl(pw);$("lgo").style.display="none";
  $("car").style.transition="bottom 1.6s ease-in";$("car").style.bottom=(6+pw*0.8)+"%";$("lp").style.background=L[2];
  setTimeout(function(){lres=L[1];$("lh").textContent=L[1];$("lsay").textContent=pw>=90?"NACHA touches heaven. Starlight!":"Nice jump! Try for more power.";$("lr").style.display="flex";$("lf").innerHTML=NA.followRow()},1700)}
$("tol").onclick=function(){show("sl");lreset()};
$("lgo").addEventListener("pointerdown",function(e){e.preventDefault();if(flew)return;clearInterval(chg);chg=setInterval(function(){pw=Math.min(100,pw+2.2);$("lb").style.width=pw+"%";if(pw>=100)launch()},30)});
["pointerup","pointercancel"].forEach(function(ev){$("lgo").addEventListener(ev,launch)});
$("la").onclick=lreset;
$("ls").onclick=function(){var t="NACHA jumped to: "+lres+"! "+NA.HANDLE+" #NACHA",u=location.href.split("?")[0];if(navigator.share)navigator.share({text:t,url:u}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(t+" "+u).then(function(){NA.toast("Copied")})};
function start(){step=0;stam=100;lastSight=0;gauge=0;ready=false;flipT=null;build();show("sp");size();say("Pick a lane. Trees and rocks block the way.");paint()}
$("go").onclick=start;$("again").onclick=start;
$("sh").onclick=function(){var t="I climbed all 108 steps with NACHA! "+NA.HANDLE+" #NACHA",u=location.href.split("?")[0];if(navigator.share)navigator.share({text:t,url:u}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(t+" "+u).then(function(){NA.toast("Copied")})};
})();
</script></body></html>
