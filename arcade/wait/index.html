<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wait with NACHA · NACHA</title>
<meta name="description" content="NACHA is waiting and pouting. Give him the right gift to cheer him up.">
<meta property="og:title" content="Wait with NACHA">
<meta property="og:description" content="NACHA is waiting and pouting. Cheer him up!">
<meta name="theme-color" content="#1d1020">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common.css">
<style>
  #stage{width:min(100vw,480px);height:100%;max-height:100dvh;overflow:hidden;background:#1d1020}
  #bg{position:absolute;inset:0;width:100%;height:100%}
  .scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 18px);text-align:center;text-shadow:0 2px 0 #0005}
  .scr.on{display:flex}
  .q{font:40px/1.05 "Lilita One",sans-serif;margin:0 0 6px;max-width:340px}
  .hero{height:200px}
  .hero svg{height:100%;width:auto}
  #play{justify-content:flex-start;padding-top:calc(env(safe-area-inset-top) + 14px)}
  .top{width:100%;display:flex;justify-content:space-between;font:18px "Lilita One",sans-serif}
  .mood{width:100%;height:12px;border-radius:7px;background:#00000040;overflow:hidden;margin-top:6px}
  .mood i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f4c430,#ff7a4a);transition:width .25s}
  .tbar{width:100%;height:6px;border-radius:3px;background:#00000030;overflow:hidden}
  .tbar i{display:block;height:100%;width:100%;background:#fff;transform-origin:left}
  .scene{position:relative;flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
  .scene #me{height:72%;width:auto;margin-bottom:6px;filter:drop-shadow(0 10px 0 #0003);transition:transform .2s}
  .scene #me.pop{transform:scale(1.05)}
  .bubble{position:absolute;top:2%;left:50%;transform:translateX(-50%);background:#fff;color:#241518;border-radius:24px;padding:6px 20px;font-size:54px;line-height:1.1;box-shadow:0 6px 0 #0003;text-shadow:none}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
  .fx{position:absolute;left:50%;top:38%;font:36px "Lilita One",sans-serif;color:var(--gold);animation:fx .8s ease-out forwards;pointer-events:none}
  @keyframes fx{to{transform:translateY(-60px);opacity:0}}
  .gifts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:360px;padding-bottom:4px}
  .gift{appearance:none;border:2px solid #ffffff33;background:#150a1acc;border-radius:20px;font-size:44px;padding:12px 0;cursor:pointer;transition:transform .08s}
  .gift:active{transform:scale(.92)}
  .gift.ok{background:#2f7d4f}.gift.no{background:#8f2a22}
  .score{font:92px/1 "Lilita One",sans-serif;color:var(--gold);text-shadow:0 5px 0 #d35400}
  .gname{font:30px/1.05 "Lilita One",sans-serif}
  .match{font-size:14px;color:#f6dfbf}
</style>
</head>
<body>
<div id="app"><div id="stage">
  <canvas id="bg"></canvas>

  <section class="scr on" id="s0">
    <div class="brand">NACHA</div>
    <h1 class="q">NACHA is waiting…</h1>
    <div class="hero" id="introMe"></div>
    <div class="gname">Cheer him up!</div>
    <button class="btn main" id="go">Start</button>
    <div class="match">Give him what he asks for</div>
  </section>

  <section class="scr" id="play">
    <div class="top"><span id="cnt">1 / 10</span><span id="mt">😠</span></div>
    <div class="mood"><i id="mood"></i></div>
    <div class="tbar"><i id="tb"></i></div>
    <div class="scene"><div class="bubble" id="ask">🪷</div><div id="me"></div></div>
    <div class="gifts" id="gifts"></div>
  </section>

  <section class="scr" id="sr">
    <div class="brand">NACHA</div>
    <div class="hero" id="resMe"></div>
    <div class="score" id="rs">0</div>
    <div class="match" style="margin-top:-6px;letter-spacing:.2em">OF 10</div>
    <div class="gname" id="rt"></div>
    <div id="rGods"></div>
    <div class="row"><button class="btn main" id="share">Share</button><button class="btn" id="again">Again</button></div>
    <div id="rFollow"></div>
    <a class="btn" href="../" style="padding:9px 16px;font-size:15px">More games</a>
  </section>
</div></div>

<script src="../common.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var GIFTS = ["🪷", "🍵", "🪀", "🧺"];
  var N = 10, n, ok, askIdx, t0, limit, tick, busy, over;
  var bg = $("bg"), bx = bg.getContext("2d"), last = 0, leaves, t00 = performance.now();

  function me(mood, pose) { return NA.nacha({ mood: mood, pose: pose }).replace("<svg ", '<svg style="height:100%;width:auto" '); }
  function fit() { var w = $("stage").clientWidth, h = $("stage").clientHeight, d = Math.min(2, window.devicePixelRatio || 1); bg.width = w * d; bg.height = h * d; bx.setTransform(d, 0, 0, d, 0, 0); leaves = NA.leaves(12, w, h); }
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    var w = bg.clientWidth, h = bg.clientHeight;
    NA.drawBG(bx, w, h, (now - t00) * 0.012, (now - t00) / 1000);
    NA.drawLeaves(bx, leaves, w, h, dt); requestAnimationFrame(frame);
  }
  window.addEventListener("resize", fit);
  function show(id) { ["s0", "play", "sr"].forEach(function (s) { $(s).classList.toggle("on", s === id); }); }

  function moodOf(r) { return r < 0.3 ? ["pout", "😠"] : r < 0.6 ? ["smirk", "😏"] : r < 0.9 ? ["smile", "😊"] : ["smile", "🥰"]; }
  function paint() {
    var m = moodOf(ok / N);
    $("me").innerHTML = me(m[0], ok / N >= 0.9 ? "cheer" : "phone");
    $("mt").textContent = m[1]; $("mood").style.width = (ok / N * 100) + "%";
  }
  function next() {
    if (n >= N) return end();
    n++; $("cnt").textContent = n + " / " + N;
    askIdx = Math.floor(Math.random() * 4); $("ask").textContent = GIFTS[askIdx];
    limit = Math.max(1.1, 2.6 - n * 0.14); t0 = performance.now(); busy = false;
    document.querySelectorAll(".gift").forEach(function (g) { g.className = "gift"; });
    cancelAnimationFrame(tick); tick = requestAnimationFrame(loop);
  }
  function loop() {
    var left = limit - (performance.now() - t0) / 1000;
    $("tb").style.transform = "scaleX(" + Math.max(0, left / limit) + ")";
    if (left <= 0 && !busy) { busy = true; fx("…"); setTimeout(next, 350); return; }
    if (!over) tick = requestAnimationFrame(loop);
  }
  function fx(txt) { var e = document.createElement("div"); e.className = "fx"; e.textContent = txt; $("play").appendChild(e); setTimeout(function () { e.remove(); }, 800); }
  function pick(i) {
    if (busy || over) return; busy = true;
    var g = document.querySelectorAll(".gift");
    if (i === askIdx) { ok++; g[i].classList.add("ok"); fx("+1"); var m = $("me"); m.classList.add("pop"); setTimeout(function () { m.classList.remove("pop"); }, 160); }
    else { g[i].classList.add("no"); g[askIdx].classList.add("ok"); fx("✗"); }
    paint(); setTimeout(next, 420);
  }
  function end() {
    over = true; cancelAnimationFrame(tick);
    var r = ok / N, m = moodOf(r);
    $("resMe").innerHTML = me(m[0], r >= 0.9 ? "cheer" : r >= 0.6 ? "wave" : "phone");
    $("rs").textContent = ok;
    $("rt").textContent = r >= 0.9 ? "NACHA is beaming! 🥰" : r >= 0.6 ? "NACHA smiled 😊" : "Still waiting… try again!";
    var isNew = NA.unlock("nacha");
    $("rGods").innerHTML = NA.godsStrip(""); $("rFollow").innerHTML = NA.followRow();
    show("sr");
  }
  function start() {
    n = 0; ok = 0; over = false; paint(); show("play"); next();
  }
  $("gifts").innerHTML = GIFTS.map(function (g, i) { return '<button class="gift" data-i="' + i + '">' + g + "</button>"; }).join("");
  $("gifts").addEventListener("pointerdown", function (e) { var b = e.target.closest(".gift"); if (b) { e.preventDefault(); pick(+b.dataset.i); } });
  $("go").addEventListener("click", start); $("again").addEventListener("click", start);
  $("share").addEventListener("click", function () {
    var r = ok / N, m = moodOf(r);
    NA.fontReady().then(function () { return NA.card({ svg: NA.nacha({ mood: m[0], pose: r >= 0.9 ? "cheer" : r >= 0.6 ? "wave" : "phone" }), big: ok + " / " + N, label: "I CHEERED NACHA UP", line: r >= 0.9 ? "He's beaming! Can you beat me?" : "Can you cheer him up faster?" }); })
      .then(function (c) { return NA.share(c, "I cheered NACHA up: " + ok + "/" + N + "! " + NA.HANDLE + " #NACHA", "nacha-wait.png"); });
  });
  $("introMe").innerHTML = me("pout", "phone");
  NA.fontReady().then(function () { fit(); requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
