<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lotus Bloom · NACHA</title>
<meta name="description" content="Hold to grow the lotus. Let go inside the golden ring."><meta name="theme-color" content="#1d1020">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common.css">
<style>#stage{width:min(100vw,480px);height:100%;max-height:100dvh;overflow:hidden}#c{width:100%;height:100%}.hint{font-size:15px;color:#f6dfbf;max-width:300px}.em{font-size:64px}</style>
</head><body><div id="app"><div id="stage">
<canvas id="c"></canvas>
<div class="hud"><span class="big" id="sc"></span><span class="sm r" id="sub"></span></div>
<div class="ov on" id="o0"><div class="brand">NACHA</div><div class="title">Lotus Bloom</div><div class="em">🪷</div><div class="hint">Hold to grow the lotus. Let go inside the golden ring.</div><button class="btn main" id="go">Play</button><a class="btn" href="../" style="padding:9px 16px;font-size:15px">More games</a></div>
<div class="ov" id="o1"><div class="brand">NACHA</div><div class="label">BLOOM SCORE</div><div class="score" id="rs">0</div><div class="best" id="rb"></div><div class="title" id="rt" style="font-size:26px"></div><div id="rF"></div>
<div class="row"><button class="btn main" id="sh">Share</button><button class="btn" id="again">Again</button></div><a class="btn" href="../" style="padding:9px 16px;font-size:15px">More games</a></div>
</div></div>
<script src="../common.js"></script>
<script>
(function(){"use strict";
var $=function(i){return document.getElementById(i)},cv=$("c"),x=cv.getContext("2d"),W,H,t0=performance.now(),last=0,leaves,run=false,KEY="na-lab-lotus";
function fit(){W=$("stage").clientWidth;H=$("stage").clientHeight;var d=Math.min(2,devicePixelRatio||1);cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0);leaves=NA.leaves(8,W,H)}
addEventListener("resize",fit);
function emo(c,px,py,s){x.font=s+"px serif";x.textAlign="center";x.textBaseline="middle";x.fillText(c,px,py)}
function best(){try{return+localStorage.getItem(KEY)||0}catch(e){return 0}}
var G;

G={r:0,hold:0,round:0,sc:0,tg:0,wait:0,msg:"",
init:function(){this.round=0;this.sc=0;this.next();$("sub").textContent=""},
next:function(){this.round++;this.r=0;this.hold=0;this.tg=.35+Math.random()*.5;this.wait=0;},
down:function(){if(this.wait>0)return;this.hold=1},
up:function(){var g=this;if(!g.hold)return;g.hold=0;var d=Math.abs(g.r-g.tg);var s=Math.max(0,Math.round(100*(1-d/.25)));g.sc+=s;g.msg=s>=90?"Perfect 🪷":s>=50?"Nice":"Too "+(g.r<g.tg?"small":"big");g.wait=.9},
step:function(dt){var g=this;if(g.hold){g.r+=dt*(.45+g.round*.03);if(g.r>1.05)g.up()}
 if(g.wait>0){g.wait-=dt;if(g.wait<=0){if(g.round>=8)return finish(g.sc,g.sc>=600?"A thousand petals":"The lotus rests"),0;g.next()}}
 $("sc").textContent=g.sc;$("sub").textContent=g.round+" / 8"},
draw:function(){var cx=W/2,cy=H*.5,R=Math.min(W*.42,200);x.strokeStyle="#f4c430";x.lineWidth=10;x.globalAlpha=.8;x.beginPath();x.arc(cx,cy,R*(this.tg-.06),0,6.283);x.stroke();x.beginPath();x.arc(cx,cy,R*(this.tg+.06),0,6.283);x.stroke();x.globalAlpha=1;
 emo("🪷",cx,cy,Math.max(24,R*2*this.r));if(this.wait>0){x.fillStyle="#fff";x.font="32px 'Lilita One'";x.textAlign="center";x.fillText(this.msg,cx,cy-R-30)}}};

function start(){$("o0").classList.remove("on");$("o1").classList.remove("on");G.init();run=true}
function finish(score,msg){run=false;var b=best(),nb=score>b;if(nb)try{localStorage.setItem(KEY,score)}catch(e){}
 $("rs").textContent=score;$("rb").textContent=nb?"New best!":"Best "+b;$("rt").textContent=msg;$("rF").innerHTML=NA.followRow();$("o1").classList.add("on");G.last=score}
function frame(now){var dt=Math.min(.05,(now-last)/1000);last=now;
 NA.drawBG(x,W,H,(now-t0)*.012,(now-t0)/1000,"sun");NA.drawLeaves(x,leaves,W,H,dt);
 if(run)G.step(dt);G.draw();requestAnimationFrame(frame)}
$("go").onclick=start;$("again").onclick=start;
$("sh").onclick=function(){var t="My lotus bloom scored "+G.last+"! "+NA.HANDLE+" #NACHA",u=location.href.split("?")[0];if(navigator.share)navigator.share({text:t,url:u}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(t+" "+u).then(function(){NA.toast("Copied")})};
function pt(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener("pointerdown",function(e){e.preventDefault();if(run&&G.down)G.down(pt(e))});
cv.addEventListener("pointerup",function(e){if(run&&G.up)G.up(pt(e))});
cv.addEventListener("pointercancel",function(){if(run&&G.up)G.up({x:0,y:0})});
G.init&&0;NA.fontReady().then(function(){fit();G.init();requestAnimationFrame(frame)});
})();
</script></body></html>
