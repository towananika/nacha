<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lantern River · NACHA</title>
<meta name="description" content="Slide your lantern. Dodge the rocks. Collect the lights."><meta name="theme-color" content="#1d1020">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common.css">
<style>#stage{width:min(100vw,480px);height:100%;max-height:100dvh;overflow:hidden}#c{width:100%;height:100%}.hint{font-size:15px;color:#f6dfbf;max-width:300px}.em{font-size:64px}</style>
</head><body><div id="app"><div id="stage">
<canvas id="c"></canvas>
<div class="hud"><span class="big" id="sc"></span><span class="sm r" id="sub"></span></div>
<div class="ov on" id="o0"><div class="brand">NACHA</div><div class="title">Lantern River</div><div class="em">🏮</div><div class="hint">Slide your lantern. Dodge the rocks. Collect the lights.</div><button class="btn main" id="go">Play</button><a class="btn" href="../" style="padding:9px 16px;font-size:15px">More games</a></div>
<div class="ov" id="o1"><div class="brand">NACHA</div><div class="label">LIGHTS GATHERED</div><div class="score" id="rs">0</div><div class="best" id="rb"></div><div class="title" id="rt" style="font-size:26px"></div><div id="rF"></div>
<div class="row"><button class="btn main" id="sh">Share</button><button class="btn" id="again">Again</button></div><a class="btn" href="../" style="padding:9px 16px;font-size:15px">More games</a></div>
</div></div>
<script src="../common.js"></script>
<script>
(function(){"use strict";
var $=function(i){return document.getElementById(i)},cv=$("c"),x=cv.getContext("2d"),W,H,t0=performance.now(),last=0,leaves,run=false,KEY="na-lab-river";
function fit(){W=$("stage").clientWidth;H=$("stage").clientHeight;var d=Math.min(2,devicePixelRatio||1);cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0);leaves=NA.leaves(8,W,H)}
addEventListener("resize",fit);
function emo(c,px,py,s){x.font=s+"px serif";x.textAlign="center";x.textBaseline="middle";x.fillText(c,px,py)}
function best(){try{return+localStorage.getItem(KEY)||0}catch(e){return 0}}
var G;

G={lx:0,lives:3,sc:0,obs:[],tm:0,sp:0,drag:null,
init:function(){this.lx=W/2;this.lives=3;this.sc=0;this.obs=[];this.tm=0;this.sp=120;this.sp0=0;this.hit=0;$("sub").textContent="❤️❤️❤️"},
down:function(p){this.drag=p.x},up:function(){this.drag=null},
step:function(dt){var g=this;g.tm+=dt;g.sp=120+g.tm*6;
 if(!G._m){G._m=1;cv.addEventListener("pointermove",function(e){if(G.drag!=null){G.drag=pt(e).x}})}
 if(g.drag!=null)g.lx+=(g.drag-g.lx)*Math.min(1,dt*10);g.lx=Math.max(30,Math.min(W-30,g.lx));
 g.sp0-=dt;if(g.sp0<=0){g.sp0=Math.max(.35,.9-g.tm*.01);var good=Math.random()<.4;g.obs.push({x:30+Math.random()*(W-60),y:-30,good:good})}
 g.hit-=dt;
 for(var i=g.obs.length-1;i>=0;i--){var o=g.obs[i];o.y+=g.sp*dt;
  if(Math.abs(o.x-g.lx)<34&&Math.abs(o.y-(H-110))<34){g.obs.splice(i,1);if(o.good){g.sc++}else{g.lives--;g.hit=.4;$("sub").textContent=g.lives>0?"❤️".repeat(g.lives):""}continue}
  if(o.y>H+30)g.obs.splice(i,1)}
 $("sc").textContent=g.sc;
 if(g.lives<=0)finish(g.sc,g.sc>=25?"The river glows!":"Keep drifting…")},
draw:function(){this.obs.forEach(function(o){emo(o.good?"🪔":"🪨",o.x,o.y,o.good?38:44)});
 x.globalAlpha=this.hit>0&&Math.floor(this.hit*20)%2?.3:1;emo("🏮",this.lx,H-110,58);x.globalAlpha=1}};

function start(){$("o0").classList.remove("on");$("o1").classList.remove("on");G.init();run=true}
function finish(score,msg){run=false;var b=best(),nb=score>b;if(nb)try{localStorage.setItem(KEY,score)}catch(e){}
 $("rs").textContent=score;$("rb").textContent=nb?"New best!":"Best "+b;$("rt").textContent=msg;$("rF").innerHTML=NA.followRow();$("o1").classList.add("on");G.last=score}
function frame(now){var dt=Math.min(.05,(now-last)/1000);last=now;
 NA.drawBG(x,W,H,(now-t0)*.012,(now-t0)/1000,"night");NA.drawLeaves(x,leaves,W,H,dt);
 if(run)G.step(dt);G.draw();requestAnimationFrame(frame)}
$("go").onclick=start;$("again").onclick=start;
$("sh").onclick=function(){var t="My lantern gathered "+G.last+"! "+NA.HANDLE+" #NACHA",u=location.href.split("?")[0];if(navigator.share)navigator.share({text:t,url:u}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(t+" "+u).then(function(){NA.toast("Copied")})};
function pt(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener("pointerdown",function(e){e.preventDefault();if(run&&G.down)G.down(pt(e))});
cv.addEventListener("pointerup",function(e){if(run&&G.up)G.up(pt(e))});
cv.addEventListener("pointercancel",function(){if(run&&G.up)G.up({x:0,y:0})});
G.init&&0;NA.fontReady().then(function(){fit();G.init();requestAnimationFrame(frame)});
})();
</script></body></html>
