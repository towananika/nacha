<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Keep the Flame · NACHA</title>
<meta name="description" content="Wind pushes the flame. Tap left or right to hold it steady."><meta name="theme-color" content="#1d1020">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common.css">
<style>#stage{width:min(100vw,480px);height:100%;max-height:100dvh;overflow:hidden}#c{width:100%;height:100%}.hint{font-size:15px;color:#f6dfbf;max-width:300px}.em{font-size:64px}</style>
</head><body><div id="app"><div id="stage">
<canvas id="c"></canvas>
<div class="hud"><span class="big" id="sc"></span><span class="sm r" id="sub"></span></div>
<div class="ov on" id="o0"><div class="brand">NACHA</div><div class="title">Keep the Flame</div><div class="em">🪔</div><div class="hint">Wind pushes the flame. Tap left or right to hold it steady.</div><button class="btn main" id="go">Play</button><a class="btn" href="../" style="padding:9px 16px;font-size:15px">More games</a></div>
<div class="ov" id="o1"><div class="brand">NACHA</div><div class="label">SECONDS STEADY</div><div class="score" id="rs">0</div><div class="best" id="rb"></div><div class="title" id="rt" style="font-size:26px"></div><div id="rF"></div>
<div class="row"><button class="btn main" id="sh">Share</button><button class="btn" id="again">Again</button></div><a class="btn" href="../" style="padding:9px 16px;font-size:15px">More games</a></div>
</div></div>
<script src="../common.js"></script>
<script>
(function(){"use strict";
var $=function(i){return document.getElementById(i)},cv=$("c"),x=cv.getContext("2d"),W,H,t0=performance.now(),last=0,leaves,run=false,KEY="na-lab-incense";
function fit(){W=$("stage").clientWidth;H=$("stage").clientHeight;var d=Math.min(2,devicePixelRatio||1);cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0);leaves=NA.leaves(8,W,H)}
addEventListener("resize",fit);
function emo(c,px,py,s){x.font=s+"px serif";x.textAlign="center";x.textBaseline="middle";x.fillText(c,px,py)}
function best(){try{return+localStorage.getItem(KEY)||0}catch(e){return 0}}
var G;

G={p:0,v:0,tm:0,w:0,wt:0,
init:function(){this.p=0;this.v=0;this.tm=0;this.w=0;this.wt=0;$("sub").textContent="Tap sides"},
down:function(pp){this.v+=(pp.x<W/2?-1:1)*160},
step:function(dt){var g=this;g.tm+=dt;g.wt-=dt;if(g.wt<=0){g.wt=.6+Math.random()*.8;g.w=(Math.random()-.5)*(140+g.tm*7)}
 g.v+=g.w*dt*3+g.p*dt*(1.2+g.tm*.04);g.v*=Math.pow(.5,dt);g.p+=g.v*dt;$("sc").textContent=Math.floor(g.tm);
 if(Math.abs(g.p)>W*.38){finish(Math.floor(g.tm),g.tm>=30?"Calm as stone 🪷":"The flame went out…")}},
draw:function(){var cx=W/2,by=H*.78,top=by-H*.42;x.strokeStyle="#7a4a2b";x.lineWidth=7;x.lineCap="round";x.beginPath();x.moveTo(cx,by);x.lineTo(cx,top+40);x.stroke();
 var fx=cx+this.p;x.fillStyle="#ffffff20";x.fillRect(W*.1,H*.12,W*.8,6);x.fillStyle="#f4c430";x.fillRect(W/2+this.p*(W*.4/(W*.38))-6,H*.12-4,12,14);
 x.fillStyle="#fff";x.fillRect(cx-W*.38+W*.1-W*.1,H*.12,0,0);emo("🔥",fx,top+10,60);
 x.fillStyle="#ffffff40";x.font="16px 'Lilita One'";x.textAlign="center";x.fillText("◀ tap      tap ▶",W/2,H-30)}};

function start(){$("o0").classList.remove("on");$("o1").classList.remove("on");G.init();run=true}
function finish(score,msg){run=false;var b=best(),nb=score>b;if(nb)try{localStorage.setItem(KEY,score)}catch(e){}
 $("rs").textContent=score;$("rb").textContent=nb?"New best!":"Best "+b;$("rt").textContent=msg;$("rF").innerHTML=NA.followRow();$("o1").classList.add("on");G.last=score}
function frame(now){var dt=Math.min(.05,(now-last)/1000);last=now;
 NA.drawBG(x,W,H,(now-t0)*.012,(now-t0)/1000,"cream");NA.drawLeaves(x,leaves,W,H,dt);
 if(run)G.step(dt);G.draw();requestAnimationFrame(frame)}
$("go").onclick=start;$("again").onclick=start;
$("sh").onclick=function(){var t="I kept the flame steady for "+G.last+"! "+NA.HANDLE+" #NACHA",u=location.href.split("?")[0];if(navigator.share)navigator.share({text:t,url:u}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(t+" "+u).then(function(){NA.toast("Copied")})};
function pt(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener("pointerdown",function(e){e.preventDefault();if(run&&G.down)G.down(pt(e))});
cv.addEventListener("pointerup",function(e){if(run&&G.up)G.up(pt(e))});
cv.addEventListener("pointercancel",function(){if(run&&G.up)G.up({x:0,y:0})});
G.init&&0;NA.fontReady().then(function(){fit();G.init();requestAnimationFrame(frame)});
})();
</script></body></html>
