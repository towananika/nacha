<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Come Catch Me! · NACHA</title>
<meta name="description" content="Fdo King is riding! Tap to jump rocks, grab the fire, and outrun the haze."><meta name="theme-color" content="#1d1020">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common.css">
<style>#stage{width:min(100vw,480px);height:100%;max-height:100dvh;overflow:hidden}#c{width:100%;height:100%}.hint{font-size:15px;color:#f6dfbf;max-width:300px}.em{font-size:64px}</style>
</head><body><div id="app"><div id="stage">
<canvas id="c"></canvas>
<div class="hud"><span class="big" id="sc"></span><span class="sm r" id="sub"></span></div>
<div class="ov on" id="o0"><div class="brand">NACHA</div><div class="title">Come Catch Me!</div><div class="em">🏍️</div><div class="hint">Fdo King is riding! Tap to jump rocks, grab the fire, and outrun the haze.</div><button class="btn main" id="go">Play</button><a class="btn" href="../" style="padding:9px 16px;font-size:15px">More games</a></div>
<div class="ov" id="o1"><div class="brand">NACHA</div><div class="label">METERS</div><div class="score" id="rs">0</div><div class="best" id="rb"></div><div class="title" id="rt" style="font-size:26px"></div><div id="rF"></div>
<div class="row"><button class="btn main" id="sh">Share</button><button class="btn" id="again">Again</button></div><a class="btn" href="../" style="padding:9px 16px;font-size:15px">More games</a></div>
</div></div>
<script src="../common.js"></script>
<script>
(function(){"use strict";
var $=function(i){return document.getElementById(i)},cv=$("c"),x=cv.getContext("2d"),W,H,t0=performance.now(),last=0,leaves,run=false,KEY="na-lab-bike";
function fit(){W=$("stage").clientWidth;H=$("stage").clientHeight;var d=Math.min(2,devicePixelRatio||1);cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0);leaves=NA.leaves(8,W,H)}
addEventListener("resize",fit);
function emo(c,px,py,s){x.font=s+"px serif";x.textAlign="center";x.textBaseline="middle";x.fillText(c,px,py)}
function best(){try{return+localStorage.getItem(KEY)||0}catch(e){return 0}}
var G;

G={y:0,vy:0,air:false,ob:[],d:.5,m:0,sp:0,tm:0,fire:0,fl:0,hit:0,holding:false,
init:function(){this.y=0;this.vy=0;this.air=false;this.ob=[];this.d=.5;this.m=0;this.tm=0;this.sp=0;this.fire=0;this.fl=0;this.hit=0;$("sub").textContent="🔥 0"},
down:function(){if(!this.air){this.vy=-720;this.air=true;this.holding=true}},
up:function(){this.holding=false;if(this.vy<-300)this.vy=-300},
step:function(dt){var g=this;g.tm+=dt;g.sp=230+Math.min(260,g.tm*8);g.m+=g.sp*dt/40;
 if(g.air){g.vy+=(g.holding?1500:2300)*dt;g.y+=g.vy*dt;if(g.y>=0){g.y=0;g.vy=0;g.air=false}}
 g.fl-=dt;if(g.fl<=0){g.fl=.8+Math.random()*1.1;var r=Math.random();g.ob.push({x:W+40,t:r<.55?"🪨":r<.75?"🔥":"🔥",rock:r<.55,hi:r>=.75&&Math.random()<.5})}
 g.hit-=dt;
 for(var i=g.ob.length-1;i>=0;i--){var o=g.ob[i];o.x-=g.sp*dt;var bx=W*.3,gy=H*.72;var oy=o.rock?gy:gy-(o.hi?150:30);
  if(Math.abs(o.x-bx)<34&&Math.abs(oy-(gy+g.y))<44){g.ob.splice(i,1);if(o.rock){g.d-=.22;g.hit=.5}else{g.fire++;g.d=Math.min(1,g.d+.1);$("sub").textContent="🔥 "+g.fire}continue}
  if(o.x<-40)g.ob.splice(i,1)}
 g.d-=dt*(.012+g.tm*.0004);$("sc").textContent=Math.floor(g.m);
 if(g.d<=0)finish(Math.floor(g.m)+g.fire*20,g.m>=400?"Nobody catches him! 🔥":"The haze caught up…")},
draw:function(){var gy=H*.72;x.fillStyle="#0000003a";x.fillRect(0,gy+34,W,H-gy);x.fillStyle="#f4c43088";x.fillRect(0,gy+34,W,3);
 this.ob.forEach(function(o){emo(o.t,o.x,o.rock?gy:gy-(o.hi?150:30),o.rock?46:40)});
 x.globalAlpha=this.hit>0&&Math.floor(this.hit*20)%2?.4:1;emo("🏍️",W*.3,gy+this.y,70);x.globalAlpha=1;
 var cw=W*.55*(1-this.d);var gr=x.createLinearGradient(0,0,cw+60,0);gr.addColorStop(0,"#150a1af0");gr.addColorStop(1,"#3b1a4a00");x.fillStyle=gr;x.fillRect(0,0,cw+60,H);
 emo("👹",Math.max(-10,cw-10),gy-10,56);
 x.fillStyle="#ffffff30";x.font="15px 'Lilita One'";x.textAlign="center";x.fillText("tap = jump (hold = higher)",W/2,H-24)}};

function start(){$("o0").classList.remove("on");$("o1").classList.remove("on");G.init();run=true}
function finish(score,msg){run=false;var b=best(),nb=score>b;if(nb)try{localStorage.setItem(KEY,score)}catch(e){}
 $("rs").textContent=score;$("rb").textContent=nb?"New best!":"Best "+b;$("rt").textContent=msg;$("rF").innerHTML=NA.followRow();$("o1").classList.add("on");G.last=score}
function frame(now){var dt=Math.min(.05,(now-last)/1000);last=now;
 NA.drawBG(x,W,H,(now-t0)*.012,(now-t0)/1000,"sun");NA.drawLeaves(x,leaves,W,H,dt);
 if(run)G.step(dt);G.draw();requestAnimationFrame(frame)}
$("go").onclick=start;$("again").onclick=start;
$("sh").onclick=function(){var t="Fdo King rode "+G.last+"! "+NA.HANDLE+" #NACHA",u=location.href.split("?")[0];if(navigator.share)navigator.share({text:t,url:u}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(t+" "+u).then(function(){NA.toast("Copied")})};
function pt(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener("pointerdown",function(e){e.preventDefault();if(run&&G.down)G.down(pt(e))});
cv.addEventListener("pointerup",function(e){if(run&&G.up)G.up(pt(e))});
cv.addEventListener("pointercancel",function(){if(run&&G.up)G.up({x:0,y:0})});
G.init&&0;NA.fontReady().then(function(){fit();G.init();requestAnimationFrame(frame)});
})();
</script></body></html>
