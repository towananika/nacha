<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fire Spear · NACHA</title>
<meta name="description" content="Tap to throw NACHA's fire spear and burn the haze."><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common.css">
<style>
/* Uses existing art: ../steps/assets/view2.png (background), nacha-climb.png (NACHA). Haze + spear are simple shapes. */
body{overflow:hidden;background:#1d1020;touch-action:manipulation}
#stage{width:min(100vw,480px);height:100dvh;position:relative;overflow:hidden;margin:0 auto}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 14px);gap:10px}
.scr.on{display:flex}.ctr{align-items:center;justify-content:center;text-align:center}
.h1{font:36px/1.05 "Lilita One",sans-serif}.lore{font-size:15px;color:#f6dfbf;max-width:320px;line-height:1.35}
.top{display:flex;justify-content:space-between;font:18px "Lilita One"}
.view{position:relative;flex:1;border-radius:14px;overflow:hidden;background:#2b2433}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.bubble{background:#fff;color:#241518;border-radius:18px;padding:9px 14px;font-size:16px;text-align:center;box-shadow:0 4px 0 #0004;min-height:42px}
.stars{font-size:38px;letter-spacing:6px;color:var(--gold)}
</style></head><body><div id="app"><div id="stage">
<section class="scr ctr on" id="s0">
  <div class="brand">NACHA</div><div class="h1">Fire Spear</div>
  <div class="lore">Haze is drifting over the temple. Tap when it is right above NACHA to burn it away.</div>
  <button class="btn main" id="go">Start</button>
  <a class="btn" href="../" style="padding:9px 16px;font-size:15px">More games</a>
</section>
<section class="scr" id="sp">
  <div class="top"><span id="rd">Haze 1 / 5</span><span id="sc">0 pts</span></div>
  <div class="view" id="vw"><canvas id="cv"></canvas></div>
  <div class="bubble" id="say">Tap to throw!</div>
</section>
<section class="scr ctr" id="se">
  <div class="brand">NACHA</div><div class="h1" id="rt">Cleared!</div>
  <div class="stars" id="st"></div>
  <div class="lore" id="el"></div>
  <div class="bubble" id="wd" style="max-width:340px"></div>
  <div id="ef"></div>
  <div class="row"><button class="btn main" id="again">Again</button><button class="btn" id="sh">Share image</button></div>
  <a class="btn" href="../" style="padding:9px 16px;font-size:15px">More games</a>
</section>
</div></div>
<script src="../common.js"></script>
<script>
(function(){"use strict";
var $=function(i){return document.getElementById(i)},cv=$("cv"),cx=cv.getContext("2d"),W=0,H=0;
var bg=new Image(),nc=new Image(),bgok=false,ncok=false;bg.onload=function(){bgok=true};nc.onload=function(){ncok=true};bg.src="../steps/assets/view2.png";nc.src="../steps/assets/nacha-climb.png";
var WORDS=["Burn the worry, keep the warmth.","Brave is just one more throw.","Aim kindly. Fire gently.","Good aim comes from a calm heart.","Haze never wins against a smile."];
var round,score,tx,tv,tr,state,spear,burst,wob,msg,locked,tt,parts=[],shk=0,slow=1,flash=0,big=null,bulls=0;
function emit(x,y,n,spd,cols,life){for(var i=0;i<n;i++){var a=Math.random()*6.28,v=spd*(.3+Math.random());parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-spd*.2,l:life*(.6+Math.random()*.6),t:0,c:cols[Math.floor(Math.random()*cols.length)],r:2+Math.random()*4})}}
function show(id){["s0","sp","se"].forEach(function(s){$(s).classList.toggle("on",s===id)})}
function size(){var v=$("vw"),r=window.devicePixelRatio||1;W=v.clientWidth;H=v.clientHeight;if(!W)return;cv.width=W*r;cv.height=H*r;cx.setTransform(r,0,0,r,0,0)}
function newTarget(){state="aim";tr=Math.max(.1,.16-round*.01)*W;tv=(.32+round*.16)*W*(Math.random()<.5?-1:1);tx=W*(.2+Math.random()*.6);spear=null;burst=null;wob=0;$("rd").textContent="Haze "+(round+1)+" / 5";$("say").textContent=round?"Faster now. Tap to throw!":"Tap to throw!"}
function start(){round=0;score=0;locked=false;$("sc").textContent="0 pts";show("sp");size();newTarget()}
function throwSpear(){if(state!=="aim"||!$("sp").classList.contains("on"))return;state="fly";spear={y:H*.78,x:W/2,t:0,tx:tx}}
function judge(){var d=Math.abs(tx-W/2),p=0;if(d<tr*.3){p=2;msg="Bullseye! +2"}else if(d<tr){p=1;msg="Burned! +1"}else{msg="Missed. Try again!"}
  score+=p;$("sc").textContent=score+" pts";$("say").textContent=msg;var hy=H*.28;spear=null;
  if(p){state="burst";burst={t:0,x:tx,y:hy};emit(tx,hy,p===2?70:40,420,["#ffd84a","#ff9a2a","#fff3c8","#ff5a1a"],.9);shk=p===2?1:.5;flash=p===2?.6:.3;if(p===2){slow=.35;bulls++;big={t:0,txt:"BULLSEYE!"}}else big={t:0,txt:"BURNED!"};try{navigator.vibrate&&navigator.vibrate(p===2?[30,40,60]:30)}catch(e){}}
  else{state="miss";wob=1;emit(tx,hy,14,120,["#3a2a48","#5a4468"],.8);big={t:0,txt:"MISS"}}
  setTimeout(function(){round++;if(round>=5)finish();else newTarget()},p?900:700)}
function difficulty(){var sp=0,sz=0;for(var i=0;i<5;i++){sp+=.32+i*.16;sz+=Math.max(.1,.16-i*.01)}sp/=5;sz/=5;return 1+4*(0.6*Math.min(1,Math.max(0,(sp-.2)/.9))+0.4*Math.min(1,Math.max(0,(.2-sz)/.12)))}
function finish(){var st=score>=8?3:score>=5?2:1,tr_=NA.award("spear",difficulty(),score/10);lastRes={stars:st,d:difficulty(),pts:tr_.pts};$("rt").textContent=score>=9?"Perfect!":"Haze cleared!";$("st").textContent="★".repeat(st)+"☆".repeat(3-st);
  $("el").textContent=score+" / 10 pts. "+tr_.detail+" \u2192 "+tr_.line;$("wd").textContent="NACHA's Word: "+WORDS[Math.floor(Date.now()/864e5)%WORDS.length];$("ef").innerHTML=NA.followRow();show("se")}
var last=0;
function frame(now){requestAnimationFrame(frame);if(!$("sp").classList.contains("on"))return;if(!W)size();if(!W)return;var rdt=Math.min(.05,(now-(last||now))/1000);last=now;slow+=(1-slow)*Math.min(1,rdt*2.2);var dt=rdt*slow;
  cx.setTransform((window.devicePixelRatio||1),0,0,(window.devicePixelRatio||1),0,0);cx.clearRect(0,0,W,H);shk=Math.max(0,shk-rdt*2.2);if(shk>0)cx.translate((Math.random()-.5)*14*shk,(Math.random()-.5)*14*shk);
  if(bgok){var s=Math.max(W/bg.naturalWidth,H/bg.naturalHeight),w=bg.naturalWidth*s,h=bg.naturalHeight*s;cx.drawImage(bg,(W-w)/2,(H-h)*.3,w,h)}else{cx.fillStyle="#2b2433";cx.fillRect(0,0,W,H)}
  if(state==="aim"||state==="fly"||state==="miss"){tx+=tv*dt;if(tx<tr){tx=tr;tv=-tv}if(tx>W-tr){tx=W-tr;tv=-tv}}
  var ty=H*.28+Math.sin(now/500)*H*.012;
  if(state!=="burst"){ // haze: soft dark blobs
    var wob_=wob*Math.sin(now/40)*6;cx.save();cx.translate(tx+wob_,ty);
    for(var i=0;i<6;i++){var a=now/700+i*1.05,ox=Math.cos(a)*tr*.42,oy=Math.sin(a*1.3)*tr*.3,g=cx.createRadialGradient(ox,oy,0,ox,oy,tr*.7);g.addColorStop(0,"rgba(25,12,35,.9)");g.addColorStop(1,"rgba(30,16,40,0)");cx.fillStyle=g;cx.beginPath();cx.arc(ox,oy,tr*.7,0,6.3);cx.fill()}
    cx.restore();wob=Math.max(0,wob-dt*2)}
  // NACHA
  var nh=H*.26,nw=ncok?nh*nc.naturalWidth/nc.naturalHeight:nh*.8;if(ncok)cx.drawImage(nc,W/2-nw/2,H*.98-nh,nw,nh);
  // aiming guide
  if(state==="aim"){cx.strokeStyle="rgba(255,240,180,.35)";cx.setLineDash([6,6]);cx.lineWidth=2;cx.beginPath();cx.moveTo(W/2,H*.78);cx.lineTo(W/2,ty+tr);cx.stroke();cx.setLineDash([])}
  // spear
  if(spear){spear.t+=dt;var k=Math.min(1,spear.t/.28),y=H*.78+(ty-H*.78)*k;
    cx.save();cx.strokeStyle="#f4c430";cx.lineWidth=5;cx.lineCap="round";cx.shadowColor="#ff7a1a";cx.shadowBlur=14;cx.beginPath();cx.moveTo(W/2,y+H*.1);cx.lineTo(W/2,y);cx.stroke();
    cx.fillStyle="#ff9a2a";cx.beginPath();cx.moveTo(W/2,y-H*.03);cx.lineTo(W/2-8,y+6);cx.lineTo(W/2+8,y+6);cx.closePath();cx.fill();cx.restore();
    if(k>=1&&state==="fly"){judge()}}
  // ember trail behind the spear
  if(spear&&state==="fly"){var sy=H*.78+(ty-H*.78)*Math.min(1,spear.t/.28)+H*.05;emit(W/2,sy,2,60,["#ffd84a","#ff7a1a"],.35)}
  // particles
  for(var q=parts.length-1;q>=0;q--){var pt=parts[q];pt.t+=dt;if(pt.t>pt.l){parts.splice(q,1);continue}pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy+=420*dt;cx.globalAlpha=Math.max(0,1-pt.t/pt.l);cx.fillStyle=pt.c;cx.beginPath();cx.arc(pt.x,pt.y,pt.r,0,6.3);cx.fill()}cx.globalAlpha=1;
  // burst
  if(burst){burst.t+=dt;var p=Math.min(1,burst.t/.8);for(var j=0;j<18;j++){var an=j/18*6.28,r=p*tr*1.6;cx.fillStyle="rgba(255,"+(180+j*3)+",60,"+(1-p)+")";cx.beginPath();cx.arc(burst.x+Math.cos(an)*r,burst.y+Math.sin(an)*r,5*(1-p)+1,0,6.3);cx.fill()}
    }
  if(flash>0){cx.fillStyle="rgba(255,235,160,"+flash+")";cx.fillRect(0,0,W,H);flash=Math.max(0,flash-rdt*1.6)}
  if(big){big.t+=rdt;var bp=Math.min(1,big.t/.9),sc=1+Math.sin(Math.min(1,bp*3)*1.57)*.35;cx.save();cx.translate(W/2,H*.5);cx.scale(sc,sc);cx.globalAlpha=1-Math.max(0,bp-.6)/.4;cx.font="54px 'Lilita One',sans-serif";cx.textAlign="center";cx.lineWidth=8;cx.strokeStyle="#8f2a22";cx.strokeText(big.txt,0,0);cx.fillStyle="#ffd84a";cx.fillText(big.txt,0,0);cx.restore();if(bp>=1)big=null}
}
$("go").onclick=start;$("again").onclick=start;
document.addEventListener("pointerdown",function(e){if(e.target.closest("button,a"))return;throwSpear()});
document.addEventListener("keydown",function(e){if(e.code==="Space"||e.key==="Enter"){e.preventDefault();if(!e.repeat)throwSpear()}});
function card(cb){var C=document.createElement("canvas");C.width=1080;C.height=1350;var x=C.getContext("2d");
  var F="'Lilita One',sans-serif";
  if(bgok){var k=Math.max(1080/bg.naturalWidth,1350/bg.naturalHeight),w=bg.naturalWidth*k,h=bg.naturalHeight*k;x.drawImage(bg,(1080-w)/2,(1350-h)*.3,w,h)}else{x.fillStyle="#2b2433";x.fillRect(0,0,1080,1350)}
  var g=x.createLinearGradient(0,0,0,1350);g.addColorStop(0,"rgba(20,8,30,.72)");g.addColorStop(.38,"rgba(20,8,30,0)");g.addColorStop(.62,"rgba(20,8,30,0)");g.addColorStop(1,"rgba(20,8,30,.88)");x.fillStyle=g;x.fillRect(0,0,1080,1350);
  if(ncok){var nh=520,nw=nh*nc.naturalWidth/nc.naturalHeight;x.drawImage(nc,540-nw/2,860-nh,nw,nh)}
  x.textAlign="center";x.fillStyle="#f4c430";x.strokeStyle="#8f2a22";x.lineWidth=10;x.lineJoin="round";x.font="96px "+F;x.strokeText("FIRE SPEAR",540,150);x.fillText("FIRE SPEAR",540,150);
  x.font="46px "+F;x.fillStyle="#fbf1df";x.fillText(score>=8?"NACHA burned it all!":score>=5?"NACHA burned the haze!":"NACHA is warming up!",540,220);
  var st=lastRes.stars;x.font="110px "+F;x.fillStyle="#f4c430";x.fillText("\u2605".repeat(st)+"\u2606".repeat(3-st),540,1010);
  x.font="130px "+F;x.fillStyle="#fff";x.strokeStyle="#241518";x.lineWidth=12;x.strokeText(score+" / 10",540,1150);x.fillText(score+" / 10",540,1150);
  x.font="44px "+F;x.fillStyle="#f6dfbf";x.fillText("Difficulty "+NA.starsText(lastRes.d)+"  \u00b7  NACHA Points +"+lastRes.pts,540,1225);
  x.font="46px "+F;x.fillStyle="#f4c430";x.fillText(NA.HANDLE+"  #NACHA",540,1305);
  try{C.toBlob(function(b){cb(b)},"image/png")}catch(e){cb(null)}}
var lastRes={stars:1,d:3,pts:0};
$("sh").onclick=function(){var txt="I scored "+score+"/10 in NACHA's Fire Spear! "+NA.HANDLE+" #NACHA",url=location.href.split("?")[0];
  card(function(blob){if(!blob){if(navigator.clipboard)navigator.clipboard.writeText(txt+" "+url).then(function(){NA.toast("Copied")}).catch(function(){});return}
    var f=new File([blob],"nacha-fire-spear.png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],text:txt,url:url}).catch(function(){})}
    else{var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="nacha-fire-spear.png";document.body.appendChild(a);a.click();a.remove();NA.toast("Image saved")}})};
addEventListener("resize",size);requestAnimationFrame(frame);
})();
</script></body></html>
