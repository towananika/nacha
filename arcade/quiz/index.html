<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Which Khmer Savior are you? · NACHA</title>
<meta name="description" content="4 quick questions. Find out which of NACHA's four gods you are.">
<meta property="og:title" content="Which Khmer Savior are you?">
<meta property="og:description" content="4 quick questions. Which of NACHA's gods are you?">
<meta name="theme-color" content="#1d1020">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common.css">
<style>
  #stage{width:min(100vw,480px);height:100%;max-height:100dvh;overflow:hidden;background:#1d1020}
  #bg{position:absolute;inset:0;width:100%;height:100%}
  .scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 18px);text-align:center}
  .scr.on{display:flex}
  .dots{display:flex;gap:8px;margin-bottom:4px}
  .dots i{width:30px;height:7px;border-radius:4px;background:#ffffff30}
  .dots i.on{background:var(--gold)}
  .q{font:32px/1.1 "Lilita One",sans-serif;text-shadow:0 3px 0 #0006;margin:0 0 6px;max-width:340px}
  .opts{display:grid;gap:10px;width:100%;max-width:340px}
  .opt{appearance:none;border:2px solid #ffffff2e;background:#150a1ab8;color:#fff;border-radius:18px;padding:14px 16px;font:19px "Lilita One",sans-serif;text-align:left;display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .1s,border-color .15s,background .15s}
  .opt span{font-size:28px;width:36px;text-align:center}
  .opt:hover{border-color:var(--gold)}
  .opt:active{transform:scale(.97);background:#3a1b2e}
  .hero{width:190px;height:190px;border-radius:32px;overflow:hidden;border:3px solid var(--gold);box-shadow:0 0 30px #f4c43066,0 10px 0 #0004;background:#0003}
  .hero img{width:100%;height:100%;display:block}
  .iam{font:15px "Lilita One",sans-serif;letter-spacing:.2em;color:#f6dfbf}
  .gname{font:44px/1 "Lilita One",sans-serif;color:var(--gold);text-shadow:0 4px 0 #d35400}
  .gline{font-size:17px;max-width:300px;color:#fff;margin:2px 0 4px}
  .match{font-size:13px;color:#e9c9a4}
  .small{transform:scale(.92)}
</style>
</head>
<body>
<div id="app"><div id="stage">
  <canvas id="bg"></canvas>

  <section class="scr on" id="s0">
    <div class="brand">NACHA</div>
    <h1 class="q" style="font-size:40px">Which Khmer Savior are you?</h1>
    <div class="hero" style="width:170px;height:170px"><img id="introImg" alt=""></div>
    <button class="btn main" id="go">Start</button>
    <div class="match">4 quick questions</div>
  </section>

  <section class="scr" id="sq">
    <div class="dots" id="dots"></div>
    <h2 class="q" id="qt"></h2>
    <div class="opts" id="opts"></div>
  </section>

  <section class="scr" id="sr">
    <div class="iam">YOU ARE</div>
    <div class="hero"><img id="rImg" alt=""></div>
    <div class="gname" id="rName"></div>
    <div class="gline" id="rLine"></div>
    <div class="match" id="rMatch"></div>
    <div id="rGods"></div>
    <div class="row"><button class="btn main" id="share">Share</button><button class="btn" id="again">Again</button></div>
    <div id="rFollow"></div>
    <a class="btn" href="../" style="padding:9px 16px;font-size:15px">More games</a>
  </section>
</div></div>

<script src="../common.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var QS = [
    { q: "Someone needs help. You…", a: [["🏃", "Run first, think later", "nacha"], ["👂", "Listen first", "kunsim"], ["😄", "Make them laugh", "sousang"], ["🔥", "Fix the root cause", "fdo"]] },
    { q: "Perfect day off?", a: [["🛹", "A big adventure", "nacha"], ["🌸", "A gentle walk", "kunsim"], ["🍵", "Tea and a nap", "sousang"], ["🥋", "Hard training", "fdo"]] },
    { q: "Your superpower?", a: [["⚡", "Speed", "nacha"], ["🪷", "Calm", "kunsim"], ["🍀", "Luck", "sousang"], ["🔥", "Willpower", "fdo"]] },
    { q: "Your motto?", a: [["💪", "Never give up!", "nacha"], ["🤝", "Be kind.", "kunsim"], ["🐢", "No rush.", "sousang"], ["🪨", "Stay firm.", "fdo"]] }
  ];
  var MATCH = { nacha: "kunsim", kunsim: "sousang", sousang: "kunsim", fdo: "nacha" };
  var QUOTE = { nacha: "Dreams, hope and courage. Let's go!", kunsim: "Smile, stay kind, and luck will follow.", sousang: "Smile often. Good people will find you.", fdo: "Let the sacred fire burn your worries." };
  var god = function (id) { return NA.GODS.filter(function (g) { return g.id === id; })[0]; };
  var score, step, result;

  // backdrop
  var bg = $("bg"), bx = bg.getContext("2d"), t0 = performance.now(), leaves;
  function fit() {
    var st = $("stage"), w = st.clientWidth, h = st.clientHeight, d = Math.min(2, window.devicePixelRatio || 1);
    bg.width = w * d; bg.height = h * d; bx.setTransform(d, 0, 0, d, 0, 0); leaves = NA.leaves(14, w, h);
  }
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    var w = bg.clientWidth, h = bg.clientHeight;
    NA.drawBG(bx, w, h, (now - t0) * 0.02, (now - t0) / 1000);
    NA.drawLeaves(bx, leaves, w, h, dt);
    requestAnimationFrame(frame);
  }
  window.addEventListener("resize", fit);

  function show(id) { ["s0", "sq", "sr"].forEach(function (s) { $(s).classList.toggle("on", s === id); }); }
  function ask() {
    var Q = QS[step];
    $("dots").innerHTML = QS.map(function (_, i) { return '<i class="' + (i <= step ? "on" : "") + '"></i>'; }).join("");
    $("qt").textContent = Q.q;
    $("opts").innerHTML = "";
    Q.a.slice().sort(function () { return Math.random() - .5; }).forEach(function (o) {
      var b = document.createElement("button"); b.className = "opt";
      b.innerHTML = "<span>" + o[0] + "</span>" + o[1];
      b.addEventListener("click", function () {
        score[o[2]] = (score[o[2]] || 0) + 1; score._last = o[2];
        if (++step < QS.length) ask(); else finish();
      });
      $("opts").appendChild(b);
    });
  }
  function finish() {
    var best = "nacha", top = -1;
    NA.GODS.forEach(function (g) { var s = (score[g.id] || 0) + (g.id === score._last ? 0.5 : 0); if (s > top) { top = s; best = g.id; } });
    result = best; var g = god(best), isNew = NA.unlock(best);
    $("rImg").src = NA.dataURL(NA.god(best));
    $("rName").textContent = g.name; $("rLine").textContent = QUOTE[best];
    $("rMatch").textContent = "Best friend in the team: " + god(MATCH[best]).name;
    $("rGods").innerHTML = NA.godsStrip(isNew ? best : "");
    $("rFollow").innerHTML = NA.followRow();
    show("sr");
  }
  function start() { score = {}; step = 0; ask(); show("sq"); }

  $("go").addEventListener("click", start);
  $("again").addEventListener("click", start);
  $("share").addEventListener("click", function () {
    var g = god(result);
    NA.fontReady().then(function () { return NA.card({ frame: true, svg: NA.god(result), big: g.name, label: "I'M A KHMER SAVIOR", line: QUOTE[result] }); })
      .then(function (c) { return NA.share(c, "I'm " + g.name + "! Which Khmer Savior are you? " + NA.HANDLE + " #NACHA", "nacha-" + result + ".png"); });
  });
  $("introImg").src = NA.dataURL(NA.nacha({ mood: "smile", pose: "wave" }));
  NA.fontReady().then(function () { fit(); requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
