<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NACHA Mini Games</title>
<meta name="description" content="Quick mini games with NACHA. Play, share, and meet the Khmer Savior gods.">
<meta property="og:title" content="NACHA Mini Games">
<meta property="og:description" content="Quick mini games with NACHA and the Khmer Savior gods.">
<meta name="theme-color" content="#1d1020">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  body{overflow:auto}
  #app{display:block;height:auto;min-height:100%}
  #stage{width:min(100vw,480px);margin:0 auto;min-height:100dvh;position:relative;padding:calc(env(safe-area-inset-top) + 22px) 16px calc(env(safe-area-inset-bottom) + 28px);text-align:center;text-shadow:0 2px 0 #0005}
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
  h1{font:42px/1 "Lilita One",sans-serif;margin:6px 0 4px}
  .sub{color:#f6dfbf;margin:0 0 16px}
  .cards{display:grid;gap:12px;margin-bottom:18px}
  a.card{display:flex;align-items:center;gap:14px;text-align:left;background:#150a1acc;border:2px solid #ffffff2a;border-radius:22px;padding:12px;color:#fff;text-decoration:none;text-shadow:none;transition:transform .1s,border-color .15s}
  a.card:hover{border-color:var(--gold)}
  a.card:active{transform:scale(.98)}
  a.card .ic{flex:none;width:84px;height:84px;border-radius:18px;overflow:hidden;background:#f3c98a}
  a.card .ic img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
  a.card b{display:block;font:22px/1.05 "Lilita One",sans-serif;color:var(--gold)}
  a.card span{font-size:14px;color:#f6dfbf}
  a.card.soon{opacity:.55;pointer-events:none}
  h3{font:14px "Lilita One",sans-serif;letter-spacing:.2em;color:#f6dfbf;margin:8px 0 2px}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app"><div id="stage">
  <div class="brand">NACHA</div>
  <h1>Mini Games</h1>
  <p class="sub">Quick plays with NACHA.</p>
  <div class="cards" id="cards"></div>
  <div id="follow"></div>
</div></div>
<script src="common.js"></script>
<script>
(function () {
  var GAMES = [
    { href: "tour/", t: "Temple Tour", d: "Travel, tidy, clear the haze", emo: "🧳" },
    { href: "courtyard/", t: "Quiet Courtyard", d: "Take a breath with NACHA", emo: "🪷" },
    { href: "wisdom/", t: "Little Wisdom", d: "Pick the kind way", emo: "💭" },
    { href: "sweep/", t: "Sweep the Courtyard", d: "Swipe the falling leaves", emo: "🍂" },
    { href: "stack/", t: "Build the Tower", d: "Tap to stack it high", emo: "🛕" }
  ];
  document.getElementById("cards").innerHTML = GAMES.map(function (g) {
    return '<a class="card' + (g.soon ? " soon" : "") + '"' + (g.href ? ' href="' + g.href + '"' : "") + '><div class="ic" style="font-size:44px;display:grid;place-items:center">' + g.emo + '</div><div><b>' + g.t + "</b><span>" + g.d + "</span></div></a>";
  }).join("");
  document.getElementById("follow").innerHTML = NA.followRow();
  var bg = document.getElementById("bg"), bx = bg.getContext("2d"), t0 = performance.now(), last = t0, leaves;
  function fit() { var w = innerWidth, h = innerHeight, d = Math.min(2, devicePixelRatio || 1); bg.width = w * d; bg.height = h * d; bx.setTransform(d, 0, 0, d, 0, 0); leaves = NA.leaves(12, w, h); }
  function frame(now) { var dt = Math.min(0.05, (now - last) / 1000); last = now; NA.drawBG(bx, innerWidth, innerHeight, (now - t0) * 0.012, (now - t0) / 1000); NA.drawLeaves(bx, leaves, innerWidth, innerHeight, dt); requestAnimationFrame(frame); }
  addEventListener("resize", fit); NA.fontReady().then(function () { fit(); requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
