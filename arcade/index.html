<!doctype html>



<html lang="ja">



<head>



<meta charset="utf-8">



<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">



<title>NACHA Mini Games</title>



<meta name="description" content="Quick mini games with NACHA. Play, share, and meet the Khmer Savior gods.">



<meta property="og:title" content="NACHA Mini Games">



<meta property="og:description" content="Quick mini games with NACHA and the Khmer Savior gods.">



<meta name="theme-color" content="#1d1020">



<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>



<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">



<link rel="stylesheet" href="common.css">



<style>



  body{overflow:auto}



  #app{display:block;height:auto;min-height:100%}



  #stage{width:min(100vw,540px);margin:0 auto;min-height:100dvh;position:relative;padding:calc(env(safe-area-inset-top) + 22px) 16px calc(env(safe-area-inset-bottom) + 28px);text-align:center;text-shadow:0 2px 0 #0005}



  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1}



  h1{font:42px/1 "Lilita One","M PLUS Rounded 1c",sans-serif;margin:6px 0 4px}



  .sub{color:#f6dfbf;margin:0 0 16px}



  .cards{display:grid;gap:12px;margin-bottom:18px}



  /* PC: 2列グリッド */



  @media(min-width:600px){.cards{grid-template-columns:1fr 1fr}}



  a.card{display:flex;align-items:center;gap:14px;text-align:left;background:#150a1acc;border:2px solid #ffffff2a;border-radius:22px;padding:12px;color:#fff;text-decoration:none;text-shadow:none;transition:transform .1s,border-color .15s}



  a.card:hover{border-color:var(--gold);transform:translateY(-2px)}



  a.card:active{transform:scale(.98)}



  a.card .ic{flex:none;width:84px;height:84px;border-radius:18px;overflow:hidden;background:#3a2048;display:grid;place-items:center;font-size:44px}



  a.card b{display:block;font:22px/1.05 "Lilita One","M PLUS Rounded 1c",sans-serif;color:var(--gold)}



  a.card span{font-size:14px;color:#f6dfbf}



  a.card .stars{font-size:13px;color:var(--gold);letter-spacing:2px}



  a.card.soon{opacity:.55;pointer-events:none}



  .home{position:absolute;left:12px;top:calc(env(safe-area-inset-top) + 12px);color:#fff;text-decoration:none;font-weight:700;font-size:14px;background:#0005;border:1px solid #ffffff33;border-radius:999px;padding:6px 12px;text-shadow:none}



  .unoff{font-size:11px;color:#f6dfbfcc;margin-top:18px;text-shadow:none}.unoff a{color:#fff}



  h3{font:14px "Lilita One","M PLUS Rounded 1c",sans-serif;letter-spacing:.2em;color:#f6dfbf;margin:8px 0 2px}



  /* キーボードヒント（PC向け） */



  .kbd-hint{display:none;font-size:12px;color:#f6dfbf88;margin:-8px 0 10px;text-shadow:none}



  @media(pointer:fine){.kbd-hint{display:block}}



</style>



</head>



<body>



<canvas id="bg"></canvas>



<div id="app"><div id="stage">



  <a class="home" href="../">← <span data-t="nav_home">ホーム</span></a>



  <div class="brand">NACHA</div>



  <h1 data-t="games_h">ミニゲーム</h1>



  <p class="sub" data-t="ph_lead">小さな神様ナチャと、30秒であそぼう</p>



  <p class="kbd-hint">💻 Click to play · Keyboard shortcuts shown in each game</p>



  <div class="cards" id="cards"></div>



  <div id="follow"></div>



  <p class="unoff"><span data-t="unoff">このページは非公式のファンページです。公式情報は</span> <a href="https://nacha.club/" target="_blank" rel="noopener">nacha.club ↗</a></p>



</div></div>



<script src="../assets/i18n.js"></script>



<script src="common.js"></script>



<script>



(function () {



  var GAMES = [





    { href: "mokugyo/", t: "電子木魚", k: "g_mokugyo", d: "ポクポク叩いて徳積み！澄んだ音と触感で大功徳成就", diff: 1, emo: "🪵" },

    { href: "fukuiki/", t: "大福引き", k: "g_fukuiki", d: "コインを稼いで10連を引こう！最高位「神吉」降臨", diff: 1, emo: "🎴" },

    { href: "spear/", t: "Fire Spear", k: "g_spear", d: "悪気をタップで焼きはらえ！", diff: 3, emo: "🔥" },



    { href: "tour/",  t: "Temple Tour", k: "g_tour",  d: "ナチャのお寺をめぐろう",       diff: 1, emo: "🏮" },



    { href: "steps/", t: "108 Steps",   k: "g_steps", d: "煩悩108を踏みこえろ",         diff: 2, emo: "🪷" },



  ];



  // i18n（サイトと同じ言語で表示）



  var D = window.NACHA_I18N || {}, L = "ja";



  try { L = localStorage.getItem("nacha-lang") || ""; } catch (e) {}



  if (!D[L]) { var nl = (navigator.language || "en").toLowerCase(); L = nl.indexOf("zh") === 0 ? (/tw|hk|hant/.test(nl) ? "zh" : "zhs") : nl.slice(0, 2) === "ms" ? "id" : nl.slice(0, 2); if (!D[L]) L = "en"; }



  function T(k, f) { return (D[L] || {})[k] || (D.en || {})[k] || f; }



  document.documentElement.lang = L === "zh" ? "zh-Hant" : L === "zhs" ? "zh-Hans" : L;



  [].forEach.call(document.querySelectorAll("[data-t]"), function (e) { e.textContent = T(e.dataset.t, e.textContent); });



  GAMES.forEach(function (g) { if (g.k) g.d = T(g.k, g.d); });



  document.getElementById("cards").innerHTML = GAMES.map(function (g) {



    return '<a class="card' + (g.soon ? " soon" : "") + '"' + (g.href ? ' href="' + g.href + '"' : "") + '><div class="ic">' + g.emo + '</div><div><b>' + g.t + "</b><span>" + g.d + (g.diff ? '<br><span class="stars">' + NA.starsText(g.diff) + "</span>" : "") + "</span></div></a>";



  }).join("");



  document.getElementById("follow").innerHTML = NA.followRow();



  var bg = document.getElementById("bg"), bx = bg.getContext("2d"), t0 = performance.now(), last = t0, leaves;



  function fit() { var w = innerWidth, h = innerHeight, d = Math.min(2, devicePixelRatio || 1); bg.width = w * d; bg.height = h * d; bx.setTransform(d, 0, 0, d, 0, 0); leaves = NA.leaves(12, w, h); }



  function frame(now) { var dt = Math.min(0.05, (now - last) / 1000); last = now; NA.drawBG(bx, innerWidth, innerHeight, (now - t0) * 0.012, (now - t0) / 1000); NA.drawLeaves(bx, leaves, innerWidth, innerHeight, dt); requestAnimationFrame(frame); }



  addEventListener("resize", fit); NA.fontReady().then(function () { fit(); requestAnimationFrame(frame); });



})();



</script>



</body>



</html>
