<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NACHA Dev Notes</title>
<style>body{margin:0;background:#1a1a1a;color:#f3ead7;font:16px/1.7 system-ui,sans-serif}nav{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;background:#111;position:sticky;top:0}
nav a{color:#D4AC0D;text-decoration:none;border:1px solid #D4AC0D55;border-radius:16px;padding:4px 12px;font-size:14px}nav a.on{background:#C0392B;color:#fff;border-color:#C0392B}
main{max-width:760px;margin:0 auto;padding:16px}h1,h2,h3{color:#D4AC0D}table{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto}td,th{border:1px solid #555;padding:4px 8px}blockquote{border-left:3px solid #C0392B;margin:8px 0;padding:2px 12px;color:#ddd;background:#222}code{background:#333;padding:0 4px}a{color:#D4AC0D}</style></head><body>
<nav id="nv"></nav><main id="m">Loading…</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
var P=[["dev-log","開発ログ"],["gpt-images-108steps","GPT画像指示"],["temple-tour-plan","寺めぐり企画"],["nacha-ness","ナチャ要素"],["courtyard-ideas","広場の改善案"]];
function go(){var k=(location.hash||"#dev-log").slice(1);if(!P.some(function(p){return p[0]===k}))k="dev-log";
document.getElementById("nv").innerHTML=P.map(function(p){return'<a href="#'+p[0]+'"'+(p[0]===k?' class="on"':"")+">"+p[1]+"</a>"}).join("")+'<a href="../arcade/">Games</a>';
fetch(k+".md").then(function(r){return r.text()}).then(function(t){document.getElementById("m").innerHTML=marked.parse(t);document.querySelectorAll("#m a").forEach(function(a){var h=a.getAttribute("href")||"";if(/\.md$/.test(h)){a.href="#"+h.replace(/\.md$/,"")}})}).catch(function(){document.getElementById("m").textContent="読み込めませんでした"})}
addEventListener("hashchange",go);go();
</script></body></html>
