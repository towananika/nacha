<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NACHA 境内護摩堂 · みんなの護摩焚き祈願所</title>
<meta name="description" content="悠遊観音堂の神聖な護摩の火に願いをくべる。当落の不安もモヤモヤも、ナチャの神火で焼き払って清めよう。">
<meta name="theme-color" content="#1a0808">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=M+PLUS+Rounded+1c:wght@700;900&family=Noto+Serif+JP:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/site.css">
<style>
:root{
  --gold:#D4AC0D;
  --gold-glow:#F4D03F;
  --fire-red:#C0392B;
}
body{background:#120507;color:#fff;overflow-x:hidden;touch-action:manipulation;font-family:"M PLUS Rounded 1c",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
main{max-width:720px;margin:0 auto;padding:12px 16px 36px;text-align:center}

/* 護摩壇（炉）エリア */
.goma-stage{position:relative;width:100%;height:380px;background:radial-gradient(circle at 50% 65%,#420f09 0%,#200606 50%,#0f0304 100%);border-radius:26px;border:2px solid #5a1910;box-shadow:0 14px 40px rgba(0,0,0,0.8),inset 0 0 40px rgba(0,0,0,0.8);overflow:hidden;margin-bottom:16px}
#fireCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* 護摩壇の祭壇枠 */
.altar-decor{position:absolute;bottom:0;left:0;right:0;height:60px;background:linear-gradient(180deg,transparent,#1f0807);border-top:2px solid #D4AC0D55;display:flex;align-items:center;justify-content:center;gap:12px;font:900 12px "Noto Serif JP",serif;color:var(--gold-glow);letter-spacing:.2em;z-index:3;pointer-events:none}

/* 奉納木札数カウンター */
.goma-counter{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(20,5,6,0.75);border:1px solid #D4AC0D66;padding:4px 18px;border-radius:999px;font:800 12px "M PLUS Rounded 1c",sans-serif;color:#fcecd2;backdrop-filter:blur(6px);z-index:4}
.goma-counter b{color:var(--gold-glow);font-size:14px}

/* 音声トグルボタン */
.sound-toggle{position:absolute;top:14px;right:14px;background:#ffffff14;border:1px solid #ffffff33;border-radius:999px;padding:4px 10px;font-size:12px;color:#fff;cursor:pointer;z-index:4}

/* 護摩木（木札）投下操作エリア */
.goma-action-box{background:rgba(30,12,14,0.6);border:1.5px solid #ffffff1c;border-radius:22px;padding:18px 16px;backdrop-filter:blur(8px)}
.action-title{margin:0 0 6px;font:900 20px "Noto Serif JP",serif;color:var(--gold-glow)}
.action-sub{margin:0 0 14px;font-size:13px;color:#fcecd2aa}

/* 定番祈願タグ */
.goma-tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px}
.g-tag{background:#ffffff12;color:#fcecd2;border:1px solid #ffffff24;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}
.g-tag:hover{background:var(--fire-red);color:#fff;border-color:var(--fire-red)}

/* 護摩木入力フォーム */
.goma-form{display:flex;gap:8px;max-width:460px;margin:0 auto}
.goma-input{flex:1;background:#240c0f;border:1.5px solid #6e2017;border-radius:14px;padding:12px 14px;color:#fff;font:inherit;font-size:14px}
.goma-input:focus{outline:0;border-color:var(--gold-glow)}
.btn-throw-goma{background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff;border:0;border-radius:14px;padding:0 22px;font:900 15px "M PLUS Rounded 1c",sans-serif;cursor:pointer;box-shadow:0 4px 14px rgba(192,57,43,0.4);white-space:nowrap}
.btn-throw-goma:active{transform:scale(0.97)}

/* 護摩木アニメーション要素 */
.flying-wood{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);width:60px;height:140px;background:linear-gradient(90deg,#8b4d24,#b36834 50%,#8b4d24);border:2px solid #57290f;border-radius:4px;box-shadow:0 8px 20px rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font:900 13px "Noto Serif JP",serif;color:#1a0805;letter-spacing:2px;z-index:5;pointer-events:none;animation:throwIntoFire 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards}
@keyframes throwIntoFire{
  0%{transform:translateX(-50%) translateY(120px) scale(1.2);opacity:1}
  60%{transform:translateX(-50%) translateY(-60px) scale(0.85);opacity:1}
  100%{transform:translateX(-50%) translateY(-100px) scale(0.3) rotate(15deg);opacity:0;filter:brightness(3)}
}

/* トースト */
.toast-msg{position:fixed;bottom:calc(env(safe-area-inset-bottom)+30px);left:50%;transform:translateX(-50%) translateY(20px);background:linear-gradient(90deg,#e74c3c,#c0392b);color:#fff;font:900 13.5px "M PLUS Rounded 1c",sans-serif;padding:9px 20px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,0.5);opacity:0;pointer-events:none;transition:all .25s ease;z-index:99}
.toast-msg.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 祈祷証モーダル */
.modal-overlay{position:fixed;inset:0;background:rgba(15,5,8,0.85);backdrop-filter:blur(6px);z-index:90;display:none;align-items:center;justify-content:center;padding:16px;opacity:0;transition:opacity .25s}
.modal-overlay.open{display:flex;opacity:1}
.bless-box{width:100%;max-width:380px;background:linear-gradient(160deg,#24080a,#140305);border:2px solid var(--gold);border-radius:24px;padding:24px 20px;position:relative;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,0.8)}
.modal-close-x{position:absolute;top:12px;right:14px;background:none;border:0;font-size:24px;color:#fff;cursor:pointer;opacity:.7}
.bless-fire-emo{font-size:64px;margin-bottom:6px;filter:drop-shadow(0 0 20px #ff5733)}
.bless-title{font:900 22px "Noto Serif JP",serif;color:var(--gold-glow);margin:0 0 8px}
.bless-text{font:700 15px/1.6 "M PLUS Rounded 1c",sans-serif;color:#fcecd2;margin:12px 0 20px;padding:12px;background:rgba(255,255,255,0.06);border-radius:14px;border:1px dashed #D4AC0D66}
.btn-share-goma{width:100%;padding:14px;border-radius:14px;background:linear-gradient(135deg,#1da1f2,#0c7abf);color:#fff;border:0;font:900 15px "M PLUS Rounded 1c",sans-serif;cursor:pointer}
</style>
</head>
<body>
<div class="bar">
  <div style="display:flex;align-items:center">
    <a class="brand" href="../">NACHA</a>
    <span class="bar-temple-badge" data-i="temple_badge">悠遊観音堂 境内</span>
  </div>
  <div class="barr">
    <a class="header-coin-badge" href="../shop/" title="所持コイン・境内授与所（ショップ）へ"><span aria-hidden="true">🪙</span><span id="headerCoinCount">--</span></a>
    <button class="ibtn temple-bell-btn" id="templeBellBtn" type="button" title="参拝の鈴を鳴らす" aria-label="参拝の鈴">🔔</button>
  </div>
</div>

<main id="main">
  <!-- 護摩壇（火炎炉） -->
  <section class="goma-stage" id="gomaStage">
    <canvas id="fireCanvas"></canvas>
    <div class="goma-counter">本日奉納された護摩木: <b id="gomaCount">1,284</b> 本</div>
    <button class="sound-toggle" id="btnSound">🔊 焚き火音 ON</button>
    <div class="altar-decor">悠遊観音堂 · 那茶大炎神護摩</div>
  </section>

  <!-- 護摩木くべアクション -->
  <section class="goma-action-box">
    <h1 class="action-title">神聖な護摩火に願いをくべる</h1>
    <p class="action-sub">当落の胃痛も不安も、炎にくべて浄化しよう。心願成就の神火が燃え盛る！</p>

    <!-- クイック祈願タグ -->
    <div class="goma-tags" id="gomaTags">
      <button type="button" class="g-tag" data-text="当落の胃痛消滅！絶対当選祈願！">🎫 当落の胃痛消滅！絶対当選</button>
      <button type="button" class="g-tag" data-text="全落ち恐怖払拭！生きて逢う！">🕊️ 全落ち恐怖払拭！生きて逢う</button>
      <button type="button" class="g-tag" data-text="アリーナ神席！肉眼で推しを拝む！">👑 アリーナ神席！肉眼直通</button>
      <button type="button" class="g-tag" data-text="推しが今日も健康で多幸でありますように！">🍙 推しの健康・美味しいご飯</button>
    </div>

    <!-- 護摩木フォーム -->
    <form class="goma-form" id="gomaForm">
      <input class="goma-input" id="gomaInput" maxlength="30" placeholder="願い事やモヤモヤを書く（例: チケット絶対当選！）" required>
      <button type="submit" class="btn-throw-goma" id="btnThrow">炎にくべる 🔥</button>
    </form>
  </section>
</main>

<!-- 祈祷証モーダル -->
<div class="modal-overlay" id="blessModal">
  <div class="bless-box">
    <button class="modal-close-x" id="modalClose">&times;</button>
    <div class="bless-fire-emo">🔥</div>
    <h2 class="bless-title">護摩祈祷・大浄化成就</h2>
    <div class="bless-text" id="blessText"></div>
    <button class="btn-share-goma" id="btnShareGoma">𝕏 で浄化成就を報告する</button>
  </div>
</div>

<div class="toast-msg" id="toastMsg"></div>

<!-- ボトムナビ -->
<nav class="tabs" aria-label="Main">
  <a href="../"><span aria-hidden="true">🏮</span><b data-i="nav_home">ホーム</b></a>
  <a href="../amulet/"><span aria-hidden="true">🧧</span><b data-i="nav_amulet">お守り</b></a>
  <a href="../rest/"><span aria-hidden="true">🪷</span><b>休憩所</b></a>
  <a href="../arcade/fukuiki/"><span aria-hidden="true">🎴</span><b>福引き</b></a>
  <a href="../characters/"><span aria-hidden="true">🗺️</span><b data-i="nav_chars">キャラ</b></a>
</nav>

<script src="../assets/coins.js"></script>
<script src="../assets/site.js"></script>
<script>
(function(){
  'use strict';

  var $ = function(i){ return document.getElementById(i); };
  var canvas = $('fireCanvas'), ctx = canvas.getContext('2d');
  var particles = [];
  var flameIntensity = 1.0;
  var targetIntensity = 1.0;
  var soundOn = false;
  var audioCtx = null;
  var noiseNode = null;
  var lastBurnedWish = '';

  // 画面リサイズ
  function resize(){
    var rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width * (window.devicePixelRatio || 1);
    canvas.height = rect.height * (window.devicePixelRatio || 1);
    ctx.setTransform(window.devicePixelRatio || 1, 0, 0, window.devicePixelRatio || 1, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // 炎パーティクル
  function Particle(x, y, isBig) {
    this.x = x + (Math.random() - 0.5) * 60;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 1.5;
    this.vy = -(Math.random() * 3 + 2.5) * flameIntensity;
    this.size = (Math.random() * 24 + 16) * (isBig ? 1.6 : 1);
    this.life = Math.random() * 35 + 30;
    this.maxLife = this.life;
    this.hue = Math.random() * 30 + 10; // 赤〜オレンジ〜黄
  }

  function loop(){
    var w = canvas.width / (window.devicePixelRatio || 1);
    var h = canvas.height / (window.devicePixelRatio || 1);

    ctx.clearRect(0, 0, w, h);

    flameIntensity += (targetIntensity - flameIntensity) * 0.05;
    if (flameIntensity > 1.0) targetIntensity = Math.max(1.0, targetIntensity - 0.005);

    // 火種生成
    var spawnCount = Math.floor(4 * flameIntensity);
    for (var i = 0; i < spawnCount; i++) {
      particles.push(new Particle(w / 2, h * 0.75, flameIntensity > 1.8));
    }

    // パーティクル描画
    ctx.globalCompositeOperation = 'lighter';
    for (var j = particles.length - 1; j >= 0; j--) {
      var p = particles[j];
      p.x += p.vx;
      p.y += p.vy;
      p.life--;

      var progress = 1 - (p.life / p.maxLife);
      var currentSize = p.size * (1 - progress * 0.7);
      var alpha = Math.max(0, 1 - progress);

      var grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, currentSize);
      grad.addColorStop(0, 'rgba(255, 240, 180, ' + alpha + ')');
      grad.addColorStop(0.35, 'rgba(255, ' + (120 - progress * 60) + ', 30, ' + (alpha * 0.8) + ')');
      grad.addColorStop(1, 'rgba(180, 20, 10, 0)');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, currentSize, 0, Math.PI * 2);
      ctx.fill();

      // 火の粉
      if (Math.random() < 0.08) {
        ctx.fillStyle = '#fff6a8';
        ctx.fillRect(p.x + (Math.random() - 0.5) * 20, p.y - 10, 2.5, 2.5);
      }

      if (p.life <= 0) particles.splice(j, 1);
    }
    ctx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(loop);
  }
  loop();

  // Web Audio API で心地よいパチパチ焚き火音（外部ファイル不要）
  function initAudio() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      // ホワイトノイズ生成
      var bufferSize = audioCtx.sampleRate * 2;
      var buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      var data = buffer.getChannelData(0);
      for (var i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * 0.04;
      }
      noiseNode = audioCtx.createBufferSource();
      noiseNode.buffer = buffer;
      noiseNode.loop = true;

      // バンドパスフィルターで焚き火の温もりある周波数へ
      var filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 850;

      noiseNode.connect(filter);
      filter.connect(audioCtx.destination);
      noiseNode.start();
    } catch(e){}
  }

  $('btnSound').addEventListener('click', function(){
    soundOn = !soundOn;
    if (soundOn) {
      initAudio();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      this.textContent = '🔊 焚き火音 ON';
      this.style.background = '#e74c3c';
    } else {
      if (audioCtx) audioCtx.suspend();
      this.textContent = '🔈 焚き火音 OFF';
      this.style.background = '#ffffff14';
    }
  });

  // クイックタグ入力
  var tags = document.querySelectorAll('.g-tag');
  tags.forEach(function(btn){
    btn.addEventListener('click', function(){
      $('gomaInput').value = btn.dataset.text;
    });
  });

  
  // URLパラメータからの願い事自動引き継ぎ（お守りからの境内巡礼）
  try {
    var params = new URLSearchParams(window.location.search);
    var sharedWish = params.get('wish');
    if (sharedWish && $('gomaInput')) {
      $('gomaInput').value = sharedWish;
      showToast('お守りの願いを引き継ぎました！そのまま炎にくべてね🔥');
    }
  } catch(e){}

  // 護摩木カウント
  var totalCount = 1284;
  try {
    totalCount += parseInt(localStorage.getItem('nacha_goma_count') || '0', 10);
  } catch(e){}
  $('gomaCount').textContent = totalCount.toLocaleString();

  function showToast(msg) {
    var t = $('toastMsg');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  // 護摩木を火にくべる
  $('gomaForm').addEventListener('submit', function(e){
    e.preventDefault();
    var text = $('gomaInput').value.trim();
    if (!text) return;
    lastBurnedWish = text;

    // 護摩木が飛んで火に飛び込むアニメーション
    var wood = document.createElement('div');
    wood.className = 'flying-wood';
    wood.textContent = text.slice(0, 10);
    $('gomaStage').appendChild(wood);

    try { navigator.vibrate && navigator.vibrate([40, 60, 90]); } catch(err){}

    setTimeout(function(){
      wood.remove();
      // 炎を爆発的に燃え上がらせる
      targetIntensity = 2.8;
      totalCount++;
      $('gomaCount').textContent = totalCount.toLocaleString();
      try { localStorage.setItem('nacha_goma_count', (totalCount - 1284)); } catch(err){}

      // コイン付与
      if (window.NachaCoins) {
        window.NachaCoins.earn('goma_burn', 5, e);
      }

      // 祈祷完了モーダル表示
      $('blessText').innerHTML = 
        '「' + escapeHtml(text) + '」<br><br>' +
        '<span style="font-size:13px;color:#F4D03F">祈りは神火に包まれ、悠遊観音堂の神々へと届きました。<br>迷いや胃痛はすべて焼き払われ、清らかな道が開かれます！</span>';
      $('blessModal').classList.add('open');
      $('gomaInput').value = '';
    }, 1100);
  });

  function escapeHtml(str) {
    return (str || '').replace(/[&<>"']/g, function(m){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m];
    });
  }

  $('modalClose').addEventListener('click', function(){ $('blessModal').classList.remove('open'); });

  $('btnShareGoma').addEventListener('click', function(){
    var tweet = 'ナチャ寺院の護摩焚きで祈願してきました！🔥🪷\n' +
      '【祈願】' + lastBurnedWish + '\n' +
      '神火でモヤモヤも胃痛も浄化！絶対大丈夫！\n\n' +
      '#NACHA #護摩焚き #推し活祈願\n' +
      'https://towananika.github.io/nacha/goma/';
    window.open('https://x.com/intent/tweet?text=' + encodeURIComponent(tweet), '_blank', 'noopener');
  });

})();
</script>
</body></html>
