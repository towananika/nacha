<style>
/* ══════════════════════════════════════════════════
   VISUAL-FIRST ZEN TEMPLE UI
   テキストを極限まで減らし、美しいイメージを主役に
══════════════════════════════════════════════════ */
.visual-stage {
  text-align: center;
  padding: 20px 0 28px;
}
.visual-nacha-hero {
  position: relative;
  width: 220px;
  height: 220px;
  margin: 0 auto 16px;
  display: grid;
  place-items: center;
  cursor: pointer;
}
.visual-nacha-hero::before {
  content: "";
  position: absolute;
  inset: -12px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(192,57,43,0.18) 0%, rgba(212,172,13,0.08) 50%, transparent 72%);
  z-index: 0;
  animation: pulseAura 4s ease-in-out infinite alternate;
}
@keyframes pulseAura {
  0% { transform: scale(0.95); opacity: 0.7; }
  100% { transform: scale(1.06); opacity: 1; }
}
.visual-nacha-img {
  width: 180px;
  height: auto;
  position: relative;
  z-index: 1;
  filter: drop-shadow(0 14px 28px rgba(0,0,0,0.15));
  transition: transform .25s cubic-bezier(.34,1.56,.64,1);
}
.visual-nacha-hero:active .visual-nacha-img {
  transform: scale(0.92);
}
.visual-bubble {
  display: inline-block;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 8px 22px;
  font-size: 14px;
  font-weight: 800;
  color: var(--ink);
  box-shadow: 0 4px 16px rgba(0,0,0,0.05);
}

/* ── ビジュアル・ピクチャーカード（文字少なめ・画像が主役） ── */
.visual-doors-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
  margin: 12px 0 32px;
}
@media (min-width: 620px) {
  .visual-doors-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
}
.visual-door-card {
  position: relative;
  height: 220px;
  border-radius: 22px;
  overflow: hidden;
  text-decoration: none;
  box-shadow: var(--shadow);
  border: 1px solid rgba(255,255,255,0.2);
  display: flex;
  align-items: flex-end;
  padding: 18px;
  transition: transform .25s ease, box-shadow .25s ease;
}
.visual-door-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 16px 32px rgba(0,0,0,0.16);
}
.door-bg-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .4s ease;
  z-index: 0;
}
.visual-door-card:hover .door-bg-img {
  transform: scale(1.05);
}
.door-scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(16,10,8,0.92) 0%, rgba(16,10,8,0.4) 50%, rgba(16,10,8,0.1) 100%);
  z-index: 1;
}
.door-caption {
  position: relative;
  z-index: 2;
  color: #fff;
  width: 100%;
}
.door-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .08em;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(255,255,255,0.22);
  backdrop-filter: blur(8px);
  margin-bottom: 6px;
  color: #fff;
}
.door-title {
  margin: 0;
  font-size: 20px;
  font-weight: 800;
  font-family: "Lilita One", "M PLUS Rounded 1c", sans-serif;
  letter-spacing: .03em;
  line-height: 1.2;
  text-shadow: 0 2px 8px rgba(0,0,0,0.4);
}

/* ── 4柱の神様ビジュアル・ストリップ ── */
.pantheon-strip {
  position: relative;
  border-radius: 22px;
  overflow: hidden;
  height: 140px;
  margin-bottom: 32px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  display: block;
  text-decoration: none;
}
.pantheon-strip img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 25%;
  transition: transform .4s ease;
}
.pantheon-strip:hover img {
  transform: scale(1.03);
}
.pantheon-scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(to right, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 60%, transparent 100%);
  display: flex;
  align-items: center;
  padding: 0 20px;
}
.pantheon-info {
  color: #fff;
}
.pantheon-info h3 {
  margin: 0 0 2px;
  font-size: 18px;
  font-weight: 800;
}
.pantheon-info p {
  margin: 0;
  font-size: 12px;
  color: #f1e9df;
  opacity: .9;
}
</style>
