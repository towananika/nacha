<!doctype html>
<html lang="ja" id="docRoot">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>みんなの絵馬 — NACHA</title>
<meta name="description" content="小さな守護神ナチャへのひとことを、絵馬に書いて掛けよう。読むのはだれでも、書くときはログイン。">
<link rel="icon" href="../assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/site.css">
<style>
:root{--washi:#f5f0e6;--paper:#fbf9f4;--ink:#2b241e;--ink-light:#6e6259;--vermilion:#b83823;--gold:#bfa15f;--line-gold:rgba(191,161,95,.45);--wood:#e9d6b3;--wood-edge:#c9a66b}
*{box-sizing:border-box}
body{margin:0;background:var(--washi);color:var(--ink);font-family:"Shippori Mincho","Noto Serif JP",serif;padding:20px 16px calc(96px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.top a{color:var(--ink);text-decoration:none;font-size:13px;letter-spacing:.08em}
.top .brand{font-weight:700;letter-spacing:.24em}
.pill{border:1px solid var(--line-gold);border-radius:999px;padding:6px 14px;background:var(--paper)}
h1{font-size:24px;letter-spacing:.14em;margin:6px 0 8px;text-align:center}
.eyebrow{text-align:center;color:var(--vermilion);font-size:11px;letter-spacing:.24em}
.lead{text-align:center;color:var(--ink-light);font-size:13.5px;line-height:2;margin:0 0 22px}
.write{background:var(--paper);border:1px solid var(--line-gold);border-radius:16px;padding:16px 18px;margin-bottom:26px}
.write label{display:block;font-size:12px;color:var(--ink-light);letter-spacing:.1em;margin-bottom:8px}
.write textarea{width:100%;min-height:84px;resize:vertical;border:1px solid var(--line-gold);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;line-height:1.8;background:#fff;color:var(--ink)}
.write .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:12px}
.count{font-size:12px;color:var(--ink-light)}
.btn{border:0;border-radius:999px;background:var(--vermilion);color:#fff;font:inherit;font-weight:700;font-size:14px;letter-spacing:.08em;padding:10px 22px;cursor:pointer}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-gold);font-weight:600}
.note{font-size:12.5px;color:var(--ink-light);line-height:1.9;margin:10px 0 0}
.note a{color:var(--vermilion)}
.msg{font-size:13px;margin-top:8px;min-height:1em}
.msg.err{color:var(--vermilion)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.ema{position:relative;background:var(--wood);border:1px solid var(--wood-edge);border-radius:6px;padding:28px 14px 12px;clip-path:polygon(18% 0,82% 0,100% 16%,100% 100%,0 100%,0 16%);box-shadow:0 4px 10px rgba(43,36,30,.06)}
.ema::before{content:"";position:absolute;top:10px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--vermilion)}
.ema p{margin:0;font-size:14px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.ema .by{display:block;margin-top:8px;font-size:11.5px;color:var(--ink-light)}
.ema .reply{display:block;margin-top:8px;padding-top:8px;border-top:1px dashed var(--wood-edge);font-size:12px;color:var(--vermilion)}
.ema .hide{margin-top:8px;font-size:11px;padding:4px 10px}
.empty{text-align:center;color:var(--ink-light);font-size:13.5px;line-height:2;padding:24px 0}
.more{display:block;margin:20px auto 0}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(251,249,244,.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line-gold);display:flex;justify-content:space-around;padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:100}
.tabs a{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--ink-light);font-size:11px;gap:2px}
.tabs a span{font-size:18px}.tabs a b{font-weight:600}
.tabs a[aria-current="page"]{color:var(--vermilion)}
</style>
<link rel="stylesheet" href="../assets/mobile.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="brand" href="../">NACHA</a>
    <a class="pill" id="acct" href="../team/">ログイン</a>
  </div>

  <div class="eyebrow">EMA BOARD</div>
  <h1>みんなの絵馬</h1>
  <p class="lead">ナチャへのひとことを、絵馬に書いて掛けよう。<br>読むのはだれでも、書くときはログインしてね。</p>

  <section class="write" id="write">
    <label for="emaText">ナチャへのひとこと（140字まで）</label>
    <textarea id="emaText" maxlength="140" placeholder="今日うれしかったこと、ナチャに聞いてほしいこと"></textarea>
    <div class="row">
      <span class="count" id="count">0 / 140</span>
      <button class="btn" id="emaSend" type="button" disabled>絵馬を掛ける</button>
    </div>
    <div class="msg" id="msg" role="status"></div>
    <p class="note" id="loginNote" hidden>絵馬を書くには<a href="../team/">ログイン</a>してね。読むだけならそのままで大丈夫。</p>
  </section>

  <section aria-label="みんなの絵馬">
    <div class="board" id="board"></div>
    <p class="empty" id="empty" hidden>まだ絵馬がありません。最初のひとことを掛けてみてね。</p>
    <p class="empty" id="offline" hidden>絵馬掛けは準備中です。もう少しだけ待っていてね。</p>
    <button class="btn ghost more" id="more" type="button" hidden>もっと見る</button>
  </section>

  <p class="note" style="text-align:center;margin-top:28px">ほかの人がいやな気持ちになる言葉や、個人情報は書かないでね。<br>ふさわしくない絵馬は、運営がそっと外すことがあります。</p>
</div>

<nav class="tabs" aria-label="Main">
  <a href="../"><span aria-hidden="true">🏮</span><b>ホーム</b></a>
  <a href="../characters/"><span aria-hidden="true">🪷</span><b>名鑑</b></a>
  <a href="../amulet/"><span aria-hidden="true">🧧</span><b>お守り</b></a>
  <a href="../quiz/"><span aria-hidden="true">🔮</span><b>診断</b></a>
</nav>

<script src="../assets/ema.js"></script>
</body>
</html>
